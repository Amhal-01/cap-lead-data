 {id:'18b',type:'choose',title:'Que fait le lead ?',q:'Pour chaque situation, choisis la réaction de lead.',items:[{l:'Une PR complexe de ton meilleur DE attend ta revue depuis 2 jours ; tu es en plein code',o:['Finir ton code d’abord','Interrompre, relire dans l’heure ; ton code attend','Demander à un junior de relire'],a:1},{l:'Deux seniors se disputent sur Kafka vs Pub/Sub depuis 3 réunions',o:['Laisser le débat se faire','Demander une matrice de décision écrite pour vendredi, puis trancher','Décider seul tout de suite'],a:1},{l:'Un junior propose une architecture que tu juges mauvaise',o:['L’expliquer et imposer la tienne','Poser les questions de défaillance et de coût, le laisser conclure, pairer sur un prototype de 2 jours si doute','Le laisser faire pour qu’il apprenne'],a:1},{l:'Tu es le seul à savoir opérer le job Dataflow',o:['C’est normal, tu es le lead','Programmer un pairing et un runbook cette semaine ; faire déployer la prochaine release par quelqu’un d’autre','Documenter plus tard'],a:1}],sol:['Le lead débloque les autres avant de produire lui-même, transforme les débats en décisions écrites, fait réfléchir plutôt qu’il n’impose, et détruit activement sa propre indispensabilité.']},
 {id:'18c',type:'flags',title:'Signes de goulot',q:'Coche les signaux que le lead est devenu le goulot de l’équipe.',items:[{t:'Les PRs attendent en moyenne 3 jours sa revue',f:true},{t:'L’équipe a pris une décision d’architecture en son absence et l’a écrite dans un ADR',f:false},{t:'Il est en copie de tous les messages et répond à tous',f:true},{t:'Chaque incident l’implique directement, même la nuit',f:true},{t:'Un DE a déployé seul un job Dataflow la semaine dernière',f:false},{t:'Il passe 70 % de son temps à coder un composant que lui seul connaît',f:true}],sol:['Le multiplicateur rend l’équipe autonome ; le goulot centralise décisions, revues et incidents.']},
],
19:[
 {id:'19a',entry:true,type:'estimate',title:'Capacité réelle du trimestre',q:'<b>4 ingénieurs</b>, <b>12 semaines</b>, disponibilité réelle <b>80 %</b> (congés, réunions, support). <b>25 %</b> de la capacité réservée à la dette et aux incidents.',fields:[{l:'Semaines-personne disponibles pour la roadmap',u:'sem.-pers.',a:28.8,tol:.05}],sol:['4 × 12 × 0,8 = 38,4 semaines-personne. Moins 25 % : 28,8.','Avec un facteur d’incertitude ×1,5 sur les estimations, ça fait environ 19 semaines « estimées ». Une roadmap de 12 objectifs à 5 semaines chacun est donc une fiction.']},
 {id:'19b',type:'choose',title:'Prioriser avec des chiffres',q:'Cinq initiatives, notes impact (1-10) / effort (semaines) : A migration Write API 6/2 · B nouveau feature store 7/10 · C partitionnement BigQuery 9/3 · D refonte monitoring 5/6 · E rejeu automatisé DLQ 4/1. Capacité : 8 semaines.',items:[{l:'Première initiative (meilleur ratio impact/effort)',o:['A','C','E'],a:1},{l:'Ensemble retenu pour 8 semaines',o:['B seul (7 points)','C + A + E (3+2+1 = 6 sem., 19 points)','C + D (9 sem.)'],a:1},{l:'Que dire au sponsor de B ?',o:['Non','« B vaut 7 pour 10 semaines ; C+A+E valent 19 pour 6. B au trimestre suivant, sauf si l’on retire C. »','« On essaiera »'],a:1}],sol:['Ratio : C = 3, A = 3, E = 4, D = 0,8, B = 0,7. E a le meilleur ratio mais C a le plus d’impact absolu : commencer par C, le ratio sert à ordonner le reste.','Rendre l’arbitrage visible et chiffré, et laisser le sponsor décider ce qu’il retire.']},
 {id:'19c',type:'build',title:'Roadmap deux trimestres',q:'Rédige et présente la roadmap. Note-la.',crit:['3 à 5 objectifs par trimestre, chacun avec un résultat observable','Chaque objectif estimé en semaines-personne, avec un facteur d’incertitude','20 à 30 % de capacité budgétée pour dette et incidents, négociée une fois','Dépendances externes nommées (équipes, API, budget)','Ce qui a été volontairement écarté et pourquoi','Présentée en 15 min, trois objections notées, version révisée publiée'],sol:['La version révisée après objections est la vraie roadmap.']},

/* ---------- State ---------- */
const KEY='capLeadData.v1';
let S = {start:'2026-11-09', weeks:{}, focus:[], journal:{}};
try{ const raw=localStorage.getItem(KEY); if(raw){ const p=JSON.parse(raw); S=Object.assign(S,p); } }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} renderHeader(); renderRail(); }
function W(n){ if(!S.weeks[n]) S.weeks[n]={tasks:[], quiz:null, critique:'', critiqueDone:false, deliverable:false, retro:{}, ch:{}}; if(!S.weeks[n].ch) S.weeks[n].ch={}; return S.weeks[n]; }

/* ---------- Dates ---------- */
const DAY=86400000;
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function startOf(n){ const d=parseDate(S.start); d.setDate(d.getDate()+7*(n-1)); return d; }
function endOf(n){ const d=startOf(n); d.setDate(d.getDate()+6); return d; }
const MONTHS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function fmt(d){ return d.getDate()+' '+MONTHS[d.getMonth()]; }
function fmtLong(d){ return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear(); }
function range(n){ return fmt(startOf(n))+' → '+fmt(endOf(n)); }
function today(){ const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); }
function calendarWeek(){ const t=today(); const s=parseDate(S.start); const n=Math.floor((t-s)/(7*DAY))+1; return Math.max(0, Math.min(25, n)); }

/* ---------- Progress ---------- */
function weekParts(w){ const st=W(w.n); const tasks=w.tasks.map((_,i)=>!!st.tasks[i]); const quizOk = st.quiz!=null && st.quiz>=2; const chs=CHS(w.n); return {tasksDone:tasks.filter(Boolean).length, tasksTotal:w.tasks.length, quizOk, quizScore:st.quiz, critOk:!w.critique||st.critiqueDone, deliv:st.deliverable, chDone:chs.filter(c=>chOk(w,c)).length, chTotal:chs.length}; }
function weekPct(w){ const p=weekParts(w); const items=p.tasksTotal+1+(w.critique?1:0)+1+p.chTotal; const done=p.tasksDone+(p.quizOk?1:0)+(w.critique&&p.critOk?1:0)+(p.deliv?1:0)+p.chDone; return Math.round(100*done/items); }
function isDone(w){ return weekPct(w)===100; }
function status(w){ if(isDone(w)) return 'done'; const t=today(); if(t>endOf(w.n)) return 'late'; if(t>=startOf(w.n)) return 'cur'; return 'next'; }
const LABEL={done:'Terminée',late:'En retard',cur:'En cours',next:'À venir'};
function overallPct(){ return Math.round(WEEKS.reduce((a,w)=>a+weekPct(w),0)/WEEKS.length); }
function phaseOf(n){ return PHASES.find(p=>n>=p.weeks[0]&&n<=p.weeks[1]); }
function nextToFinish(){ return WEEKS.find(w=>!isDone(w)) || null; }

/* ---------- Routing ---------- */
let route='dashboard';
function go(r){ route=r; try{ if(location.hash!=='#'+r) location.hash=r; }catch(e){} document.body.classList.remove('menu'); render(); document.getElementById('main').scrollTop=0; }
window.addEventListener('hashchange',()=>{ const h=location.hash.replace('#',''); if(h && h!==route){ route=h; render(); } });

/* ---------- Render ---------- */
const $=s=>document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),1800); }

function renderHeader(){ const p=overallPct(); const b=$('#hbar'); b.querySelector('i').style.width=p+'%'; b.classList.toggle('ok',p===100); $('#hpct').textContent=p+' %'; }

function renderRail(){
  const rail=$('#rail'); const views=[['dashboard','Tableau de bord','⌂'],['timeline','Timeline','24'],['critique','Sens critique','?'],['journal','Journal','✎'],['reglages','Réglages','⚙']];
  let h='<div class="views">'+views.map(v=>`<button data-go="${v[0]}" class="${route===v[0]?'active':''}"><span>${v[1]}</span><span class="k">${v[2]}</span></button>`).join('')+'</div>';
  PHASES.forEach(ph=>{ const ws=WEEKS.filter(w=>w.n>=ph.weeks[0]&&w.n<=ph.weeks[1]); const d=ws.filter(isDone).length;
    h+=`<div class="phase"><div class="ph"><span>${ph.id}</span>${esc(ph.name)}<span style="margin-left:auto;color:var(--faint)">${d}/${ws.length}</span></div>`;
    h+=ws.map(w=>`<button class="wk ${status(w)} ${route==='w'+w.n?'active':''}" data-go="w${w.n}"><i class="d"></i><span class="n">S${w.n}</span><span class="t">${esc(w.title)}</span></button>`).join('')+'</div>'; });
  rail.innerHTML=h;
}

function render(){ renderRail(); renderHeader(); const v=$('#view');
  if(route.startsWith('w')){ const n=parseInt(route.slice(1)); const w=WEEKS.find(x=>x.n===n); if(w){ v.innerHTML=viewWeek(w); bindWeek(w); return; } }
  if(route==='timeline'){ v.innerHTML=viewTimeline(); return; }
  if(route==='critique'){ v.innerHTML=viewCritique(); return; }
  if(route==='journal'){ v.innerHTML=viewJournal(); bindJournal(); return; }
  if(route==='reglages'){ v.innerHTML=viewSettings(); bindSettings(); return; }
  route='dashboard'; v.innerHTML=viewDashboard();
}

function viewDashboard(){
  const cw=calendarWeek(); const t=today(); const nxt=nextToFinish(); const late=WEEKS.filter(w=>status(w)==='late');
  const curW = cw>=1&&cw<=24 ? WEEKS[cw-1] : null;
  const fs=S.focus.length; const fmin=S.focus.reduce((a,f)=>a+f.min,0);
  let banner='';
  if(cw<1) banner=`<div class="banner"><p>Le parcours commence le <b>${fmtLong(parseDate(S.start))}</b>. D’ici là, lis la semaine 1 et prépare ton espace de travail (un seul onglet : celui-ci).</p><button class="btn primary" data-go="w1">Ouvrir la semaine 1</button></div>`;
  else if(cw>24) banner=`<div class="banner ${nxt?'late':''}"><p>${nxt?'Le calendrier est fini mais il reste des semaines à terminer. Finis-les dans l’ordre.':'Parcours terminé. Ton plan 30/60/90 est ta prochaine feuille de route.'}</p>${nxt?`<button class="btn primary" data-go="w${nxt.n}">Reprendre S${nxt.n}</button>`:''}</div>`;
  else if(late.length) banner=`<div class="banner late"><p><b>${late.length} semaine${late.length>1?'s':''} en retard</b> (${late.map(w=>'S'+w.n).join(', ')}). Règle du parcours : on termine la plus ancienne avant d’avancer. Commence par <b>S${late[0].n}</b>.</p><button class="btn primary" data-go="w${late[0].n}">Rattraper S${late[0].n}</button></div>`;
  else if(curW) banner=`<div class="banner"><p>Tu es dans les temps. Semaine du calendrier : <b>S${cw}</b>, ${esc(curW.title)}.</p><button class="btn primary" data-go="w${cw}">Travailler sur S${cw}</button></div>`;
  const phases=PHASES.map(ph=>{ const ws=WEEKS.filter(w=>w.n>=ph.weeks[0]&&w.n<=ph.weeks[1]); const p=Math.round(ws.reduce((a,w)=>a+weekPct(w),0)/ws.length);
    return `<div style="display:grid;grid-template-columns:32px 1fr 120px 44px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)"><span class="pill" style="justify-content:center;padding:2px 0">${ph.id}</span><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(ph.name)} <span style="color:var(--faint);font-family:var(--mono);font-size:11px">S${ph.weeks[0]}–S${ph.weeks[1]}</span></span><div class="bar ${p===100?'ok':''}"><i style="width:${p}%"></i></div><b class="num" style="font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted);text-align:right">${p} %</b></div>`; }).join('');
  return `<div class="eyebrow">${fmtLong(t)} · Objectif : Technical Data Lead</div><h2 class="title">Tableau de bord</h2><p class="lead">Six phases, vingt-quatre semaines, un seul endroit. On apprend en se trompant sur des défis corrigés, pas en lisant. Chaque semaine se termine par un livrable montré à quelqu’un. Le retard se rattrape dans l’ordre, jamais en sautant.</p>
  ${banner}
  <section class="block"><h2>État</h2><div class="grid">
    <div class="card stat"><div class="l">Progression</div><div class="v num">${overallPct()} %</div><div class="s">${WEEKS.filter(isDone).length} semaines terminées sur 24</div></div>
    <div class="card stat"><div class="l">Calendrier</div><div class="v num">${cw<1?'J−'+Math.ceil((parseDate(S.start)-t)/DAY):cw>24?'Fin':'S'+cw}</div><div class="s">${cw>=1&&cw<=24?range(cw):'du '+fmtLong(parseDate(S.start))}</div></div>
    <div class="card stat"><div class="l">Prochaine à finir</div><div class="v num">${nxt?'S'+nxt.n:'—'}</div><div class="s">${nxt?esc(nxt.title):'Tout est terminé'}</div></div>
    <div class="card stat"><div class="l">Sessions focus</div><div class="v num">${fs}</div><div class="s">${Math.round(fmin/60*10)/10} h de travail protégé</div></div>
  </div></section>
  <section class="block"><h2>Phases</h2><div class="card" style="padding-block:4px">${phases}</div></section>
  <section class="block"><h2>Pourquoi ce parcours, pour toi</h2><div class="card lesson">
    <div class="pt key"><h3>Le point de départ</h3><p>Le parcours suppose une expérience de plateforme data de bout en bout : entrepôt, dbt, Airflow, Kubernetes, GitOps, un peu de FinOps, de sécurité et de mentorat. C’est une base de lead plateforme ; il reste à la rendre solide sur le streaming GCP et à l’exercer comme lead.</p></div>
    <div class="pt"><h3>Ce qu’on attaque</h3><ul><li><b>Pub/Sub et Dataflow</b> (S1–S10) : tu les as peut-être déjà utilisés ; tu dois maintenant pouvoir les concevoir, les faire tourner et les expliquer mieux que quiconque dans l’équipe. C’est la moitié du parcours parce que c’est la faiblesse que tu nommes.</li><li><b>Sens critique</b> (S11–S14, puis chaque semaine) : chaque semaine contient un « défi critique » : une proposition à démonter avant de voir ce qu’un lead y verrait.</li><li><b>BigQuery à l’échelle</b> : ton FinOps doit se transposer à BigQuery.</li><li><b>Fiabilité formalisée</b> (SLO, contrats, post-mortems) : tu fais déjà du run, il faut le rendre explicite et transmissible.</li><li><b>Leadership écrit</b> : ADR, roadmap, communication direction, en anglais. Le CV décrit des réalisations ; un lead est jugé sur ce qu’il fait décider et grandir.</li></ul></div>
    <div class="pt"><h3>Les règles</h3><ul><li>Une semaine commence par un <b>défi d’entrée</b> à tenter avant la leçon : se tromper là est le but. Puis la leçon, deux ou trois défis corrigés (estimations, bugs à trouver, configurations, simulateurs, livrables notés sur grille), trois pratiques sur ta vraie plateforme, un quiz, un défi critique, un livrable.</li><li>Un défi raté se refait jusqu’à être réussi ; la semaine n’est validée qu’avec tous les défis réussis.</li><li>Pas d’autre onglet pendant une session focus. Tout ce qu’il faut lire est ici.</li><li>En retard ? On finit la semaine la plus ancienne d’abord.</li></ul></div>
  </div></section>`;
}

function viewTimeline(){
  const cells=WEEKS.map(w=>`<i class="${status(w)}" title="S${w.n}"></i>`).join('');
  const labels=PHASES.map(p=>`<span>${p.id}</span>`).join('');
  let rows='';
  PHASES.forEach(ph=>{ rows+=`<div class="ph">${ph.id} · ${esc(ph.name)}</div>`; WEEKS.filter(w=>w.n>=ph.weeks[0]&&w.n<=ph.weeks[1]).forEach(w=>{ const s=status(w); rows+=`<div class="tr" data-go="w${w.n}"><span class="n">S${w.n}</span><span class="t">${esc(w.title)}<small>${range(w.n)} · ${weekPct(w)} %</small></span><span class="pill ${s}">${LABEL[s]}</span></div>`; }); });
  return `<div class="eyebrow">Du ${fmtLong(parseDate(S.start))} au ${fmtLong(endOf(24))}</div><h2 class="title">Timeline</h2><p class="lead">Vingt-quatre cases. Ambre : la semaine du calendrier. Vert : terminée. Corail : dépassée sans être terminée.</p>
  <section class="block"><h2>Vue d’ensemble</h2><div class="card"><div class="gantt">${cells}</div><div class="glabels">${labels}</div></div></section>
  <section class="block"><h2>Semaines</h2><div class="card tl" style="padding:14px 6px">${rows}</div></section>`;
}

function viewWeek(w){
  const st=W(w.n); const s=status(w); const ph=phaseOf(w.n); const p=weekParts(w); const pct=weekPct(w);
  const lesson=w.lesson.map(l=>`<div class="pt ${l.key?'key':''}"><h3>${l.h}</h3><div>${l.p}</div>${l.why?`<p class="why">${l.why}</p>`:''}</div>`).join('');
  const tasks=w.tasks.map((t,i)=>`<label class="task ${st.tasks[i]?'on':''}"><input type="checkbox" id="t${w.n}_${i}" data-task="${i}" ${st.tasks[i]?'checked':''}><span>${esc(t)}</span></label>`).join('');
  const quiz=w.quiz.map((q,i)=>`<div class="q" data-q="${i}"><div class="qt">${i+1}. ${q.q}</div><div class="opts">${q.o.map((o,j)=>`<button class="opt" data-opt="${j}">${esc(o)}</button>`).join('')}</div><div class="expl" hidden>${q.e}</div></div>`).join('');
  const fsess=S.focus.filter(f=>f.week===w.n).length;
  const chs=CHS(w.n); const entry=chs.filter(c=>c.entry); const rest=chs.filter(c=>!c.entry);
  const prev=w.n>1?`<button class="btn" data-go="w${w.n-1}">← S${w.n-1}</button>`:''; const next=w.n<24?`<button class="btn" data-go="w${w.n+1}">S${w.n+1} →</button>`:'';
  return `<div class="eyebrow">${ph.id} · ${esc(ph.name)} · ${range(w.n)}</div><h2 class="title">S${w.n} · ${esc(w.title)}</h2><p class="lead">${esc(w.goal)}</p>
  <div class="row" style="margin-top:14px"><span class="pill ${s}">${LABEL[s]}</span><span class="pill">${pct} % fait</span><span class="pill">${p.chDone}/${p.chTotal} défis</span><span class="pill">${fsess} session${fsess>1?'s':''} focus</span><span style="flex:1"></span><button class="btn primary" id="wkFocus">◉ Focus sur cette semaine</button></div>
  ${entry.length?`<section class="block"><h2>Défi d’entrée <span class="st">tente avant de lire la leçon</span></h2>${entry.map(c=>renderCh(w,c)).join('')}</section>`:''}
  <section class="block"><h2>Leçon <span class="st">maintenant, lis en entier</span></h2><div class="lesson">${lesson}</div></section>
  ${rest.length?`<section class="block"><h2>Défis <span class="st">réussir chacun pour valider la semaine</span></h2>${rest.map(c=>renderCh(w,c)).join('')}</section>`:''}
  <section class="block"><h2>Pratique sur ta plateforme <span class="st">${p.tasksDone}/${p.tasksTotal}</span></h2><div class="tasks">${tasks}</div></section>
  <section class="block"><h2>Quiz <span class="st">${st.quiz!=null?(p.quizOk?'validé '+st.quiz+'/3':'à refaire '+st.quiz+'/3'):'3 questions'}</span></h2><div class="card" id="quiz">${quiz}<div class="row"><button class="btn" id="quizReset" ${st.quiz==null?'hidden':''}>Refaire le quiz</button><span class="hint">Validé à partir de 2 bonnes réponses. Les explications apparaissent après chaque réponse.</span></div></div></section>
  ${w.critique?`<section class="block"><h2>Défi critique <span class="st">${st.critiqueDone?'fait':'à faire'}</span></h2><div class="card"><div class="scenario"><div class="who">${esc(w.critique.who)}</div><div>${w.critique.text}</div></div><p class="hint" style="margin-bottom:8px">Écris ta critique avant de dévoiler le regard du lead : problèmes, questions à poser, alternative. Cinq lignes minimum.</p><textarea id="crit${w.n}" placeholder="Ce que je vois, ce que je demanderais, ce que je proposerais…">${esc(st.critique)}</textarea><div class="row"><button class="btn" id="critReveal" ${st.critique.trim().length<40?'disabled':''}>Comparer avec le regard d’un lead</button><label class="task" style="padding:6px 10px"><input type="checkbox" id="critDone${w.n}" ${st.critiqueDone?'checked':''}><span>Défi fait</span></label></div><div class="model" id="critModel" ${st.critiqueDone?'':'hidden'}><h4>Ce qu’un lead expérimenté y verrait</h4><ul>${w.critique.model.map(m=>`<li>${m}</li>`).join('')}</ul></div></div></section>`:''}
  <section class="block"><h2>Livrable de la semaine</h2><label class="task ${st.deliverable?'on':''}" style="padding:14px 16px"><input type="checkbox" id="deliv${w.n}" ${st.deliverable?'checked':''}><span><b>${esc(w.deliverable)}</b></span></label></section>
  <section class="block"><h2>Rétro de fin de semaine</h2><div class="card" style="display:flex;flex-direction:column;gap:10px">
    <label>Qu’ai-je appris que je ne savais pas lundi ?<textarea id="r1_${w.n}" style="min-height:70px;margin-top:4px">${esc(st.retro.a||'')}</textarea></label>
    <label>Où ai-je hésité ou survolé ?<textarea id="r2_${w.n}" style="min-height:70px;margin-top:4px">${esc(st.retro.b||'')}</textarea></label>
    <label>Qu’est-ce que je ferais différemment, et quand ?<textarea id="r3_${w.n}" style="min-height:70px;margin-top:4px">${esc(st.retro.c||'')}</textarea></label>
  </div></section>
  <div class="row" style="justify-content:space-between;margin-top:30px">${prev}<span></span>${next}</div>`;
}

function bindWeek(w){ const st=W(w.n); const v=$('#view');
  v.querySelectorAll('[data-task]').forEach(cb=>cb.addEventListener('change',()=>{ st.tasks[+cb.dataset.task]=cb.checked; cb.closest('.task').classList.toggle('on',cb.checked); save(); refreshWeekHeader(w); }));
  // quiz
  const answers={};
  v.querySelectorAll('.q').forEach(qd=>{ const qi=+qd.dataset.q; const q=w.quiz[qi];
    qd.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{ if(answers[qi]!=null) return; const j=+b.dataset.opt; answers[qi]=j; qd.querySelectorAll('.opt').forEach(x=>{x.disabled=true;}); b.classList.add(j===q.a?'right':'wrong'); if(j!==q.a) qd.querySelectorAll('.opt')[q.a].classList.add('right'); qd.querySelector('.expl').hidden=false;
      if(Object.keys(answers).length===w.quiz.length){ const score=w.quiz.filter((qq,k)=>answers[k]===qq.a).length; st.quiz=score; save(); $('#quizReset').hidden=false; toast(score>=2?'Quiz validé : '+score+'/3':'Quiz à refaire : '+score+'/3'); refreshWeekHeader(w); } })); });
  if(st.quiz!=null){ v.querySelectorAll('.q .opt').forEach(b=>b.disabled=true); v.querySelectorAll('.q').forEach(qd=>{ const q=w.quiz[+qd.dataset.q]; qd.querySelectorAll('.opt')[q.a].classList.add('right'); qd.querySelector('.expl').hidden=false; }); }
  const qr=$('#quizReset'); if(qr) qr.addEventListener('click',()=>{ st.quiz=null; save(); render(); });
  // critique
  const ta=$('#crit'+w.n); if(ta){ ta.addEventListener('input',()=>{ st.critique=ta.value; $('#critReveal').disabled=ta.value.trim().length<40; clearTimeout(bindWeek.t); bindWeek.t=setTimeout(save,400); });
    $('#critReveal').addEventListener('click',()=>{ $('#critModel').hidden=false; st.critiqueDone=true; $('#critDone'+w.n).checked=true; save(); refreshWeekHeader(w); });
    $('#critDone'+w.n).addEventListener('change',e=>{ st.critiqueDone=e.target.checked; if(e.target.checked) $('#critModel').hidden=false; save(); refreshWeekHeader(w); }); }
  $('#deliv'+w.n).addEventListener('change',e=>{ st.deliverable=e.target.checked; e.target.closest('.task').classList.toggle('on',e.target.checked); save(); refreshWeekHeader(w); if(e.target.checked&&isDone(w)) toast('Semaine '+w.n+' terminée'); });
  ['a','b','c'].forEach((k,i)=>{ const el=$('#r'+(i+1)+'_'+w.n); el.addEventListener('input',()=>{ st.retro[k]=el.value; clearTimeout(bindWeek['r'+k]); bindWeek['r'+k]=setTimeout(save,400); }); });
  $('#wkFocus').addEventListener('click',()=>openFocus(w.n));
  CHS(w.n).forEach(c=>bindCh(w,c));
}
function refreshWeekHeader(w){ const pills=$('#view .row .pill'); if(!pills) return; const s=status(w); const row=$('#view .row'); const p=weekParts(w); row.children[0].className='pill '+s; row.children[0].textContent=LABEL[s]; row.children[1].textContent=weekPct(w)+' % fait'; row.children[2].textContent=p.chDone+'/'+p.chTotal+' défis'; }

/* ---------- Challenge engine ---------- */
function CHS(n){ return CH[n]||[]; }
function chState(w,c){ const st=W(w.n); if(!st.ch[c.id]) st.ch[c.id]={s:null,d:{}}; return st.ch[c.id]; }
function chOk(w,c){ return chState(w,c).s==='ok'; }
const CHLABEL={estimate:'Estimation',choose:'Configurer',bugs:'Trouver les défauts',flags:'Repérer',build:'Livrable noté',sim:'Simulateur'};
const SLABEL={ok:'Réussi',partial:'Partiel',fail:'Raté'};
const fmtNum=n=>Number(n).toLocaleString('fr-FR');
function chHead(c,cs){ return `<div class="chh"><span class="pill">${CHLABEL[c.type]}</span>${c.entry?'<span class="pill cur">Avant la leçon</span>':''}<span class="pill ${cs.s==='ok'?'done':cs.s==='fail'?'late':''}" data-chstatus>${cs.s?SLABEL[cs.s]:'À faire'}</span></div><h3>${esc(c.title)}</h3><p class="chq">${c.q}</p>`; }
function renderCh(w,c){ const cs=chState(w,c); const d=cs.d; let body='';
  if(c.type==='estimate'){ body=`<div class="fields">${c.fields.map((f,i)=>`<label class="fld"><span>${f.l}</span><span class="in"><input type="number" step="any" id="${c.id}_f${i}" value="${d.vals&&d.vals[i]!=null?d.vals[i]:''}"><em>${f.u}</em></span><b class="fres" id="${c.id}_r${i}"></b></label>`).join('')}</div><div class="row"><button class="btn primary" data-act="check">Vérifier</button><span class="hint">C’est l’ordre de grandeur qui compte : quelques pourcents de tolérance.</span></div>`; }
  else if(c.type==='choose'){ body=`<div class="fields">${c.items.map((it,i)=>`<label class="fld"><span>${it.l}</span><span class="in"><select id="${c.id}_s${i}"><option value="">—</option>${it.o.map((o,j)=>`<option value="${j}" ${d.sel&&d.sel[i]===j?'selected':''}>${esc(o)}</option>`).join('')}</select></span><b class="fres" id="${c.id}_r${i}"></b></label>`).join('')}</div><div class="row"><button class="btn primary" data-act="check">Vérifier</button></div>`; }
  else if(c.type==='bugs'){ body=`<pre class="code">${esc(c.code.join('\n'))}</pre><textarea id="${c.id}_t" style="min-height:110px" placeholder="Défaut 1 : …">${esc(d.txt||'')}</textarea><div class="row"><button class="btn primary" data-act="reveal" ${(d.txt||'').trim().length<30?'disabled':''}>Comparer avec le corrigé</button><span class="hint">Écris d’abord ce que tu vois (30 caractères minimum).</span></div><div class="found" id="${c.id}_found" ${d.revealed?'':'hidden'}><p class="hint">Coche ce que tu avais trouvé. Réussi à partir de 60 %.</p>${c.bugs.map((b,i)=>`<label class="task"><input type="checkbox" data-found="${i}" ${d.found&&d.found[i]?'checked':''}><span>${b}</span></label>`).join('')}</div>`; }
  else if(c.type==='flags'){ body=`<div class="tasks">${c.items.map((it,i)=>`<label class="task" id="${c.id}_l${i}"><input type="checkbox" data-flag="${i}" ${d.sel&&d.sel[i]?'checked':''}><span>${esc(it.t)}</span></label>`).join('')}</div><div class="row"><button class="btn primary" data-act="check">Vérifier</button></div>`; }
  else if(c.type==='build'){ body=`<div class="tasks">${c.crit.map((cr,i)=>`<label class="task"><input type="checkbox" data-crit="${i}" ${d.crit&&d.crit[i]?'checked':''}><span>${esc(cr)}</span></label>`).join('')}</div><p class="hint" style="margin-top:8px">Réussi à partir de 80 % de la grille. Note-toi comme le ferait un pair exigeant.</p>`; }
  else if(c.type==='sim'){ body = c.kind==='window'?simWindowHtml(c,d):simBacklogHtml(c,d); }
  const sol = c.sol ? `<div class="model" id="${c.id}_sol" ${cs.s?'':'hidden'}><h4>Corrigé</h4><ul>${c.sol.map(s=>`<li>${s}</li>`).join('')}</ul></div>` : '';
  return `<div class="card ch" id="ch_${c.id}">${chHead(c,cs)}${body}${sol}</div>`;
}
function setStatus(w,c,s){ const cs=chState(w,c); const was=cs.s; cs.s=s; save(); const root=document.getElementById('ch_'+c.id); const el=root.querySelector('[data-chstatus]'); el.textContent=s?SLABEL[s]:'À faire'; el.className='pill '+(s==='ok'?'done':s==='fail'?'late':''); const sol=document.getElementById(c.id+'_sol'); if(sol&&s) sol.hidden=false; refreshWeekHeader(w); if(s==='ok'&&was!=='ok') toast('Défi réussi'); }
function bindCh(w,c){ const cs=chState(w,c); const d=cs.d; const root=document.getElementById('ch_'+c.id); if(!root) return; const sv=()=>{ clearTimeout(bindCh[c.id]); bindCh[c.id]=setTimeout(save,300); };
  if(c.type==='estimate'){ root.querySelector('[data-act=check]').addEventListener('click',()=>{ d.vals=c.fields.map((f,i)=>{ const v=parseFloat(root.querySelector('#'+c.id+'_f'+i).value); return isNaN(v)?null:v; }); let all=true; c.fields.forEach((f,i)=>{ const v=d.vals[i]; const ok=v!=null && Math.abs(v-f.a)<=f.tol*Math.abs(f.a)+1e-9; const r=root.querySelector('#'+c.id+'_r'+i); r.textContent=ok?'✓ juste':'✗ attendu ≈ '+fmtNum(f.a); r.className='fres '+(ok?'ok':'bad'); if(!ok) all=false; }); setStatus(w,c,all?'ok':'fail'); }); }
  else if(c.type==='choose'){ root.querySelector('[data-act=check]').addEventListener('click',()=>{ d.sel=c.items.map((it,i)=>{ const v=root.querySelector('#'+c.id+'_s'+i).value; return v===''?null:+v; }); let all=true; c.items.forEach((it,i)=>{ const ok=d.sel[i]===it.a; const r=root.querySelector('#'+c.id+'_r'+i); r.textContent=ok?'✓':'✗'; r.className='fres '+(ok?'ok':'bad'); if(!ok) all=false; }); setStatus(w,c,all?'ok':'partial'); }); }
  else if(c.type==='bugs'){ const ta=root.querySelector('#'+c.id+'_t'); const btn=root.querySelector('[data-act=reveal]'); ta.addEventListener('input',()=>{ d.txt=ta.value; btn.disabled=ta.value.trim().length<30; sv(); });
    const score=()=>{ const n=(d.found||[]).filter(Boolean).length; setStatus(w,c,n/c.bugs.length>=.6?'ok':'partial'); };
    btn.addEventListener('click',()=>{ d.revealed=true; root.querySelector('#'+c.id+'_found').hidden=false; score(); });
    root.querySelectorAll('[data-found]').forEach(cb=>cb.addEventListener('change',()=>{ d.found=d.found||[]; d.found[+cb.dataset.found]=cb.checked; cb.closest('.task').classList.toggle('on',cb.checked); score(); })); }
  else if(c.type==='flags'){ root.querySelector('[data-act=check]').addEventListener('click',()=>{ d.sel=c.items.map((it,i)=>root.querySelector('[data-flag="'+i+'"]').checked); let all=true; c.items.forEach((it,i)=>{ const ok=d.sel[i]===it.f; const l=root.querySelector('#'+c.id+'_l'+i); l.classList.remove('good','bad'); l.classList.add(ok?'good':'bad'); if(!ok) all=false; }); setStatus(w,c,all?'ok':'partial'); }); }
  else if(c.type==='build'){ root.querySelectorAll('[data-crit]').forEach(cb=>cb.addEventListener('change',()=>{ d.crit=d.crit||[]; d.crit[+cb.dataset.crit]=cb.checked; cb.closest('.task').classList.toggle('on',cb.checked); const n=d.crit.filter(Boolean).length; setStatus(w,c,n/c.crit.length>=.8?'ok':n>0?'partial':null); })); }
  else if(c.type==='sim'){ root.querySelector('[data-act=run]').addEventListener('click',()=>{ if(c.kind==='window') runWindowSim(w,c,root); else runBacklogSim(w,c,root); }); }
}

/* --- Simulateur fenêtres / triggers --- */
function simWindowHtml(c,d){ const p=Object.assign({W:60,skew:20,E:30,L:60,mode:'ACC',events:'5,8\n20,22\n40,45\n55,70\n30,95\n58,150\n10,200\n70,72\n100,104'},d.p||{}); const pr=d.pred||{};
 return `<div class="simgrid"><div class="simp"><h4>Paramètres</h4>
  <label class="fld"><span>Fenêtre fixe</span><span class="in"><input type="number" id="${c.id}_W" value="${p.W}"><em>s</em></span></label>
  <label class="fld"><span>Retard supposé par le watermark (watermark = heure de traitement − ce retard)</span><span class="in"><input type="number" id="${c.id}_skew" value="${p.skew}"><em>s</em></span></label>
  <label class="fld"><span>Early firing toutes les (0 = aucun)</span><span class="in"><input type="number" id="${c.id}_E" value="${p.E}"><em>s</em></span></label>
  <label class="fld"><span>allowed_lateness</span><span class="in"><input type="number" id="${c.id}_L" value="${p.L}"><em>s</em></span></label>
  <label class="fld"><span>Accumulation</span><span class="in"><select id="${c.id}_mode"><option value="ACC" ${p.mode==='ACC'?'selected':''}>ACCUMULATING</option><option value="DISC" ${p.mode==='DISC'?'selected':''}>DISCARDING</option></select></span></label>
  <label>Événements <code>event_time,arrival_time</code> en secondes, un par ligne, valeur 1 chacun<textarea id="${c.id}_ev" style="min-height:160px;font-family:var(--mono);font-size:13px;margin-top:4px">${esc(p.events)}</textarea></label></div>
 <div class="simp"><h4>Tes prédictions</h4>
  <label class="fld"><span>Nombre total de panes émises</span><span class="in"><input type="number" id="${c.id}_p1" value="${pr.p1!=null?pr.p1:''}"></span><b class="fres" id="${c.id}_r1"></b></label>
  <label class="fld"><span>Événements jetés (arrivés trop tard)</span><span class="in"><input type="number" id="${c.id}_p2" value="${pr.p2!=null?pr.p2:''}"></span><b class="fres" id="${c.id}_r2"></b></label>
  <label class="fld"><span>Valeur de la dernière pane de la première fenêtre</span><span class="in"><input type="number" id="${c.id}_p3" value="${pr.p3!=null?pr.p3:''}"></span><b class="fres" id="${c.id}_r3"></b></label>
  <div class="row"><button class="btn primary" data-act="run">Lancer la simulation</button></div>
  <p class="hint">Modèle simplifié : la pane ON_TIME part quand le watermark dépasse la fin de fenêtre ; un élément arrivé après est en retard (pane LATE par élément) ; arrivé après fin + allowed_lateness, il est jeté. Les early panes partent à intervalle régulier depuis la première arrivée, seulement s’il y a du nouveau.</p></div></div><div id="${c.id}_out" class="simout"></div>`; }
function simWindow(p){ const wins={}; const dropped=[];
 p.events.forEach(([et,at])=>{ const ws=Math.floor(et/p.W)*p.W; const we=ws+p.W; const Ton=we+p.skew; const Tc=Ton+p.L; if(at>=Tc){ dropped.push([et,at]); return; } const w=wins[ws]||(wins[ws]={ws,we,Ton,on:[],late:[]}); (at<Ton?w.on:w.late).push(at); });
 const panes=[]; const order=Object.values(wins).sort((a,b)=>a.ws-b.ws);
 order.forEach(w=>{ w.on.sort((a,b)=>a-b); w.late.sort((a,b)=>a-b); let cum=0,last=0; const emit=(t,type)=>{ panes.push({t,win:w.ws+'–'+w.we,key:w.ws,type,v:p.mode==='ACC'?cum:cum-last}); last=cum; };
  if(w.on.length){ let i=0; if(p.E>0){ for(let t=w.on[0]+p.E; t<w.Ton; t+=p.E){ let n=0; while(i<w.on.length&&w.on[i]<=t){ i++; n++; } if(n){ cum+=n; emit(t,'EARLY'); } } } while(i<w.on.length){ i++; cum++; } emit(w.Ton,'ON_TIME'); }
  w.late.forEach(at=>{ cum++; emit(at,'LATE'); }); });
 panes.sort((a,b)=>a.t-b.t);
 const first=order[0]; const firstLast=first?panes.filter(x=>x.key===first.ws).slice(-1)[0]:null;
 return {panes,dropped,firstLast:firstLast?firstLast.v:0,wins:order}; }
function runWindowSim(w,c,root){ const g=id=>root.querySelector('#'+c.id+'_'+id); const p={W:+g('W').value||60,skew:+g('skew').value||0,E:+g('E').value||0,L:+g('L').value||0,mode:g('mode').value,events:g('ev').value};
 const events=p.events.split('\n').map(l=>l.split(',').map(x=>parseFloat(x))).filter(a=>a.length===2&&!isNaN(a[0])&&!isNaN(a[1]));
 if(!events.length){ toast('Aucun événement valide'); return; }
 const res=simWindow(Object.assign({},p,{events})); const d=chState(w,c).d; d.p=p; d.pred={p1:g('p1').value,p2:g('p2').value,p3:g('p3').value};
 const actual={p1:res.panes.length,p2:res.dropped.length,p3:res.firstLast}; let all=true; ['p1','p2','p3'].forEach(k=>{ const v=parseFloat(d.pred[k]); const ok=!isNaN(v)&&v===actual[k]; const r=g('r'+k.slice(1)); r.textContent=ok?'✓':'✗ réel : '+actual[k]; r.className='fres '+(ok?'ok':'bad'); if(!ok) all=false; });
 g('out').innerHTML=`<table><tr><th>t (s)</th><th>Fenêtre</th><th>Pane</th><th>Valeur</th></tr>${res.panes.map(x=>`<tr><td>${x.t}</td><td>${x.win}</td><td class="${x.type}">${x.type}</td><td>${x.v}</td></tr>`).join('')}</table>${res.dropped.length?`<p class="hint" style="margin-top:8px">Jetés : ${res.dropped.map(e=>'('+e[0]+','+e[1]+')').join(' ')}</p>`:''}<p class="hint" style="margin-top:8px">${res.panes.length} panes, ${res.dropped.length} jetés. ${p.mode==='ACC'?'En ACCUMULATING, chaque pane porte le total : le sink doit écraser.':'En DISCARDING, chaque pane porte le delta : le sink doit additionner.'} Change allowed_lateness, le mode ou l’early firing et prédis à nouveau.</p>`;
 setStatus(w,c,all?'ok':'partial'); }

/* --- Simulateur backlog / autoscaling --- */
function simBacklogHtml(c,d){ const p=Object.assign({B:200,S:1200,t1:10,t2:20,P:150,min:2,max:10,react:120,D:60},d.p||{}); const pr=d.pred||{};
 const f=(id,l,v,u)=>`<label class="fld"><span>${l}</span><span class="in"><input type="number" id="${c.id}_${id}" value="${v}"><em>${u}</em></span></label>`;
 return `<div class="simgrid"><div class="simp"><h4>Paramètres</h4>${f('B','Débit de base',p.B,'msg/s')}${f('S','Débit pendant le pic',p.S,'msg/s')}${f('t1','Début du pic',p.t1,'min')}${f('t2','Fin du pic',p.t2,'min')}${f('P','Débit traité par worker',p.P,'msg/s')}${f('min','Workers minimum',p.min,'')}${f('max','Workers maximum',p.max,'')}${f('react','Délai entre deux décisions d’autoscaling',p.react,'s')}${f('D','Durée simulée',p.D,'min')}</div>
 <div class="simp"><h4>Tes prédictions</h4>
  <label class="fld"><span>Retard de fraîcheur maximal (backlog ÷ capacité)</span><span class="in"><input type="number" step="any" id="${c.id}_p1" value="${pr.p1!=null?pr.p1:''}"><em>min</em></span><b class="fres" id="${c.id}_r1"></b></label>
  <label class="fld"><span>Temps de résorption après la fin du pic</span><span class="in"><input type="number" step="any" id="${c.id}_p2" value="${pr.p2!=null?pr.p2:''}"><em>min</em></span><b class="fres" id="${c.id}_r2"></b></label>
  <div class="row"><button class="btn primary" data-act="run">Lancer la simulation</button></div>
  <p class="hint">Modèle : toutes les « délai » secondes, +1 worker si le backlog dépasse 30 s de capacité, −1 s’il est vide. Tolérance 25 %. Essaie ensuite max = 4, puis délai = 30 s, et compare.</p></div></div><div id="${c.id}_out" class="simout"></div>`; }
function simBacklog(p){ const dt=5; let workers=p.min, backlog=0, lastScale=0, maxB=0, maxLag=0, maxW=workers, drain=null; const series=[]; const t1=p.t1*60, t2=p.t2*60, D=p.D*60;
 for(let t=0;t<D;t+=dt){ const rate=(t>=t1&&t<t2)?p.S:p.B; backlog+=rate*dt; const cap=workers*p.P*dt; backlog=Math.max(0,backlog-cap); const lag=backlog/(workers*p.P); maxB=Math.max(maxB,backlog); maxLag=Math.max(maxLag,lag); if(t>=t2&&backlog===0&&drain===null) drain=t-t2; series.push([t,backlog,workers]);
  if(t-lastScale>=p.react){ if(backlog>workers*p.P*30&&workers<p.max){ workers++; lastScale=t; } else if(backlog===0&&workers>p.min){ workers--; lastScale=t; } maxW=Math.max(maxW,workers); } }
 return {maxB,maxLag,maxW,drain,series,t1,t2,D}; }
function runBacklogSim(w,c,root){ const g=id=>root.querySelector('#'+c.id+'_'+id); const p={}; ['B','S','t1','t2','P','min','max','react','D'].forEach(k=>p[k]=+g(k).value||0); if(p.max<p.min) p.max=p.min; if(p.D<=0) p.D=60;
 const r=simBacklog(p); const d=chState(w,c).d; d.p=p; d.pred={p1:g('p1').value,p2:g('p2').value};
 const act={p1:r.maxLag/60,p2:r.drain===null?null:r.drain/60}; let all=true;
 [['p1','r1'],['p2','r2']].forEach(([k,rk])=>{ const v=parseFloat(d.pred[k]); const a=act[k]; const ok=a!==null&&!isNaN(v)&&Math.abs(v-a)<=0.25*Math.max(a,0.5); const el=g(rk); el.textContent=ok?'✓':'✗ réel : '+(a===null?'jamais dans la durée simulée':a.toFixed(1)+' min'); el.className='fres '+(ok?'ok':'bad'); if(!ok) all=false; });
 const Wd=600,H=140,pad=36; const maxB=Math.max(1,r.maxB); const sx=t=>pad+(t/r.D)*(Wd-pad-8); const sy=b=>H-18-(b/maxB)*(H-30);
 const line=r.series.map(([t,b])=>sx(t).toFixed(1)+','+sy(b).toFixed(1)).join(' '); const wl=r.series.map(([t,,wk])=>sx(t).toFixed(1)+','+(H-18-(wk/p.max)*(H-30)).toFixed(1)).join(' ');
 const svg=`<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Backlog et workers dans le temps"><rect x="${sx(r.t1).toFixed(1)}" y="12" width="${(sx(r.t2)-sx(r.t1)).toFixed(1)}" height="${H-30}" fill="var(--late-soft)"/><line x1="${pad}" y1="${H-18}" x2="${Wd-8}" y2="${H-18}" stroke="var(--line-strong)"/><polyline points="${wl}" fill="none" stroke="var(--info)" stroke-width="1.5" stroke-dasharray="4 3"/><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/><text x="${pad}" y="10" font-size="10" fill="var(--muted)" font-family="var(--mono)">backlog max ${fmtNum(Math.round(r.maxB))} msg · pointillé = workers (max ${p.max})</text><text x="${pad}" y="${H-5}" font-size="10" fill="var(--muted)" font-family="var(--mono)">0 min</text><text x="${Wd-8}" y="${H-5}" font-size="10" fill="var(--muted)" font-family="var(--mono)" text-anchor="end">${p.D} min</text></svg>`;
 g('out').innerHTML=`<table><tr><th>Backlog max</th><th>Retard max</th><th>Workers max atteints</th><th>Résorption après le pic</th></tr><tr><td>${fmtNum(Math.round(r.maxB))} msg</td><td>${(r.maxLag/60).toFixed(1)} min</td><td>${r.maxW}</td><td>${r.drain===null?'pas dans la durée simulée':(r.drain/60).toFixed(1)+' min'}</td></tr></table>${svg}<p class="hint" style="margin-top:8px">Le retard revient à la normale bien après la fin du pic (zone rouge). Ce qui domine : le délai de réaction et le plafond de workers, pas le débit de base.</p>`;
 setStatus(w,c,all?'ok':'partial'); }

function viewCritique(){
  const logs=WEEKS.filter(w=>w.critique && W(w.n).critique.trim()).map(w=>`<div class="card" style="margin-bottom:10px"><div class="eyebrow" style="margin-bottom:4px">S${w.n} · ${esc(w.title)}</div><p style="white-space:pre-wrap;color:var(--muted);font-size:14px">${esc(W(w.n).critique)}</p><div class="row"><button class="btn small" data-go="w${w.n}">Ouvrir la semaine</button></div></div>`).join('') || '<p class="hint">Aucune critique écrite pour l’instant. Chaque semaine en contient une.</p>';
  return `<div class="eyebrow">Réflexe à construire</div><h2 class="title">Sens critique</h2><p class="lead">Un lead ne juge pas une proposition sur son élégance mais sur ce qu’elle coûte, comment elle casse et ce qu’on aurait pu faire de plus simple. Cette page reste ouverte en réunion.</p>
  <section class="block"><h2>Les sept questions</h2><div class="card lesson"><div class="pt key"><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px"><li><b>Quel problème, pour qui ?</b> Une phrase, sans nom de techno.</li><li><b>Et si on ne fait rien</b> pendant six mois ?</li><li><b>Quelles alternatives</b>, y compris la plus bête ?</li><li><b>Comment ça casse ?</b> ×10, dépendance en panne, rejeu, erreur humaine.</li><li><b>Combien ça coûte</b> à construire, à faire tourner, en personnes ; combien ça rapporte ?</li><li><b>Est-ce réversible ?</b> Porte à un sens ou à deux sens.</li><li><b>Comment saura-t-on que ça marche ?</b> Métrique, seuil, date.</li></ol></div></div></section>
  <section class="block"><h2>Signaux d’alerte</h2><div class="card lesson"><div class="pt"><ul><li>La solution est nommée avant le problème.</li><li>Pas un seul chiffre (volume, latence, coût).</li><li>« Ça scalera », « c’est temporaire », « tout le monde fait ça », « on a toujours fait comme ça ».</li><li>Aucun mode de défaillance décrit.</li><li>Une seule option présentée.</li><li>Un bénéfice qualifié (« significatif ») et jamais quantifié.</li><li>Une personne nommée comme cause racine.</li></ul></div></div></section>
  <section class="block"><h2>Comment formuler en réunion</h2><div class="card lesson"><div class="pt"><ul><li>Question plutôt qu’opinion : « que se passe-t-il si… ? » plutôt que « il faudrait… ».</li><li>Commencer par ce qui est solide, puis une seule question bloquante, puis le reste en suggestions.</li><li>Demander un chiffre : « à combien de messages par seconde est-ce qu’on parle ? »</li><li>Proposer l’option la plus simple comme point de comparaison, pas comme attaque.</li><li>Trancher quand c’est ton rôle, et le dire : « on part sur A, on mesure X dans 30 jours ».</li></ul></div></div></section>
  <section class="block"><h2>Tes critiques écrites</h2>${logs}</section>`;
}

function viewJournal(){
  const entries=WEEKS.filter(w=>{const r=W(w.n).retro; return r.a||r.b||r.c;}).map(w=>{const r=W(w.n).retro; return `<div class="card jweek"><h3>S${w.n} · ${esc(w.title)} <small>${range(w.n)}</small></h3>${r.a?`<p><b>Appris :</b> ${esc(r.a)}</p>`:''}${r.b?`<p><b>Hésité :</b> ${esc(r.b)}</p>`:''}${r.c?`<p><b>Différemment :</b> ${esc(r.c)}</p>`:''}</div>`;}).join('') || '<p class="hint">Les rétros de fin de semaine apparaîtront ici.</p>';
  return `<div class="eyebrow">Trace écrite</div><h2 class="title">Journal</h2><p class="lead">Notes libres et rétros. Écrire ce qu’on a compris est la moitié de l’apprentissage ; l’autre moitié est de relire un mois plus tard.</p>
  <section class="block"><h2>Notes libres</h2><textarea id="jfree" style="min-height:220px" placeholder="Idées, questions sans réponse, choses à vérifier sur la plateforme, phrases entendues en réunion à analyser…">${esc(S.journal.free||'')}</textarea><p class="hint" style="margin-top:6px">Enregistré automatiquement dans ce navigateur.</p></section>
  <section class="block"><h2>Rétros</h2>${entries}</section>`;
}
function bindJournal(){ const t=$('#jfree'); t.addEventListener('input',()=>{ S.journal.free=t.value; clearTimeout(bindJournal.t); bindJournal.t=setTimeout(save,400); }); }

function viewSettings(){
  return `<div class="eyebrow">Parcours</div><h2 class="title">Réglages</h2><p class="lead">La date de début fixe toute la timeline. La progression est stockée dans ce navigateur ; exporte-la si tu changes de machine.</p>
  <section class="block"><h2>Date de début (un lundi)</h2><div class="card"><div class="row" style="margin-top:0"><input type="date" id="startDate" value="${S.start}"><button class="btn" id="startSave">Appliquer</button><span class="hint">Fin prévue : ${fmtLong(endOf(24))}</span></div></div></section>
  <section class="block"><h2>Sauvegarde</h2><div class="card"><div class="row" style="margin-top:0"><button class="btn" id="expBtn">Copier ma progression</button><button class="btn" id="impBtn">Importer depuis le texte ci-dessous</button></div><textarea id="impTxt" style="min-height:90px;margin-top:10px;font-family:var(--mono);font-size:12px" placeholder="Colle ici une sauvegarde copiée depuis un autre navigateur"></textarea></div></section>
  <section class="block"><h2>Remise à zéro</h2><div class="card"><div class="row" style="margin-top:0"><button class="btn danger" id="resetBtn">Effacer toute la progression</button><button class="btn danger" id="resetYes" hidden>Oui, tout effacer</button><span class="hint">Irréversible. Fais une copie avant.</span></div></div></section>`;
}
function bindSettings(){
  $('#startSave').addEventListener('click',()=>{ const v=$('#startDate').value; if(/^\d{4}-\d{2}-\d{2}$/.test(v)){ S.start=v; save(); toast('Timeline mise à jour'); render(); } });
  $('#expBtn').addEventListener('click',()=>{ const txt=JSON.stringify(S); const ta=$('#impTxt'); ta.value=txt; if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>toast('Copié dans le presse-papier')).catch(()=>{ ta.select(); toast('Sélectionne et copie le texte'); }); } else { ta.select(); toast('Sélectionne et copie le texte'); } });
  $('#impBtn').addEventListener('click',()=>{ try{ const p=JSON.parse($('#impTxt').value); if(p&&p.weeks){ S=Object.assign({start:'2026-11-09',weeks:{},focus:[],journal:{}},p); save(); toast('Progression importée'); render(); } else toast('Format non reconnu'); }catch(e){ toast('Format non reconnu'); } });
  $('#resetBtn').addEventListener('click',()=>{ $('#resetYes').hidden=false; });
  $('#resetYes').addEventListener('click',()=>{ S={start:S.start,weeks:{},focus:[],journal:{}}; save(); toast('Progression effacée'); render(); });
}

/* ---------- Focus mode ---------- */
let F={on:false,week:null,min:25,end:0,tick:null,wake:null};
function openFocus(weekN){
  const cw=calendarWeek(); const def = weekN || (nextToFinish()?nextToFinish().n:(cw>=1&&cw<=24?cw:1));
  const v=$('#view'); const opts=WEEKS.map(w=>`<option value="${w.n}" ${w.n===def?'selected':''}>S${w.n} · ${esc(w.title)}</option>`).join('');
  v.innerHTML=`<div class="eyebrow">Travail protégé</div><h2 class="title">Mode focus</h2><p class="lead">Pendant la session, la navigation disparaît : il ne reste que la semaine choisie et le compteur. Tout ce dont tu as besoin pour apprendre est sur cette page.</p>
  <section class="block"><h2>Session</h2><div class="card"><div class="fstart"><label>Semaine <select id="fWeek">${opts}</select></label><label>Durée <select id="fMin"><option value="25">25 min</option><option value="50" selected>50 min</option><option value="90">90 min</option></select></label><button class="btn primary" id="fGo">Démarrer</button></div><p class="hint" style="margin-top:12px">Règle : un seul onglet, téléphone ailleurs, notifications coupées. Si tu interromps avant la fin, la session n’est pas comptée.</p></div></section>
  <section class="block"><h2>Historique</h2><div class="card">${S.focus.length?S.focus.slice(-10).reverse().map(f=>`<div style="display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px"><span class="num" style="font-family:var(--mono);color:var(--muted)">${f.date}</span><span>S${f.week}</span><span style="color:var(--muted)">${f.min} min</span></div>`).join(''):'<p class="hint">Aucune session pour l’instant.</p>'}</div></section>`;
  $('#fGo').addEventListener('click',()=>startFocus(+$('#fWeek').value,+$('#fMin').value));
}
function startFocus(weekN,min){ F.on=true; F.week=weekN; F.min=min; F.end=Date.now()+min*60000; document.body.classList.add('focus'); $('#focusWeek').textContent='S'+weekN+' · '+WEEKS[weekN-1].title; go('w'+weekN); tickFocus(); F.tick=setInterval(tickFocus,1000); try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(w=>F.wake=w).catch(()=>{}); }catch(e){} }
function tickFocus(){ const left=Math.max(0,F.end-Date.now()); const m=Math.floor(left/60000), s=Math.floor(left%60000/1000); $('#clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); if(left<=0) endFocus(true); }
function endFocus(completed){ clearInterval(F.tick); F.on=false; document.body.classList.remove('focus'); try{ if(F.wake) F.wake.release(); }catch(e){} if(completed){ const d=new Date(); S.focus.push({week:F.week,min:F.min,date:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}); save(); toast('Session terminée : '+F.min+' min sur S'+F.week); } else toast('Session interrompue, non comptée'); $('#focusStop').textContent='Interrompre'; F.confirm=false; render(); }
$('#focusStop').addEventListener('click',()=>{ if(!F.confirm){ F.confirm=true; $('#focusStop').textContent='Confirmer l’arrêt ?'; setTimeout(()=>{ if(F.on){F.confirm=false; $('#focusStop').textContent='Interrompre';} },4000); } else endFocus(false); });
$('#focusOpen').addEventListener('click',()=>{ route='focus'; document.body.classList.remove('menu'); openFocus(null); renderRail(); });
$('#menuBtn').addEventListener('click',()=>document.body.classList.toggle('menu'));

/* ---------- Global click delegation ---------- */
document.addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(b){ if(F.on){ toast('Session focus en cours : reste sur ta semaine'); return; } go(b.dataset.go); } });

/* ---------- Boot ---------- */
(function(){ const h=(location.hash||'').replace('#',''); if(h) route=h; render(); })();
</script>

<script>
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
