 {q:'Mesure de qualité d’un système d’alerte ?', o:['Nombre d’alertes','Ratio alertes suivies d’une action / alertes déclenchées','Nombre de monitors'], a:1, e:'Le bruit détruit la confiance et fait ignorer la vraie alerte.'},
],
critique:{who:'Plan de monitoring proposé pour la nouvelle plateforme', text:'« On met des alertes sur tout : CPU > 70 %, mémoire > 70 %, backlog > 1 000, erreurs > 0, latence p50 > 200 ms. Toutes en page vers l’astreinte. Mieux vaut trop que pas assez. »',
model:['« Erreurs > 0 » en page : la première erreur transitoire réveille quelqu’un. Au bout de deux semaines, l’astreinte ignore tout, y compris la vraie panne.','CPU/mémoire ne sont pas des symptômes. Dans le dashboard, oui ; en page, non.','p50 ne mesure pas l’expérience : p95/p99 et le SLO.','« Mieux vaut trop » : faux. Le coût d’une alerte bruyante est la crédibilité de toutes les autres. Proposer 3 pages max liées aux SLO, le reste en tickets.']},
deliverable:'Document SLO de l’indexation + politique d’alerting (3 pages max) validés en équipe.'},

{n:16, title:'Contrats, qualité et post-mortems', goal:'Installer les mécanismes qui empêchent les mêmes incidents de revenir : contrats, tests, réconciliation, post-mortems sans blâme.',
lesson:[
 {h:'Contrat de données', key:true, p:'Un contrat = schéma versionné + sémantique (ce que veut dire chaque champ) + garanties (fraîcheur, complétude) + propriétaire + procédure de changement. Il se teste : validation de schéma en CI du producteur, tests de compatibilité, et vérification en production (schéma Pub/Sub, tests dbt, contraintes BigQuery). Un contrat sans test est une intention.'},
 {h:'Tests de données, à trois niveaux', p:'<ul><li><b>Unitaires</b> : la logique de transformation (Beam TestPipeline, dbt unit tests).</li><li><b>Contrat</b> : schéma, nullité, unicité, valeurs acceptées (dbt tests, assertions dans le pipeline avec sortie d’erreurs).</li><li><b>Réconciliation</b> : source contre cible, périodique, avec écart toléré et alerte. C’est le test qui attrape ce que les deux autres ne voient pas.</li></ul>'},
 {h:'Idempotence et backfill', key:true, p:'Tout pipeline doit pouvoir être relancé sur une période sans dégâts : écritures par partition remplacée, MERGE par clé, versions. Un backfill est un rejeu planifié : documenter la commande, la durée, le coût et l’impact sur les consommateurs. Si le backfill fait peur, le pipeline n’est pas idempotent.'},
 {h:'Post-mortem sans blâme', p:'Chronologie factuelle, impact chiffré, causes (plusieurs, jamais « erreur humaine » seule : quel système a permis l’erreur ?), ce qui a bien marché, actions avec propriétaire et date. Rédigé sous 5 jours, relu en équipe, actions suivies dans le backlog. Le lead protège le ton : on cherche ce qui a permis l’incident, pas qui.'},
],
tasks:['Écrire le contrat de données complet pour la sortie du pipeline d’indexation (schéma, sémantique, garanties, propriétaire, changement). Le faire relire par un consommateur.','Ajouter ou renforcer la réconciliation : écart source/index mesuré chaque heure, alerte si > 0,1 % pendant 3 heures.','Rédiger un post-mortem d’un incident passé (même petit) avec le gabarit ci-dessus, et le présenter en 10 min à l’équipe.'],
quiz:[
 {q:'Qu’est-ce qui distingue un contrat d’une documentation ?', o:['Le format','Il est testé automatiquement et a un propriétaire','Il est plus long'], a:1, e:'Sans test ni propriétaire, c’est un souhait.'},
 {q:'Quel test attrape une perte silencieuse de 2 % des lignes ?', o:['Test unitaire','Test de schéma','Réconciliation source/cible'], a:2, e:'Les deux premiers valident la forme ; seule la comparaison valide le compte.'},
 {q:'Cause racine écrite : « le DE a lancé la mauvaise commande ». Que corriger ?', o:['Rien, c’est une erreur humaine','La phrase : quel système a rendu la mauvaise commande possible et indolore ?','Sanctionner'], a:1, e:'Le post-mortem cherche le système qui a laissé passer l’erreur.'},
],
critique:{who:'Post-mortem rédigé par un membre de l’équipe', text:'« Incident : index incomplet pendant 6 h. Cause racine : X a déployé le vendredi soir sans tester. Action : interdire les déploiements le vendredi et demander à X de faire plus attention. »',
model:['Nommer une personne et « faire attention » n’est pas une action : la prochaine personne fera la même erreur. Quel système ? Pas de test en préprod ? Pas de canary ? Pas d’alerte avant 6 h ?','6 h avant détection : c’est la vraie trouvaille. Pourquoi l’alerte de complétude n’a pas sonné ? C’est l’action numéro un.','Interdire le vendredi traite le symptôme et ralentit l’équipe ; un déploiement sûr doit être possible n’importe quel jour.','Reformuler : chronologie, impact (combien de vidéos non trouvables ?), 3 causes contributives, 3 actions avec propriétaire et date.']},
deliverable:'Contrat de données de l’index + post-mortem présenté + réconciliation en prod avec alerte.'},

{n:17, title:'Sécurité et gouvernance GCP', goal:'Appliquer ton expérience RBAC/CVE à GCP : identités, réseau, données sensibles, audit.',
lesson:[
 {h:'IAM : principe du moindre privilège, concrètement', key:true, p:'Un service account par workload (job Dataflow, DAG Airflow, service GKE), des rôles prédéfinis étroits (<code>pubsub.subscriber</code> sur la subscription, <code>bigquery.dataEditor</code> sur le dataset) plutôt que Editor projet. <b>Workload Identity</b> sur GKE pour ne jamais distribuer de clés JSON. Pas de clé de service account exportée : si une existe, c’est un incident à planifier. IAM Recommender signale les permissions inutilisées depuis 90 jours.'},
 {h:'Réseau et périmètre', p:'Workers Dataflow et nœuds GKE sans IP publique, Private Google Access, <b>VPC Service Controls</b> autour de BigQuery/GCS pour empêcher l’exfiltration vers un projet externe. CMEK (clés gérées par le client) si une exigence contractuelle l’impose ; sinon, le chiffrement par défaut suffit et CMEK ajoute de l’opérationnel.'},
 {h:'Données personnelles', key:true, p:'Classer les colonnes (identifiants, comportement de visionnage = donnée personnelle), <b>policy tags</b> BigQuery pour masquer à la colonne, rétention limitée et documentée, pseudonymisation en amont quand l’usage le permet. Cloud DLP pour détecter ce qu’on ne savait pas avoir. Le RGPD s’applique à l’historique de visionnage : droit d’effacement = un pipeline de suppression testé.'},
 {h:'Audit et chaîne d’approvisionnement', p:'Audit logs d’accès aux données activés sur BigQuery (data access logs) et exportés vers un projet distinct. Images Docker des jobs scannées (Artifact Registry), dépendances épinglées, CVE suivies comme tu le fais déjà. Terraform relu avec un linter de sécurité (tfsec/Checkov) en CI.'},
],
tasks:['Inventorier les service accounts du projet d’indexation et leurs rôles ; appliquer IAM Recommender ; supprimer ou réduire 3 permissions.','Vérifier l’absence de clés JSON de service account dans le projet et dans les repos (secret scanning). Planifier la rotation ou suppression des clés trouvées.','Classer les colonnes personnelles de 2 tables centrales et poser des policy tags sur au moins une colonne sensible.'],
quiz:[
 {q:'Un job Dataflow a le rôle Editor sur le projet. Risque principal ?', o:['Coût','Une compromission du job donne accès à toutes les ressources du projet','Aucun si le job est interne'], a:1, e:'Le rayon d’explosion d’une faille est proportionnel aux permissions.'},
 {q:'Comment un pod GKE doit-il s’authentifier à GCP ?', o:['Clé JSON montée en secret','Workload Identity','Compte utilisateur'], a:1, e:'Pas de clé à distribuer, rotation gérée par la plateforme.'},
 {q:'Quel mécanisme empêche une requête de copier un dataset vers un projet externe ?', o:['CMEK','VPC Service Controls','Policy tags'], a:1, e:'VPC-SC définit un périmètre de données.'},
],
critique:{who:'Proposition pour accélérer l’onboarding des analystes', text:'« On donne à tous les analystes le rôle BigQuery Admin sur le projet data et un service account partagé avec une clé JSON dans le wiki pour les notebooks. Ça évite les tickets d’accès. »',
model:['Clé JSON dans un wiki : secret partagé, jamais tourné, impossible d’attribuer une action à une personne. C’est un incident en attente.','BigQuery Admin pour lire : suppression de datasets possible par erreur, accès aux colonnes personnelles sans contrôle.','Le vrai problème (tickets d’accès lents) se résout par des groupes IAM par rôle métier, des rôles prédéfinis et une revue trimestrielle, pas par l’ouverture totale.','Notebooks : identité personnelle fédérée (ADC avec le compte Google), pas de service account partagé.']},
deliverable:'Audit IAM/sécurité du périmètre de l’indexation : constats, 5 actions priorisées par risque, 3 réalisées.'},

/* ===== P5 LEADERSHIP ===== */
{n:18, title:'Le rôle de tech lead', goal:'Savoir ce que tu arrêtes de faire, ce que tu commences à faire, et comment tu mesures que l’équipe va mieux grâce à toi.',
lesson:[
 {h:'Lead technique, manager, staff : trois métiers', key:true, p:'Le <b>tech lead</b> porte la direction technique d’une équipe : décisions d’architecture, qualité, dette, mentorat, interface avec le produit. Il code encore (30 à 50 %), souvent sur ce qui débloque les autres. Le <b>manager</b> porte les personnes et l’organisation. Le <b>staff</b> porte des problèmes transverses à plusieurs équipes. Clarifier avec ton manager laquelle des trois voies est la tienne, et ce qui est attendu dans 6 mois.'},
 {h:'Le lead est un multiplicateur', p:'Ta valeur n’est plus ce que tu produis mais ce que l’équipe produit grâce à toi : standards qui évitent des bugs, revues qui font progresser, décisions qui évitent des mois de mauvaise direction, documents qui alignent. Signal d’échec : tu es le goulot. Signal de réussite : l’équipe prend de bonnes décisions quand tu n’es pas là.'},
 {h:'Ton temps, par semaine', key:true, p:'Un découpage de départ : 40 % code et revues, 25 % conception et documents, 20 % réunions (produit, autres équipes, 1:1 techniques), 15 % imprévus et incidents. Mesurer ton temps réel 2 semaines : l’écart entre ce que tu crois et ce que tu fais est la première chose à corriger.'},
 {h:'Influence sans autorité', p:'Tu ne décides pas pour les gens ; tu rends la bonne décision évidente : données, options écrites, prototypes de 2 jours, et constance. Dire « je ne sais pas, je regarde » augmente ta crédibilité ; défendre une position fausse la détruit.'},
],
tasks:['Écrire ta « charte de lead » en 10 lignes : ce que l’équipe peut attendre de toi, ce que tu attends d’elle, comment on décide, comment on se désaccorde.','Mesurer ton temps sur 5 jours (par tranche de 30 min, catégories ci-dessus). Comparer au découpage cible.','Demander un entretien de 30 min à ton manager : quelle voie (lead/manager/staff), quelles attentes à 6 mois, quel signal de succès.'],
quiz:[
 {q:'Signal que le lead est devenu un goulot ?', o:['Il code beaucoup','Rien ne se décide sans lui, les PRs attendent sa revue des jours','Il écrit des docs'], a:1, e:'Le multiplicateur rend les autres capables, il ne centralise pas.'},
 {q:'Un lead doit-il coder ?', o:['Non, plus jamais','Oui, une part significative, sur ce qui débloque et sur ce qui fixe les standards','Uniquement les prototypes'], a:1, e:'Garder les mains dans le code garde la crédibilité et le jugement.'},
 {q:'Influence sans autorité : levier principal ?', o:['L’ancienneté','Les données, les options écrites et la constance','Le titre'], a:1, e:'La décision devient évidente quand elle est argumentée et visible.'},
],
critique:{who:'Ta propre semaine, vue de l’extérieur', text:'Semaine type : 70 % de code sur le job Dataflow (tu es le seul à le connaître), 20 % de réunions, 10 % de revues faites en fin de journée. Deux PRs de collègues attendent depuis 4 jours. Aucun document écrit ce mois-ci.',
model:['Seul à connaître le job : risque de bus factor et goulot. Pairer, documenter, faire relire par un autre DE chaque PR sur ce job.','Revues à 4 jours : c’est la première chose à changer. Une revue dans la journée est un standard d’équipe que le lead incarne.','Aucun document : les décisions se prennent oralement et se perdent. Un ADR par décision importante, même de 10 lignes.','70 % de code est un ratio d’IC, pas de lead. Réduire à 40 % en déléguant explicitement (qui reprend quoi).']},
deliverable:'Charte de lead partagée à ton manager, et un relevé de temps réel sur 5 jours avec 2 ajustements décidés.'},

{n:19, title:'Roadmap et priorisation', goal:'Construire une roadmap technique sur deux trimestres que le produit comprend et que l’équipe tient.',
lesson:[
 {h:'Un cadre simple : impact, effort, risque', key:true, p:'Pour chaque initiative : impact (chiffré si possible : coût économisé, incidents évités, fraîcheur gagnée), effort (en semaines-personne, avec un facteur ×1,5 d’incertitude), risque (technique, dépendances). RICE (Reach, Impact, Confidence, Effort) fonctionne aussi. L’important n’est pas la formule, c’est que les critères soient écrits et appliqués à tout de la même façon.'},
 {h:'La dette technique a un budget', p:'Réserver 20 à 30 % de la capacité à la fiabilité et à la dette, négocié une fois avec le produit plutôt qu’à chaque sprint. Présenter la dette comme un coût courant (« ce job nous coûte 2 jours/mois d’interventions ») et son remboursement comme un investissement avec retour daté.'},
 {h:'Dire non, ou plutôt « pas maintenant, voici pourquoi »', key:true, p:'Un non argumenté : « cela coûte X, cela rapporte Y, ces deux choses déjà engagées rapportent plus ; si l’on veut le faire, on retire quoi ? » Le produit décide des arbitrages de valeur, tu fournis les coûts et les conséquences. Un lead qui dit oui à tout livre tout en retard.'},
 {h:'Planifier, puis réviser', p:'Un trimestre : 3 à 5 objectifs maximum, chacun avec un résultat observable. Revue à mi-trimestre : qu’est-ce qui a changé, que coupe-t-on ? Une roadmap jamais révisée est une liste de souhaits.'},
],
tasks:['Lister toutes les initiatives techniques possibles de l’équipe (15 à 25). Les noter impact/effort/risque avec les mêmes critères. Garder les 5 premières.','Rédiger la roadmap 2 trimestres de la plateforme d’indexation : objectifs, résultats observables, budget dette, dépendances.','La présenter à ton manager ou au produit en 15 min. Noter les 3 objections et comment tu as répondu.'],
quiz:[
 {q:'Le produit demande une 6e initiative pour ce trimestre. Réponse de lead ?', o:['Oui, on fera plus vite','Voici le coût ; que retire-t-on des 5 engagées ?','Non'], a:1, e:'Rendre l’arbitrage visible et le laisser au produit.'},
 {q:'Comment présenter la dette technique au produit ?', o:['Comme une obligation morale','Comme un coût courant chiffré et un investissement à retour daté','Comme un sujet interne'], a:1, e:'Le produit raisonne en coût et valeur ; parler sa langue.'},
 {q:'Combien d’objectifs par trimestre ?', o:['10 à 15','3 à 5','1'], a:1, e:'Au-delà de 5, rien n’est prioritaire.'},
],
critique:{who:'Roadmap trimestrielle proposée par l’équipe', text:'12 objectifs listés, dont « migrer vers Kafka », « refonte totale du monitoring », « nouveau feature store », « passer dbt partout », sans estimation, sans ordre, et 0 % réservé aux incidents et à la dette.',
model:['12 objectifs = aucune priorité. Demander les 3 qui, s’ils sont les seuls faits, rendent le trimestre réussi.','Sans estimation : impossible de dire si c’est 1 trimestre ou 4. Estimer grossièrement chacun en semaines-personne.','0 % pour les incidents : la réalité prendra ses 20 % de toute façon, mais de manière subie. Les budgéter.','Plusieurs items sont des solutions (« Kafka », « dbt partout ») sans problème énoncé. Reformuler chacun en résultat observable.']},
deliverable:'Roadmap 2 trimestres présentée, avec les objections notées et une version révisée.'},

{n:20, title:'Revue, mentorat et délégation', goal:'Faire progresser l’équipe par tes revues et tes délégations, sans te transformer en goulot ni en censeur.',
lesson:[
 {h:'La revue de code comme enseignement', key:true, p:'Une bonne revue : dans la journée, commence par ce qui est bien, distingue bloquant / important / nit, explique le pourquoi, et propose plutôt qu’impose quand il y a plusieurs bonnes réponses. Un standard écrit (conventions Beam, nommage des transforms, tests obligatoires) évite de répéter les mêmes commentaires et dépersonnalise la critique : « c’est la convention », pas « c’est mon avis ».'},
 {h:'Niveaux de délégation', p:'Explicite à chaque fois ce que tu délègues : <b>1. Décide et fais</b>, <b>2. Décide, puis informe-moi</b>, <b>3. Propose, je valide</b>, <b>4. Explore, on décide ensemble</b>. L’ambiguïté sur le niveau est la première source de frustration dans les deux sens. Déléguer le niveau 1 sur tout ce qui est réversible.'},
 {h:'Mentorer sans faire à la place', key:true, p:'Question avant réponse : « qu’as-tu essayé ? que ferais-tu si j’étais absent ? ». Pairing de 1 h sur un problème dur vaut mieux que corriger sa PR. Fixer avec chaque personne un objectif de progression trimestriel (ex. : « déployer seul un job Dataflow en prod ») et le suivre en 1:1 technique toutes les deux semaines.'},
 {h:'Animer une revue de design', p:'Document envoyé 48 h avant, 10 min de lecture silencieuse en début de réunion, tour de table des questions bloquantes d’abord, décision ou prochaine étape écrite avant de sortir. 45 min maximum. Le lead anime, il ne monopolise pas.'},
],
tasks:['Rédiger les conventions de l’équipe pour les pipelines Beam (10 règles) et les proposer en PR.','Pour chaque membre de l’équipe avec qui tu travailles, écrire le niveau de délégation actuel sur 3 sujets, et le niveau cible dans 3 mois. En parler avec eux.','Animer une revue de design avec le format ci-dessus sur un sujet réel. Chronométrer, noter ce qui a dérapé.'],
quiz:[
 {q:'Un junior te demande comment régler un problème de watermark. Première réponse ?', o:['La solution','« Qu’as-tu observé et qu’as-tu essayé ? »','« Regarde la doc »'], a:1, e:'Faire émerger le raisonnement, puis compléter.'},
 {q:'Décision réversible, personne compétente. Niveau de délégation ?', o:['Propose, je valide','Décide et fais, informe si utile','Explore, on décide ensemble'], a:1, e:'Déléguer le plus possible sur le réversible.'},
 {q:'Quel élément dépersonnalise les commentaires de revue ?', o:['L’humour','Un standard écrit et partagé','L’anonymat'], a:1, e:'La convention est l’arbitre, pas le reviewer.'},
],
critique:{who:'Commentaires laissés sur une PR par un senior de l’équipe', text:'« Ce code est mauvais. Pourquoi tu fais un GroupByKey ici ? Refais tout avec un Combine. Et le nommage est nul. » Laissé un vendredi à 18 h, PR bloquée jusqu’au mardi.',
model:['Jugement sur la personne (« mauvais », « nul ») au lieu du code et du pourquoi. Ne forme pas, décourage.','« Refais tout » sans expliquer le gain (combiner lifting, shuffle) : l’auteur ne saura pas la prochaine fois.','Bloquer 4 jours : coût pour l’équipe. Si c’est bloquant, dire précisément quoi et être disponible.','Rôle du lead : parler au senior en privé (impact de son ton), et faire adopter un standard écrit pour que « GroupByKey vs Combine » devienne une convention, pas un rapport de force.']},
deliverable:'Conventions Beam adoptées, niveaux de délégation discutés avec chaque personne, une revue de design animée.'},

{n:21, title:'Communiquer avec le reste de l’entreprise', goal:'Écrire et parler pour des non-techniciens, en français et en anglais, de façon à ce qu’ils décident vite et bien.',
lesson:[
 {h:'La pyramide : conclusion d’abord', key:true, p:'Un message à un dirigeant commence par la conclusion et la demande (« nous proposons X, il faut votre accord sur Y avant le 20 »), puis trois arguments, puis le détail en annexe. Il lit la première ligne ; si elle est bonne, il lit la suite. Si tu as déjà vulgarisé un projet pour des équipes non techniques, c’est le même exercice : le systématiser.'},
 {h:'Point d’avancement hebdomadaire', p:'Format fixe, 8 lignes : état (vert/orange/rouge et pourquoi), fait cette semaine, prochaine semaine, risques et besoins d’arbitrage. Toujours le même jour. La régularité construit la confiance plus que le contenu.'},
 {h:'Parler risque et incertitude', key:true, p:'Donner des fourchettes avec hypothèses (« 4 à 6 semaines si l’API partenaire est prête ; 8 sinon »), jamais une date unique sans condition. Annoncer un retard dès qu’on le sait, avec un plan. Le lead qui annonce tôt garde la confiance ; celui qui annonce tard la perd même s’il livre.'},
 {h:'Anglais écrit : le niveau cible', p:'Le niveau « professionnel » doit devenir « je peux écrire un design doc et un post-mortem en anglais sans relecture ». Méthode : écrire chaque document important de ce parcours en anglais à partir de maintenant, phrases courtes, vocabulaire technique précis, relecture par un outil puis par un pair.'},
],
tasks:['Écrire en anglais un one-pager (conclusion, 3 arguments, demande) sur une décision réelle de la plateforme, destiné à un directeur. Le faire relire.','Rédiger et envoyer un point hebdomadaire au format 8 lignes, trois semaines de suite (commencer cette semaine).','Préparer une explication de 3 minutes du pipeline d’indexation pour un chef de produit, sans aucun nom de technologie. La tester sur quelqu’un.'],
quiz:[
 {q:'Première ligne d’un mail à un directeur ?', o:['Le contexte historique','La conclusion et la décision attendue','Le schéma d’architecture'], a:1, e:'Pyramide : conclusion d’abord.'},
 {q:'Un projet prend du retard. Quand l’annoncer ?', o:['Quand on est sûr de la nouvelle date','Dès qu’on le sait, avec une fourchette et un plan','À la deadline'], a:1, e:'Annoncer tôt préserve la confiance et laisse des options.'},
 {q:'Comment donner une estimation ?', o:['Une date','Une fourchette avec les hypothèses qui la conditionnent','Pas d’estimation'], a:1, e:'La fourchette rend l’incertitude visible et négociable.'},
],
critique:{who:'Mail envoyé à la direction par un DE de l’équipe', text:'« Bonjour, suite à nos investigations sur le watermark du job Dataflow d’indexation, nous avons identifié que l’allowed_lateness et le trigger AfterWatermark causaient des re-émissions ACCUMULATING dans BigQuery… [2 pages] … en conclusion nous aimerions peut-être revoir le mode d’écriture, si vous êtes d’accord. »',
model:['Le lecteur n’a aucune idée de ce qu’on lui demande avant la fin, et encore (« peut-être », « si vous êtes d’accord »).','Jargon dès la première ligne : le directeur arrête de lire. Traduire : « certains chiffres du dashboard de vues sont comptés deux fois ».','Réécriture : « Les vues affichées dans le dashboard X sont surestimées de ~8 % depuis le 3 novembre. Correctif prêt, déploiement jeudi, 0 impact utilisateur. Besoin : votre accord pour recalculer l’historique (2 h d’indisponibilité du dashboard samedi). Détails en annexe. »','Le lead relit ce type de mail avant envoi, et forme à la pyramide.']},
deliverable:'One-pager en anglais relu, 3 points hebdomadaires envoyés, pitch de 3 min validé par un non-technicien.'},

{n:22, title:'Incidents, crises et recrutement', goal:'Tenir le rôle de commandant d’incident, puis construire l’équipe qui en aura moins.',
lesson:[
 {h:'Commandant d’incident', key:true, p:'Un seul rôle décide pendant l’incident : le commandant. Il ne débogue pas ; il coordonne, assigne (qui investigue, qui communique), tient la chronologie, décide des mitigations (rollback, drain, désactivation d’une fonctionnalité) et déclare la fin. Communication : un canal unique, un point toutes les 30 min même sans nouveauté, un message aux parties prenantes avec impact, état, prochaine mise à jour.'},
 {h:'Mitiger avant de comprendre', p:'Pendant l’incident, l’objectif est de rétablir le service, pas de trouver la cause racine. Rollback d’abord si un déploiement est corrélé. Comprendre vient après, au post-mortem. Le lead empêche l’équipe de « juste regarder encore 10 minutes » pendant que l’index pourrit.'},
 {h:'Exercice : la simulation', key:true, p:'Un game day par trimestre : un scénario (le topic est rejoué sur 24 h ; le service account du job est supprimé ; BigQuery refuse les écritures), l’équipe joue, le lead observe. On mesure le temps de détection et de rétablissement, on découvre les runbooks manquants. Rien ne forme mieux.'},
 {h:'Recruter : un process, pas une impression', p:'Fiche de poste avec 5 compétences observables ; une boucle d’entretiens où chaque étape évalue une compétence précise (exercice de conception de pipeline, revue de code, discussion d’incident passé) ; une grille de notation remplie avant la discussion collective ; un retour écrit au candidat. Les entretiens « au feeling » recrutent des gens qui nous ressemblent, pas ceux dont l’équipe a besoin.'},
],
tasks:['Rédiger le runbook « Incident indexation » : rôles, canal, cadence de communication, premières mitigations par symptôme.','Organiser un game day de 45 min en préprod avec un scénario (ex. : rejeu de 24 h). Mesurer détection et rétablissement, lister 3 manques.','Écrire la boucle d’entretien pour un Data Engineer streaming : 4 étapes, compétence évaluée à chacune, grille de notation.'],
quiz:[
 {q:'Pendant l’incident, le commandant doit-il déboguer ?', o:['Oui, il est le plus compétent','Non, il coordonne, assigne et communique','Seulement si c’est rapide'], a:1, e:'Qui débogue perd la vue d’ensemble.'},
 {q:'Déploiement il y a 20 min, index dégradé depuis 15 min. Première action ?', o:['Chercher la cause','Rollback','Augmenter les workers'], a:1, e:'Corrélation forte : rétablir d’abord, comprendre ensuite.'},
 {q:'Quel élément rend un recrutement équitable et fiable ?', o:['Un entretien long avec le lead','Grille de notation par compétence remplie avant la discussion','Un test technique chronométré'], a:1, e:'La grille réduit les biais et la contagion d’opinion.'},
],
critique:{who:'Déroulé d’un incident réel de l’équipe', text:'Index dégradé à 9 h. Trois personnes investiguent chacune de leur côté dans trois threads Slack. Personne ne prévient le produit. À 10 h 30, quelqu’un remarque un déploiement de 8 h 45 et fait un rollback. Service rétabli à 10 h 40. Pas de post-mortem prévu, « c’était juste un mauvais déploiement ».',
model:['Pas de commandant : trois investigations parallèles, aucune synthèse, 1 h 30 pour voir un déploiement corrélé qui aurait dû être la première question.','Aucune communication : le produit l’a appris par les utilisateurs. Un message à 9 h 10 aurait coûté 2 minutes.','Rollback à 10 h 30 pour un déploiement de 8 h 45 : la règle « déploiement récent → rollback d’abord » n’existe pas. L’écrire dans le runbook.','« Juste un mauvais déploiement » : c’est exactement le cas qui mérite un post-mortem (pourquoi pas de canary, pourquoi pas d’alerte avant les utilisateurs ?).']},
deliverable:'Runbook incident + game day réalisé avec mesures + boucle d’entretien écrite.'},

/* ===== P6 CAPSTONE ===== */
{n:23, title:'Capstone : revue d’architecture complète', goal:'Produire et présenter la revue d’architecture de la chaîne d’indexation, du producteur à l’index, comme le ferait un lead externe.',
lesson:[
 {h:'Le livrable', key:true, p:'Un document de 6 à 8 pages, en anglais : <b>1.</b> Résumé exécutif (une demi-page : état, 3 risques majeurs, 3 recommandations, coût et gain). <b>2.</b> Architecture actuelle (schéma, volumes, SLO, coûts). <b>3.</b> Analyse par les sept questions et les modes de défaillance (rejeu, dépendance en panne, ×10, erreur humaine). <b>4.</b> Risques classés par probabilité × impact. <b>5.</b> Recommandations avec effort, gain, réversibilité, ordre. <b>6.</b> Ce que tu ne recommandes pas, et pourquoi. <b>7.</b> Plan 90 jours.'},
 {h:'La présentation', p:'30 min devant l’équipe et ton manager, idéalement un lead d’une autre équipe en invité. 10 min de présentation (résumé exécutif + 3 recommandations), 20 min de questions. Préparer les 5 objections les plus probables. Noter toutes les questions auxquelles tu n’as pas su répondre : c’est ton plan d’apprentissage suivant.'},
 {h:'Critères de qualité', key:true, p:'Chaque affirmation est chiffrée ou sourcée. Chaque recommandation a une alternative rejetée. Chaque risque a un signal de détection. Le document peut être lu par un directeur (résumé) et par un ingénieur (corps) sans frustrer aucun des deux.'},
],
tasks:['Rédiger les sections 1 à 4 (lundi à mercredi). Relecture par un pair jeudi.','Rédiger les sections 5 à 7 et préparer les 5 objections (jeudi, vendredi).','Planifier la présentation pour la semaine 24 : invitations envoyées, document partagé 48 h avant.'],
quiz:[
 {q:'Que contient le résumé exécutif ?', o:['Le schéma d’architecture','État, 3 risques, 3 recommandations, coût et gain, en une demi-page','La liste des technologies'], a:1, e:'Le directeur ne lira que ça ; il doit pouvoir décider.'},
 {q:'Que fait une section « ce que je ne recommande pas » ?', o:['Elle allonge','Elle montre les alternatives évaluées et évite qu’on te les propose en réunion','Elle est inutile'], a:1, e:'Elle prouve le jugement et ferme les débats prévisibles.'},
 {q:'Une affirmation sans chiffre dans la revue. Que faire ?', o:['La garder si elle est vraie','La chiffrer ou la retirer','La mettre en annexe'], a:1, e:'Une revue est jugée sur sa rigueur.'},
],
critique:{who:'Ton premier brouillon, relu par toi-même avec un jour de recul', text:'Relis ton brouillon avec les sept questions et les signaux d’alerte. Écris ici les trois faiblesses que tu y trouves et comment tu les corriges.',
model:['Recommandations sans alternative rejetée : ajouter pour chacune ce qu’on aurait pu faire à la place.','Risques sans signal de détection : pour chaque risque, quelle métrique ou alerte le révèle ?','Coûts et gains en qualificatifs (« significatif », « important ») : remplacer par des ordres de grandeur.','Jargon dans le résumé exécutif : réécrire pour un directeur.']},
deliverable:'Document de revue d’architecture complet, relu par un pair, partagé 48 h avant la présentation.'},

{n:24, title:'Présentation, bilan et suite', goal:'Présenter la revue, t’auto-évaluer honnêtement sur la grille de lead, et écrire ton plan 30/60/90 jours de tech lead.',
lesson:[
 {h:'La grille d’auto-évaluation', key:true, p:'Note-toi de 1 (je découvre) à 4 (je forme les autres) sur : Pub/Sub, Beam/Dataflow, BigQuery à l’échelle, architecture et trade-offs, sens critique en réunion, SLO et fiabilité, sécurité GCP, écriture de décisions, revue et mentorat, roadmap et priorisation, communication direction, gestion d’incident. Puis demande la même note à ton manager et à un pair. Les écarts sont ton plan.'},
 {h:'Plan 30/60/90', p:'<b>30 jours</b> : prendre explicitement le rôle (charte partagée, revues dans la journée, premier ADR d’équipe). <b>60 jours</b> : roadmap adoptée, SLO en place, une délégation réussie. <b>90 jours</b> : une décision d’architecture portée de bout en bout, un game day, un recrutement ou une montée en compétence visible chez quelqu’un d’autre.'},
 {h:'Continuer à apprendre sans se disperser', key:true, p:'Un sujet par mois, un livrable par sujet. Candidats pour la suite : Flink et BigQuery Engine for Flink (pour tenir la comparaison), Iceberg et BigLake (format de table ouvert), gouvernance Dataplex, et la certification Google Professional Data Engineer comme jalon externe. Choisir un, écrire pourquoi, ignorer les autres jusqu’au mois suivant.'},
],
tasks:['Présenter la revue d’architecture (30 min). Noter chaque question sans réponse.','Remplir la grille d’auto-évaluation, demander celle de ton manager et d’un pair, mettre les trois côte à côte.','Écrire le plan 30/60/90 et le partager à ton manager avec une demande de point de suivi dans 30 jours.'],
quiz:[
 {q:'Les notes de ton manager sont plus basses que les tiennes sur « communication direction ». Interprétation ?', o:['Il se trompe','C’est l’écart le plus utile du bilan : demander un exemple concret et en faire un objectif','Ignorer'], a:1, e:'L’écart de perception est de l’information, pas une injustice.'},
 {q:'Combien de sujets d’apprentissage en parallèle après le parcours ?', o:['Autant que possible','Un par mois avec un livrable','Zéro, c’est fini'], a:1, e:'La dispersion est l’ennemie identifiée au départ.'},
 {q:'Quel est le livrable du jour 90 ?', o:['Un certificat','Une décision d’architecture portée de bout en bout et quelqu’un d’autre qui a progressé','Une roadmap'], a:1, e:'Le lead se mesure à ce qu’il fait décider et grandir.'},
],
critique:{who:'Ton bilan, en toute franchise', text:'Sur les 24 semaines : quelles semaines as-tu réellement tenues, lesquelles as-tu survolées, et qu’est-ce que ça dit de ta façon d’apprendre ? Écris-le sans te ménager, puis note la seule habitude que tu gardes.',
model:['Les semaines survolées sont presque toujours celles sans livrable concret ou sans échéance sociale (présentation, relecture). Garder le mécanisme : chaque sujet a un livrable montré à quelqu’un.','Si les semaines leadership ont été plus faciles que les semaines Dataflow, c’est que la zone de confort s’est déplacée : le prochain plan doit reprendre un sujet technique dur.','L’habitude à garder : un document écrit par décision, et les sept questions à voix haute.']},
deliverable:'Revue présentée, grille à trois voix, plan 30/60/90 partagé. Fin du parcours.'},
];

/* ---------- Challenges ----------
 types: estimate (réponse chiffrée, tolérance), choose (configurer), bugs (trouver les défauts), flags (repérer les signaux), build (livrable noté sur grille), sim (simulateur : prédire puis lancer) */
const CH = {
1:[
 {id:'1a',entry:true,type:'estimate',title:'Le backlog, à la main',q:'Un consommateur acquitte <b>200 msg/s</b>. Le producteur publie <b>350 msg/s pendant 20 min</b>, puis redescend à <b>100 msg/s</b>. Le consommateur ne change pas de vitesse.',fields:[{l:'Backlog maximal atteint',u:'messages',a:180000,tol:.05},{l:'Temps pour résorber le backlog après le pic',u:'minutes',a:30,tol:.1}],sol:['Pendant le pic, le backlog grossit de 350 − 200 = 150 msg/s pendant 1 200 s : 180 000 messages.','Après le pic, il décroît de 200 − 100 = 100 msg/s : 180 000 / 100 = 1 800 s = 30 min.','Leçon : la fraîcheur de ton index ne revient pas à la normale à la fin du pic, mais 30 min plus tard. C’est ce que mesure oldest_unacked_message_age.']},
 {id:'1b',type:'choose',title:'Configurer la subscription d’indexation',q:'Le consommateur est un job Dataflow qui traite des lots d’environ 20 s. On veut pouvoir rejouer 24 h après un incident. Choisis chaque réglage.',items:[{l:'Mode de livraison',o:['Push vers Cloud Run','Pull (StreamingPull)','BigQuery subscription'],a:1},{l:'Ack deadline',o:['10 s','60 s','600 s'],a:1},{l:'Conservation des messages acquittés',o:['Désactivée','Activée, 1 jour minimum'],a:1},{l:'Expiration de la subscription',o:['31 jours d’inactivité (défaut)','Jamais'],a:1},{l:'Dead-letter topic',o:['Non, Dataflow gère','Oui, avec sa propre subscription et une alerte'],a:1}],sol:['Pull : Dataflow lit en StreamingPull et contrôle son débit. Push imposerait le rythme de l’endpoint.','60 s : au-dessus du temps de traitement d’un lot, sans attendre 10 min avant relivraison en cas de crash. Les clients étendent le lease de toute façon.','Rétention des acquittés : sans elle, le seek ne rejoue que les non-acquittés. Le rejeu de 24 h exige cette option.','Jamais : une subscription de prod supprimée pour inactivité (préprod gelée, incident long) perd tout son backlog.','DLQ avec subscription et alerte : une DLQ sans lecteur est un trou noir.']},
 {id:'1c',type:'bugs',title:'Trouve les quatre défauts du consommateur',q:'Ce subscriber Python indexe des vidéos. Quatre défauts rendent la perte ou la duplication probables. Liste-les, puis compare.',code:['from google.cloud import pubsub_v1','import requests','','subscriber = pubsub_v1.SubscriberClient()','sub = subscriber.subscription_path("acme-prod", "video-indexer")','','def callback(message):','    message.ack()','    video = parse(message.data)','    try:','        requests.post(INDEX_URL, json=video)','    except Exception as e:','        print("failed", e)','','future = subscriber.subscribe(sub, callback=callback)','future.result()'],bugs:['ack() avant le traitement : si le POST échoue ou si le process crash, le message est perdu. Acquitter après succès, nack() en cas d’échec transitoire.','Pas de flow control : subscribe() sans max_messages/max_bytes laisse le client tirer autant que possible ; la mémoire explose au premier backlog.','Exception avalée avec print : l’échec devient invisible, pas de métrique, pas de DLQ possible. Logger, compter, relancer ou nack.','requests.post sans timeout : un index qui ne répond plus bloque le thread indéfiniment, le backlog monte sans erreur visible.','Bonus : aucune idempotence (pas de version dans le document) : une relivraison écrase l’index avec la même donnée, ou une plus ancienne.']},
],
2:[
 {id:'2a',entry:true,type:'choose',title:'Encaisser une panne de 15 minutes',q:'L’index de recherche tombe parfois 10 à 15 min. Pendant ce temps, aucun message ne doit finir en DLQ, et après, le flux doit reprendre sans marteler l’index. Choisis.',items:[{l:'Retry policy',o:['Immédiate (défaut)','Backoff exponentiel 10 s → 600 s'],a:1},{l:'Max delivery attempts avant DLQ',o:['5','20','100'],a:2},{l:'Que fait le consommateur sur une erreur 503 de l’index ?',o:['ack() et log','nack() (ou laisser expirer) pour relivraison','Réessayer en boucle dans le callback'],a:1},{l:'Un message au schéma invalide (échec garanti)',o:['nack() jusqu’à la DLQ','ack() + écriture dans une table d’erreurs','Ignorer'],a:1}],sol:['Backoff : espace les tentatives pendant la panne au lieu de relivrer toutes les 10 s.','100 tentatives : avec un backoff qui plafonne à 10 min, 5 tentatives n’auraient couvert que quelques minutes ; les messages sains partiraient en DLQ pendant l’incident.','nack() pour le transitoire : laisser Pub/Sub gérer la relivraison avec backoff. Réessayer en boucle dans le callback bloque le worker.','Le message toxique ne doit pas occuper 100 tentatives : le mettre de côté explicitement (table d’erreurs) et acquitter. La DLQ reste pour l’imprévu.']},
 {id:'2b',type:'estimate',title:'Combien de temps avant le plafond du backoff ?',q:'Retry policy exponentielle : première attente <b>10 s</b>, doublée à chaque tentative, plafonnée à <b>600 s</b>.',fields:[{l:'À quelle tentative (en comptant la première livraison comme 1) l’attente atteint-elle 600 s ?',u:'n°',a:7,tol:0},{l:'Temps total écoulé avant cette tentative',u:'secondes',a:630,tol:.05}],sol:['Attentes : 10, 20, 40, 80, 160, 320, puis 640 plafonné à 600. La 7e livraison arrive après l’attente de 600 s.','Cumul avant la 7e : 10+20+40+80+160+320 = 630 s, soit 10,5 min.','Leçon : avec max_delivery_attempts = 5, un message échouant 5 fois part en DLQ après seulement 150 s. Pendant une panne de 15 min, tout part en DLQ.']},
 {id:'2c',type:'bugs',title:'Un consommateur « idempotent » qui ne l’est pas',q:'L’auteur affirme que ce code est idempotent et gère la DLQ. Trouve les trois défauts.',code:['seen = set()','','def handle(message):','    event = json.loads(message.data)','    if event["event_id"] in seen:','        message.ack(); return','    seen.add(event["event_id"])','    current = index.get(event["video_id"])','    if current is None or event["publish_time"] > current["publish_time"]:','        index.upsert(event["video_id"], event)','    message.ack()','','def handle_dlq(message):','    publisher.publish(MAIN_TOPIC, message.data)','    message.ack()'],bugs:['seen est un set en mémoire : perdu au redémarrage (plus de dédup), et sans borne (fuite). La dédup doit vivre dans un état persistant avec TTL, ou s’appuyer sur la version de l’entité.','Comparaison sur publish_time au lieu de la version de l’entité : un rejeu republie d’anciens événements avec un publish_time récent, qui écrasent l’état courant. Comparer entity_version (ou event_time côté métier).','Le handler DLQ republie aveuglément sur le topic principal : un message toxique boucle indéfiniment entre topic, DLQ et topic. Le rejeu depuis la DLQ doit être manuel ou conditionnel, après correction.']},
],
3:[
 {id:'3a',entry:true,type:'estimate',title:'La facture Pub/Sub du flux vidéo',q:'<b>4 M messages/jour</b> de <b>3 Ko</b>, un topic, <b>3 subscriptions</b> (index, reco, archive). Tarif : <b>40 $/TiB</b> de débit (publication + chaque livraison), 30 jours.',fields:[{l:'Coût mensuel approximatif',u:'$',a:56,tol:.2}],sol:['Volume publié : 4 M × 3 Ko × 30 = 360 Go/mois.','Livraisons : 3 subscriptions × 360 Go = 1 080 Go. Total débit = 1 440 Go ≈ 1,34 TiB.','1,34 × 40 ≈ 54 $ (56 $ si tu comptes en Go décimaux). Le coût n’est pas dans Pub/Sub : il est dans Dataflow et dans l’index.']},
 {id:'3b',type:'estimate',title:'Ce que le batching fait au nombre de requêtes',q:'Un producteur publie <b>300 msg/s</b>, un message par requête. On active le batching avec un délai max de <b>100 ms</b> (taille de lot largement suffisante).',fields:[{l:'Requêtes par seconde après batching',u:'req/s',a:10,tol:.2},{l:'Latence supplémentaire maximale ajoutée par le batching',u:'ms',a:100,tol:0}],sol:['Toutes les 100 ms, un lot part : 10 requêtes/s au lieu de 300. Le coût CPU et le nombre de connexions baissent d’autant.','Un message attend au pire 100 ms. Pour une indexation avec un objectif de quelques secondes, c’est invisible.']},
 {id:'3c',type:'choose',title:'Découper les topics',q:'L’équipe doit publier : modifications de vidéos, suppressions de vidéos, modifications de chaînes. Consommateurs : index (toutes les vidéos), reco (vidéos de 3 pays), analytics (tout). Choisis.',items:[{l:'Nombre de topics',o:['1 topic « events »','3 topics : video.updated, video.deleted, channel.updated','1 topic par pays × type (≈ 60)'],a:1},{l:'Comment reco ne reçoit que ses 3 pays',o:['3 topics dédiés','Une subscription avec un filtre sur l’attribut country','Reco filtre dans son code'],a:1},{l:'Ordering key sur video.updated',o:['Aucune','video_id','country'],a:1}],sol:['Un topic par type d’événement métier : contrat stable, IAM lisible, un seul endroit à monitorer par type. Un seul topic fourre-tout force chaque consommateur à tout lire ; un topic par pays multiplie les coûts et perd l’ordre.','Filtre côté serveur : les messages filtrés ne sont pas livrés ni facturés. Filtrer dans le code paie la livraison pour rien.','video_id : l’ordre par vidéo protège l’état final ; la contrainte de débit par clé (1 Mo/s) est très loin pour une vidéo donnée.']},
],
4:[
 {id:'4a',entry:true,type:'bugs',title:'Un événement mal né',q:'Voici le message publié aujourd’hui par le service vidéo. Trouve cinq problèmes qui rendront le fenêtrage, la dédup ou l’évolution impossibles.',code:['{','  "type": "update",','  "video": 48213377,','  "updated_at": "05/11/2026 14:32",','  "changes": {"title": "Nouveau titre"},','  "source": "backend-v2"','}'],bugs:['Pas d’event_id : aucune dédup possible côté consommateur.','Pas de version de schéma : impossible de faire évoluer le format sans casser silencieusement les lecteurs.','updated_at au format local sans fuseau ni secondes : inexploitable comme event_time pour un watermark. Il faut un ISO 8601 UTC ou un timestamp.','Pas de version d’entité : impossible de savoir si cet événement est plus récent que celui déjà appliqué.','Delta (« changes ») : le consommateur doit reconstruire l’état et dépend de l’ordre. Pour l’index, l’état complet est préférable.','Bonus : « video » est un entier nu sans type d’entité ; « type: update » ne dit pas quel objet.']},
 {id:'4b',type:'choose',title:'Garantir que tout changement est publié',q:'Le service vidéo écrit en PostgreSQL puis publie sur Pub/Sub, dans deux appels successifs. On veut zéro événement manquant. Choisis.',items:[{l:'Pattern',o:['Publier d’abord, écrire ensuite','Outbox : écrire l’événement dans la même transaction, un relais publie','Réessayer la publication 3 fois'],a:1},{l:'Le relais outbox publie et crash avant de marquer la ligne « publiée ». Résultat ?',o:['Événement perdu','Événement publié deux fois : acceptable grâce à event_id','Transaction annulée'],a:1},{l:'Filet de sécurité recommandé',o:['Aucun si l’outbox est bien fait','Réconciliation périodique source/index, republication des écarts'],a:1}],sol:['Outbox : l’événement et la donnée sont atomiques. La double écriture a toujours une fenêtre de perte.','Le relais est at-least-once : les doublons sont le prix, event_id les neutralise.','La réconciliation attrape ce que personne n’a prévu (bug de relais, événement rejeté par le schéma, migration). Un contrôle d’intégrité du catalogue est exactement ça.']},
 {id:'4c',type:'build',title:'Rédiger le contrat video.updated v1',q:'Écris le contrat dans un document (pas ici), puis évalue-le honnêtement sur cette grille.',crit:['Enveloppe complète : event_id, event_type, schema_version, event_time (UTC), entity_id, entity_version, producer','Payload = état complet de la vidéo, pas un delta','Chaque champ a un type, une nullité et une phrase de sémantique','Règles d’évolution écrites : ajout optionnel seulement, retrait en deux releases','Un exemple JSON valide et un exemple invalide avec la raison','Propriétaire nommé et procédure de changement (qui relit, délai de préavis)','Un consommateur (reco ou analytics) l’a relu et a laissé au moins un commentaire'],sol:['Un contrat qu’aucun consommateur n’a relu n’est pas un contrat.','La règle d’évolution est ce qui te sauvera dans 18 mois.']},
],
5:[
 {id:'5a',entry:true,type:'bugs',title:'Cinq défauts dans un DoFn',q:'Ce DoFn enrichit des événements vidéo dans un pipeline streaming. Trouve au moins quatre défauts avant de lire la leçon.',code:['class Enrich(beam.DoFn):','    def process(self, element):','        client = redis.Redis(host="dragonfly")','        element["channel"] = client.get(element["channel_id"])','        element["ts"] = time.time()','        print("enriched", element["video_id"])','        yield element','','(p','  | ReadFromPubSub(subscription=SUB)','  | beam.Map(json.loads)','  | beam.ParDo(Enrich())','  | beam.Map(lambda e: (e["video_id"], e))','  | beam.GroupByKey()','  | beam.Map(lambda kv: kv[1][-1])','  | WriteToIndex())'],bugs:['Client Redis créé dans process() : une connexion par élément. Le créer dans setup().','Mutation de l’élément d’entrée (element["channel"] = …) : les PCollections sont immuables ; muter l’entrée produit des résultats non déterministes avec la fusion. Construire un nouveau dict.','time.time() comme horodatage : processing time, non reproductible, inutilisable pour le fenêtrage. Utiliser l’event_time du message.','print() au lieu de logging : non structuré, non filtrable, coûteux à volume.','GroupByKey sans fenêtre en streaming : fenêtre globale, trigger par défaut, rien n’est jamais émis. Le pipeline tourne, l’index reste vide.','kv[1][-1] « le dernier » : l’ordre dans un groupe n’est pas garanti. Choisir par entity_version.']},
 {id:'5b',type:'choose',title:'La bonne transformation',q:'Associe chaque besoin à la transformation la plus adaptée.',items:[{l:'Compter les vues par vidéo sur 1 M de vidéos actives',o:['GroupByKey puis len()','Combine.perKey(sum) ou CombinePerKey','Side input'],a:1},{l:'Ignorer un événement déjà vu dans les 24 h',o:['GroupByKey sur event_id','DoFn avec état par clé et timer de purge','Distinct()'],a:1},{l:'Enrichir avec une table de 500 chaînes mise à jour toutes les heures',o:['Lookup Redis par élément','Side input rafraîchi périodiquement','CoGroupByKey'],a:1},{l:'Router les messages malformés vers une sortie d’erreurs',o:['Lever une exception','Tagged outputs (pvalue.TaggedOutput)','Les ignorer'],a:1}],sol:['Combine fait l’agrégation partielle avant le shuffle : dix fois moins de données transférées qu’un GroupByKey.','La dédup est un problème d’état : état persistant, purge par timer. Distinct() sans fenêtre ne termine jamais en streaming.','Petite table lente : side input. Le lookup par élément coûte une requête par message.','Tagged outputs : une sortie principale, une sortie erreurs matérialisée et monitorée.']},
 {id:'5c',type:'build',title:'Pipeline local testé',q:'Construis le pipeline local (lecture d’un JSON de 1 000 événements, filtre, comptage par catégorie, écriture) et valide-le sur cette grille.',crit:['Tourne sur DirectRunner en une commande documentée','Les messages malformés partent dans une sortie « errors » via tagged outputs','Un test TestPipeline + assert_that sur le cas nominal passe','Un test sur un message malformé vérifie qu’il sort en erreurs et n’interrompt pas le pipeline','Aucun client ni ressource ouvert dans process()','Chaque transform a un nom explicite ("ParseEvents", "CountByCategory")'],sol:['Les noms de transforms sont ce qui rendra --update possible en prod (semaine 8).','Si le test du message malformé t’a pris plus de temps que le pipeline, c’est normal : c’est lui qui a de la valeur.']},
],
6:[
 {id:'6a',entry:true,type:'sim',kind:'window',title:'Simulateur : fenêtres et triggers',q:'Avant de lire la leçon : lis les paramètres et les événements, écris tes prédictions, puis lance la simulation. Le but est de te tromper ici plutôt qu’en prod.'},
 {id:'6b',type:'choose',title:'Configurer le compteur de vues',q:'Dashboard de vues par vidéo et par minute. Fraîcheur voulue < 30 s. Les applis mobiles envoient jusqu’à 5 min en retard. Le sink BigQuery fait un MERGE par (video_id, minute). Choisis.',items:[{l:'Fenêtre',o:['Globale','Fixe 1 min sur event_time','Sessions'],a:1},{l:'Early firing',o:['Aucun','AfterProcessingTime toutes les 10 à 20 s','AfterCount(1)'],a:1},{l:'allowed_lateness',o:['0','5 min','24 h'],a:1},{l:'Mode d’accumulation',o:['DISCARDING','ACCUMULATING'],a:1}],sol:['Fenêtre fixe sur event_time : c’est la définition métier de « par minute ».','Early firing en processing time : résultats provisoires toutes les 10 à 20 s, l’objectif de fraîcheur est tenu sans dépendre du watermark.','5 min = le retard réel observé. 0 jette les retards ; 24 h garde l’état 24 h pour rien.','ACCUMULATING + MERGE : chaque émission porte le total à jour, le MERGE écrase. DISCARDING aurait exigé une somme côté requête.']},
 {id:'6c',type:'bugs',title:'Pourquoi les chiffres sont faux',q:'Ce fragment produit des totaux surestimés dans BigQuery. Trouve les deux causes, et la troisième qui fera perdre des données.',code:['views = (p','  | ReadFromPubSub(topic=TOPIC)','  | beam.Map(parse)','  | beam.WindowInto(FixedWindows(60),','        trigger=AfterWatermark(early=AfterProcessingTime(15)),','        accumulation_mode=AccumulationMode.ACCUMULATING,','        allowed_lateness=0)','  | beam.Map(lambda e: (e["video_id"], 1))','  | beam.CombinePerKey(sum)','  | WriteToBigQuery(TABLE, method="STREAMING_INSERTS",','        write_disposition=BigQueryDisposition.WRITE_APPEND))'],bugs:['ACCUMULATING avec WRITE_APPEND : chaque early pane ajoute une ligne avec le total cumulé ; le dashboard additionne 4 ou 5 totaux par minute. Il faut DISCARDING, ou un MERGE.','ReadFromPubSub(topic=…) sans timestamp_attribute : le timestamp des éléments est l’heure de publication, pas l’event_time. Les événements mobiles en retard sont comptés dans la mauvaise minute.','allowed_lateness=0 : tout élément arrivant après le watermark est jeté sans trace. Sous-estimation silencieuse, surtout mobile.']},
],
7:[
 {id:'7a',entry:true,type:'bugs',title:'Une dédup qui fuit',q:'Ce DoFn est censé ignorer les doublons pendant 24 h. Trouve les trois défauts.',code:['class Dedup(beam.DoFn):','    SEEN = BagStateSpec("seen", StrUtf8Coder())','    TIMER = TimerSpec("expiry", TimeDomain.REAL_TIME)','','    def process(self, kv, seen=beam.DoFn.StateParam(SEEN),','                timer=beam.DoFn.TimerParam(TIMER)):','        key, event = kv','        if event["event_id"] in list(seen.read()):','            return','        seen.add(event["event_id"])','        timer.set(time.time() + 86400)','        yield event','','    @on_timer(TIMER)','    def expire(self):','        pass','','(events | beam.Map(lambda e: (e.get("video_id"), e)) | beam.ParDo(Dedup()))'],bugs:['Le timer ne purge rien : expire() ne fait pas seen.clear(). L’état grossit sans limite, la facture Streaming Engine aussi.','seen.read() liste entière à chaque élément : pour une vidéo très active, chaque message relit des milliers d’ids. Clé = event_id (état par événement, une valeur) ou un état combiné borné.','e.get("video_id") renvoie None pour les événements sans id : tous finissent sur la même clé, une hot key géante sur un seul worker.','Bonus : timer.set() à chaque élément repousse l’expiration ; l’état d’une vidéo active n’expire jamais.']},
 {id:'7b',type:'estimate',title:'La clé chaude',q:'<b>300 msg/s</b> sur <b>10 workers</b>. Une vidéo virale concentre <b>30 %</b> du trafic. Les 70 % restants sont bien répartis.',fields:[{l:'Part du trafic total traitée par le worker qui tient la clé chaude',u:'%',a:37,tol:.08},{l:'Facteur de charge de ce worker par rapport à un worker moyen (= 10 %)',u:'×',a:3.7,tol:.08}],sol:['Le worker chaud reçoit 30 % + 70 %/10 = 37 % du trafic. Les autres 7 % chacun.','Il est 3,7 fois plus chargé qu’un worker moyen : il sature, le backlog monte, et l’autoscaling ajoute des workers qui ne reçoivent rien de cette clé.','Remède : with_hot_key_fanout sur les Combine, ou saler la clé (video_id + random % 8) puis re-agréger.']},
 {id:'7c',type:'choose',title:'Trois enrichissements, trois réponses',q:'Pour chaque cas, choisis la méthode.',items:[{l:'Table des 500 chaînes, change toutes les heures, 50 Ko',o:['Side input rafraîchi par PeriodicImpulse','Lookup BigQuery par élément','CoGroupByKey'],a:0},{l:'Profil utilisateur (30 M de lignes, 5 Go), lu pour 300 msg/s, fraîcheur 1 min',o:['Side input','Lookup Redis/Bigtable avec GroupIntoBatches et cache local','Lookup BigQuery'],a:1},{l:'Joindre le flux « vidéo publiée » au flux « modération validée », qui arrivent à quelques minutes d’écart',o:['Side input','Lookup','CoGroupByKey fenêtré, ou DoFn stateful qui attend l’autre moitié'],a:2}],sol:['Petit et lent : side input.','Gros et frais : store clé-valeur en ms, par lots, avec cache. BigQuery n’est pas un store de lookup.','Deux flux désynchronisés : jointure streaming avec état. Le DoFn stateful (garder la première moitié, émettre à l’arrivée de la seconde, timer de timeout) est souvent plus simple à raisonner que CoGroupByKey.']},
],
8:[
 {id:'8a',entry:true,type:'choose',title:'Update, drain ou cancel ?',q:'Pour chaque situation, choisis l’action.',items:[{l:'Correction d’un bug dans un DoFn, même graphe, mêmes noms',o:['cancel + relance','--update','drain + relance'],a:1},{l:'Changement de taille de fenêtre (1 min → 5 min)',o:['--update','drain + relance','cancel + relance'],a:1},{l:'Le job écrit des données corrompues dans l’index depuis 10 min',o:['drain','cancel immédiat + rollback','--update'],a:1},{l:'Avant une modification risquée de l’état de dédup',o:['Rien','Snapshot du job','Doubler les workers'],a:1}],sol:['Update conserve état et données en vol si le graphe est compatible.','Un changement de fenêtrage est incompatible : drain termine proprement les fenêtres ouvertes.','Quand chaque seconde aggrave les dégâts, cancel ; les messages non acquittés reviendront.','Le snapshot permet de restaurer l’état si la modification tourne mal.']},
 {id:'8b',type:'bugs',title:'Options de lancement à risque',q:'Ce lancement de job Dataflow en prod a cinq problèmes. Trouve-les.',code:['python indexer.py \\','  --runner=DataflowRunner \\','  --project=acme-prod --region=europe-west1 \\','  --streaming \\','  --autoscaling_algorithm=THROUGHPUT_BASED \\','  --worker_machine_type=n2-standard-8 \\','  --requirements_file=requirements.txt   # apache-beam, requests','  # transforms: p | ReadFromPubSub(...) | beam.ParDo(Parse()) | beam.ParDo(Index())'],bugs:['Pas de --max_num_workers : l’autoscaling peut monter très haut lors d’un backlog, la facture avec.','Pas de --service_account_email : le job tourne avec le compte Compute par défaut, souvent Editor sur le projet.','Pas de --no_use_public_ips ni de --subnetwork : workers avec IP publiques.','apache-beam sans version épinglée : la prochaine image pourra changer de SDK, et --update échouera sur un coder incompatible.','Transforms sans nom explicite (ParDo(Parse()) sans label) : les noms générés changent à la moindre modification et cassent --update.','Bonus : pas de --enable_streaming_engine ni de template Flex : lancement depuis un poste, non reproductible, hors GitOps.']},
 {id:'8c',type:'build',title:'Runbook de déploiement',q:'Écris le runbook « déployer, mettre à jour, arrêter le job d’indexation » et note-le.',crit:['Commande d’update avec vérification préalable de compatibilité (dry run ou checklist des changements compatibles)','Procédure de drain avec le délai attendu et la vérification du backlog Pub/Sub ensuite','Procédure de cancel avec rollback explicite et ce qui est perdu','Snapshot : quand le prendre, comment restaurer','Service account dédié, rôles listés, pas d’IP publique','Déclenché par CI/Flux/Airflow, jamais depuis un poste','Relu par un pair qui a exécuté au moins une étape en préprod'],sol:['Un runbook non exécuté par quelqu’un d’autre est un brouillon.']},
],
9:[
 {id:'9a',entry:true,type:'sim',kind:'backlog',title:'Simulateur : backlog et autoscaling',q:'Un pic de trafic arrive. Prédis le retard maximal de fraîcheur et le temps de résorption, puis lance la simulation. Change ensuite max workers et le délai de réaction pour voir ce qui domine.'},
 {id:'9b',type:'estimate',title:'Ce que coûtent les workers',q:'Job streaming : <b>4 workers</b> de <b>4 vCPU</b> et <b>15 Go</b> en continu. Tarifs (donnés pour l’exercice) : <b>0,07 $/vCPU-heure</b>, <b>0,004 $/Go-heure</b>. 30 jours.',fields:[{l:'Coût mensuel des workers (hors Streaming Engine et disque)',u:'$',a:979,tol:.08}],sol:['vCPU : 4 × 4 × 720 h × 0,07 = 806 $.','Mémoire : 4 × 15 × 720 × 0,004 = 173 $.','≈ 979 $/mois. Si Streaming Engine ajoute 900 $, ce n’est pas la machine qu’il faut regarder, c’est l’état et le shuffle.']},
 {id:'9c',type:'flags',title:'Quelles alertes réveillent la nuit ?',q:'Coche uniquement les alertes qui méritent une page vers l’astreinte.',items:[{t:'Data freshness > 5 min pendant 10 min (SLO = 5 min)',f:true},{t:'CPU moyen des workers > 80 %',f:false},{t:'Nombre de workers = max_num_workers',f:false},{t:'Messages dans la DLQ > 0 depuis 15 min',f:true},{t:'System lag > 60 s pendant 2 min',f:false},{t:'Job Dataflow en état FAILED ou CANCELLED',f:true},{t:'Backlog Pub/Sub > 10 000 messages',f:false}],sol:['Page : les symptômes que l’utilisateur subit ou qui signifient que plus rien ne tourne (fraîcheur hors SLO, job mort, DLQ qui se remplit = données en attente humaine).','Ticket ou dashboard : CPU, workers au max, backlog, system lag. Ce sont des causes ou des précurseurs, à regarder le matin ou quand la fraîcheur sonne.']},
],
10:[
 {id:'10a',entry:true,type:'choose',title:'Le bon chemin vers BigQuery',q:'Choisis la méthode d’écriture pour chaque flux.',items:[{l:'Événements d’indexation pour analytics, fraîcheur acceptable 15 min, 4 M lignes/jour',o:['STREAMING_INSERTS','STORAGE_WRITE_API','FILE_LOADS avec triggering_frequency 5 min'],a:2},{l:'Compteurs de vues par minute pour un dashboard à 30 s',o:['STREAMING_INSERTS','STORAGE_WRITE_API','FILE_LOADS'],a:1},{l:'Un job existant en STREAMING_INSERTS qui coûte cher',o:['Le garder, c’est le temps réel','Migrer vers STORAGE_WRITE_API','Passer en batch quotidien'],a:1}],sol:['Fraîcheur de 15 min : les loads sont gratuits en ingestion ; c’est le choix le moins cher.','30 s : Storage Write API, exactly-once possible, moins cher que les streaming inserts.','Les streaming inserts sont le chemin hérité, plus cher et best-effort ; la migration vers Write API est presque toujours gagnante.']},
 {id:'10b',type:'bugs',title:'Un sink qui perd et qui martèle',q:'Ce DoFn écrit par lots dans l’index. Trouve les quatre défauts.',code:['class WriteBulk(beam.DoFn):','    def setup(self):','        self.client = IndexClient(INDEX_URL)','        self.buffer = []','    def process(self, doc):','        self.buffer.append(doc)','        if len(self.buffer) >= 10000:','            while True:','                r = self.client.bulk(self.buffer)','                if r.status == 200: break','            self.buffer = []','    def finish_bundle(self):','        pass'],bugs:['Lot de 10 000 documents en mémoire par worker : plusieurs centaines de Mo par thread ; 200 à 1 000 est la bonne plage.','Retry infini immédiat sur tout statut ≠ 200 : sur un 503 d’index saturé, le job aggrave la panne ; sur un 400 (document invalide), il boucle à jamais. Backoff exponentiel borné pour le transitoire, mise de côté pour le définitif.','finish_bundle() ne vide pas le buffer : en streaming, les bundles sont petits ; les documents restent en mémoire jusqu’au prochain seuil, parfois des heures. Flush en finish_bundle, ou GroupIntoBatches avec timeout.','Aucune version dans le bulk : un rejeu écrase des documents récents par des anciens. Upsert conditionnel par entity_version.','Bonus : buffer partagé par l’instance, sans fenêtre : les documents de lots différents se mélangent avec le timestamp du dernier.']},
 {id:'10c',type:'estimate',title:'Dimensionner les bulks',q:'<b>300 documents/s</b>, lots de <b>500</b> documents ou <b>2 s</b> d’attente max.',fields:[{l:'Requêtes bulk par seconde en régime nominal',u:'req/s',a:0.6,tol:.1},{l:'Latence maximale ajoutée par le batching quand le trafic est faible',u:'s',a:2,tol:0}],sol:['300/500 = 0,6 requête/s : l’index reçoit une requête toutes les 1,7 s au lieu de 300 par seconde.','Quand le trafic baisse (la nuit), le lot n’est jamais plein : le timeout de 2 s borne l’attente. Sans timeout, les derniers documents attendraient indéfiniment.']},
],
11:[
 {id:'11a',entry:true,type:'build',title:'Sept questions sur une vraie demande',q:'Prends la demande « recherche personnalisée en temps réel » (ou une demande réelle de la semaine). Réponds par écrit aux sept questions en 15 lignes. Note-toi.',crit:['Le problème est formulé en une phrase sans nom de technologie','« Ne rien faire » a une conséquence écrite et datée','Au moins deux alternatives, dont une volontairement simple','Trois modes de défaillance : ×10, dépendance en panne, erreur humaine','Un ordre de grandeur de coût (construction, run, personnes)','La réversibilité est qualifiée (un sens / deux sens) et justifiée','Une métrique de succès avec un seuil et une date de vérification'],sol:['Si une question n’a pas de réponse, c’est la plus utile : c’est celle à poser en réunion.']},
 {id:'11b',type:'estimate',title:'Ordres de grandeur en 60 secondes',q:'Sans calculatrice. <b>120 M vidéos</b>, <b>2 Ko</b> d’état chacune. <b>2 %</b> modifiées par jour, pic à <b>×10</b> de la moyenne.',fields:[{l:'Taille de l’état complet du catalogue',u:'Go',a:240,tol:.1},{l:'Messages par seconde au pic',u:'msg/s',a:278,tol:.15}],sol:['120 M × 2 Ko = 240 Go : tient sur un disque, pas dans la mémoire d’un worker.','2,4 M/jour ÷ 86 400 ≈ 28/s en moyenne, 280/s au pic. Un seul job Dataflow modeste suffit : c’est l’argument qui tue « il nous faut 40 jobs ».']},
 {id:'11c',type:'flags',title:'Repérer les signaux d’alerte',q:'Dans ce compte rendu de réunion, coche les phrases qui doivent déclencher une question de lead.',items:[{t:'« On va mettre Kafka, c’est ce qu’il faut pour le streaming. »',f:true},{t:'« Au pic, on mesure 280 messages par seconde, voici le graphe. »',f:false},{t:'« C’est temporaire, on nettoiera après le lancement. »',f:true},{t:'« Si l’index tombe, on bascule sur la version précédente en 5 minutes ; on l’a testé mardi. »',f:false},{t:'« Ça scalera, c’est du managé. »',f:true},{t:'« On a évalué deux options, voici pourquoi on écarte la deuxième. »',f:false},{t:'« L’impact sera significatif sur l’expérience utilisateur. »',f:true}],sol:['Solution avant problème, « temporaire », « ça scalera », bénéfice qualifié sans chiffre : quatre signaux classiques.','Les phrases avec un chiffre, un test réalisé ou une alternative écartée sont celles qu’on veut entendre.']},
],
12:[
 {id:'12a',entry:true,type:'build',title:'ADR rétroactif : Feast',q:'Écris l’ADR « choix de Feast comme feature store » comme si c’était à décider aujourd’hui. Note-le.',crit:['Contexte avec contraintes chiffrées (volume de features, latence en ligne, équipe)','Au moins deux alternatives réellement évaluées, chacune avec un inconvénient concret','Décision en une phrase','Conséquences acceptées (ce qu’on perd, ce qu’on devra maintenir)','Statut et date ; numéroté dans un dossier docs/adr','Lisible en 3 minutes par quelqu’un qui arrive dans l’équipe'],sol:['Si tu n’as pas trouvé d’inconvénient à Feast, l’ADR n’est pas honnête.']},
 {id:'12b',type:'choose',title:'Classer les commentaires de revue',q:'Pour chaque commentaire sur un design doc, choisis le niveau.',items:[{l:'« Le rejeu de 24 h écrasera les versions récentes : pas de version dans l’upsert. »',o:['Bloquant','Important','Suggestion'],a:0},{l:'« Le service account a Editor sur le projet. »',o:['Bloquant','Important','Suggestion'],a:0},{l:'« Le lot de 10 000 docs va coûter cher en mémoire. »',o:['Bloquant','Important','Suggestion'],a:1},{l:'« Je nommerais la transform ParseEvents plutôt que Parse. »',o:['Bloquant','Important','Suggestion'],a:2},{l:'« Aucune alternative n’est présentée. »',o:['Bloquant','Important','Suggestion'],a:0}],sol:['Bloquant : perte ou corruption de données, sécurité, irréversible, impossibilité d’évaluer la décision.','Important : coût, performance, complexité à corriger avant la prod mais sans danger immédiat.','Suggestion : lisibilité, style, préférence.']},
 {id:'12c',type:'build',title:'Reformuler en questions',q:'Réécris ces trois commentaires en questions qui font réfléchir l’auteur : « il faut une dédup », « ce design est incomplet », « je ferais ça en batch ». Note-toi.',crit:['Chaque question décrit une situation concrète (« que se passe-t-il si… »)','Aucune question ne contient la solution attendue','Le ton laisse à l’auteur la possibilité d’avoir raison','Tu as utilisé au moins une de ces questions dans une vraie revue cette semaine'],sol:['« Que se passe-t-il si Pub/Sub relivre le même message deux fois à 1 s d’intervalle ? » vaut mieux que « il faut une dédup ».']},
],
13:[
 {id:'13a',entry:true,type:'estimate',title:'Le prix d’une table non partitionnée',q:'Table d’événements de <b>50 To</b> (2 ans d’historique). <b>7 200 requêtes/mois</b> la scannent entièrement, toutes filtrent sur les 7 derniers jours. On-demand à <b>6,25 $/TiB</b>.',fields:[{l:'Coût mensuel aujourd’hui',u:'$',a:2050000,tol:.15},{l:'Coût après partition par jour (chaque requête ne lit que 7 jours sur 730)',u:'$',a:19600,tol:.2}],sol:['7 200 × 50 To = 360 000 To ≈ 327 000 TiB × 6,25 ≈ 2,05 M$. Oui, par mois. C’est ce genre de chiffre qui fait sauter un budget.','Partitionné : chaque requête lit 50 × 7/730 ≈ 0,48 To. 7 200 × 0,48 ≈ 3 450 To ≈ 3 140 TiB × 6,25 ≈ 19 600 $. Facteur 100.','Dans la vraie vie le cache et les slots adoucissent, mais le levier est le même que sur Snowflake : lire moins.']},
 {id:'13b',type:'choose',title:'Partitionner et clusteriser',q:'Choisis le design pour chaque table.',items:[{l:'Événements de visionnage, 2 Go/jour, requêtes par jour et par video_id',o:['Pas de partition, cluster video_id','Partition par jour (event_time), cluster video_id, expiration 400 jours','Partition par video_id'],a:1},{l:'Catalogue vidéos (120 M lignes, 200 Go), lu par pays et par chaîne',o:['Partition par jour d’ingestion','Pas de partition, cluster (country, channel_id)','Partition par country'],a:1},{l:'Table de 400 Go rafraîchie par MERGE toutes les 5 min, requêtée sur « dernière heure »',o:['Partition par heure','Partition par jour + cluster sur updated_at','Streaming inserts'],a:1}],sol:['Les événements se partitionnent sur le temps ; le cluster sur l’identifiant le plus filtré ; l’expiration évite la croissance infinie.','Une dimension sans axe temporel se clusterise sur ses filtres fréquents ; partitionner par pays (valeurs peu nombreuses) ne s’applique pas en BigQuery hors plage d’entiers.','Les partitions horaires explosent le nombre de partitions (limite 10 000, ≈ 416 jours) ; jour + cluster suffit.']},
 {id:'13c',type:'bugs',title:'La requête à 400 $',q:'Cette requête de dashboard tourne toutes les 5 minutes. Trouve les quatre défauts.',code:['SELECT *','FROM `acme.analytics.view_events` e','JOIN `acme.catalog.videos` v ON v.id = e.video_id','WHERE DATE(e.event_time) >= DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY)','ORDER BY e.event_time DESC'],bugs:['SELECT * sur deux tables larges : BigQuery facture chaque colonne lue. Lister les colonnes nécessaires.','DATE(e.event_time) sur la colonne de partition empêche l’élagage des partitions ; filtrer directement sur event_time >= TIMESTAMP(...)','Jointure avec le catalogue complet (200 Go) sans filtre : lire 200 Go toutes les 5 min pour quelques colonnes.','ORDER BY sur l’ensemble du résultat sans LIMIT : tri coûteux d’un résultat que le dashboard n’affiche pas en entier.','Bonus : un dashboard à 5 min devrait lire une vue matérialisée ou une table agrégée, pas les événements bruts.']},
],
14:[
 {id:'14a',entry:true,type:'build',title:'Matrice de décision streaming',q:'Construis la matrice (critères pondérés, trois options) pour le pipeline d’indexation, puis note-la.',crit:['Les critères et leurs poids sont fixés avant de noter les options','Au moins 6 critères : garanties, opérations, coût ×1 et ×10, écosystème, portabilité, latence réelle','Les trois options incluent la plus simple (micro-batch Airflow)','Chaque note est justifiée par un fait ou un chiffre, pas une impression','La conclusion dit aussi ce qui ferait changer d’avis','Un pair l’a relue et a contesté au moins une note'],sol:['Si l’option gagnante est celle que tu préférais au départ et que personne n’a contesté une note, refais-la avec un pair plus critique.']},
 {id:'14b',type:'flags',title:'Démonter un argumentaire',q:'Coche les arguments qui ne sont pas des critères de décision.',items:[{t:'« Kafka est le standard de l’industrie. »',f:true},{t:'« Nous devons rejouer 6 mois d’événements, Pub/Sub plafonne à 31 jours. »',f:false},{t:'« Netflix et Uber utilisent Flink. »',f:true},{t:'« Trois consommateurs sont sur AWS et ne peuvent pas lire Pub/Sub simplement. »',f:false},{t:'« Dataflow est une boîte noire. »',f:true},{t:'« L’équipe n’a personne qui a opéré un cluster Kafka ; l’astreinte serait à construire. »',f:false},{t:'« Il faut éviter la dépendance à Google. »',f:true}],sol:['Un critère de décision se rapporte à une contrainte mesurable de ton contexte : rétention, consommateurs, compétences, coût.','« Standard », « Netflix », « boîte noire », « dépendance » sont des opinions tant qu’elles ne sont pas traduites en contrainte concrète.']},
 {id:'14c',type:'estimate',title:'Construire ou acheter',q:'Opérer Kafka soi-même : <b>0,5 ETP</b> à <b>100 k€/an</b> chargé, plus <b>400 €/mois</b> de machines. Service managé : <b>2 000 €/mois</b>, <b>0,1 ETP</b> de suivi.',fields:[{l:'Coût annuel « soi-même »',u:'€',a:54800,tol:.05},{l:'Coût annuel « managé »',u:'€',a:34000,tol:.05}],sol:['Soi-même : 50 000 + 4 800 = 54 800 €/an. Managé : 24 000 + 10 000 = 34 000 €/an.','Le managé est 20 k€ moins cher, sans compter l’astreinte et le risque. « On peut le faire nous-mêmes » doit toujours être traduit en ETP.']},
],
15:[
 {id:'15a',entry:true,type:'estimate',title:'Le budget d’erreur',q:'SLO de fraîcheur : <b>99,9 %</b> du temps sous 5 min, fenêtre glissante de <b>30 jours</b>.',fields:[{l:'Budget d’erreur mensuel',u:'minutes',a:43,tol:.05},{l:'Même calcul pour un SLO à 99,5 %',u:'minutes',a:216,tol:.05}],sol:['30 jours = 43 200 min. 0,1 % = 43,2 min : un seul incident d’une heure consomme tout le budget.','99,5 % = 216 min, soit 3,6 h. Choisir la cible est une décision produit : que coûte réellement une heure d’index périmé ?']},
 {id:'15b',type:'choose',title:'Définir les SLI',q:'Pour chaque SLO, choisis l’indicateur mesurable.',items:[{l:'Fraîcheur de l’index',o:['CPU du job Dataflow','Âge du watermark (data freshness) ou oldest_unacked_message_age','Nombre de messages publiés'],a:1},{l:'Complétude',o:['Backlog = 0','Part des vidéos modifiées (source) présentes dans l’index sous 10 min, mesurée par réconciliation','Nombre de workers'],a:1},{l:'Exactitude',o:['Aucune erreur dans les logs','Écart entre un échantillon de documents de l’index et la source','Taux de succès des bulks'],a:1}],sol:['Un SLI mesure ce que l’utilisateur vit, depuis l’extérieur du système si possible. La réconciliation est le SLI de complétude et d’exactitude ; les métriques internes sont des diagnostics.']},
 {id:'15c',type:'flags',title:'Trier les alertes existantes',q:'Voici sept monitors de l’équipe. Coche ceux à supprimer ou à rétrograder en ticket.',items:[{t:'Page : erreurs > 0 sur le job (déclenchée 40 fois ce mois, 0 action)',f:true},{t:'Page : fraîcheur > SLO 10 min (déclenchée 2 fois, 2 actions)',f:false},{t:'Page : pod Airflow redémarré (12 fois, 0 action)',f:true},{t:'Page : DLQ > 0 pendant 15 min (1 fois, 1 action)',f:false},{t:'Page : CPU > 70 % (déclenchée 90 fois, 0 action)',f:true},{t:'Ticket : coût BigQuery journalier > 150 % de la moyenne (3 fois, 3 actions)',f:false}],sol:['Ratio action/déclenchement : 0 action sur 40 ou 90 déclenchements, c’est du bruit qui détruit la crédibilité des pages utiles.']},
],
16:[
 {id:'16a',entry:true,type:'bugs',title:'Un contrat qui n’en est pas un',q:'Voici la « spec » de la table de sortie de l’indexation. Trouve cinq manques.',code:['# Table acme.search.indexed_videos','# Colonnes : video_id STRING, title STRING, status INT, indexed_at TIMESTAMP','# Mise à jour : en continu par le job Dataflow','# Contact : équipe data','','# Tests dbt :','#   - not_null: title','# Réconciliation : COUNT(*) source vs COUNT(*) index, chaque nuit'],bugs:['video_id sans test unique ni not_null : la clé n’est pas garantie.','status INT sans sémantique : que veut dire 2 ? Les valeurs acceptées doivent être listées et testées (accepted_values).','« Contact : équipe data » : pas de propriétaire nommé, pas de procédure de changement ni de préavis.','Pas de version de schéma ni de règle d’évolution.','Réconciliation par COUNT(*) : deux ensembles de même taille peuvent différer totalement. Comparer les clés (EXCEPT) et un échantillon de contenu.','Pas de garantie de fraîcheur ni de complétude écrite : « en continu » n’est pas un engagement.']},
 {id:'16b',type:'choose',title:'Rendre chaque écriture idempotente',q:'Pour chaque sink, choisis la stratégie qui rend un rejeu inoffensif.',items:[{l:'Table BigQuery de faits partitionnée par jour, backfill d’une journée',o:['INSERT en append','Remplacement de la partition (WRITE_TRUNCATE sur la partition)','DELETE puis INSERT ligne à ligne'],a:1},{l:'Document dans l’index de recherche',o:['Index unitaire sans condition','Upsert conditionnel sur entity_version','Supprimer puis recréer'],a:1},{l:'Table d’état BigQuery (une ligne par vidéo)',o:['Append','MERGE sur video_id avec condition sur la version','TRUNCATE + reload complet toutes les 5 min'],a:1}],sol:['Partition remplacée : rejouable autant de fois qu’on veut, atomique.','La version décide, pas l’ordre d’arrivée.','MERGE conditionnel : seule une version plus récente écrase.']},
 {id:'16c',type:'build',title:'Post-mortem présenté',q:'Rédige le post-mortem d’un incident passé et présente-le. Note-le.',crit:['Chronologie factuelle horodatée, de la cause au rétablissement','Impact chiffré (durée, vidéos ou utilisateurs affectés)','Au moins trois causes contributives, aucune n’est une personne','Temps de détection et temps de rétablissement calculés, avec ce qui les aurait réduits','Ce qui a bien fonctionné','Actions avec propriétaire et date, créées dans le backlog','Présenté en 10 min, ton sans blâme tenu pendant les questions'],sol:['L’action la plus utile est presque toujours sur la détection : pourquoi a-t-on mis si longtemps à savoir ?']},
],
17:[
 {id:'17a',entry:true,type:'flags',title:'Audit IAM express',q:'Coche les lignes qui sont un risque à corriger.',items:[{t:'Le job Dataflow tourne avec le service account Compute par défaut, rôle Editor',f:true},{t:'Les pods GKE s’authentifient via Workload Identity',f:false},{t:'Une clé JSON de service account est stockée dans le repo Airflow (chiffrée avec sops)',f:true},{t:'Le dataset BigQuery de prod est accessible en lecture au groupe data-analysts@',f:false},{t:'Les colonnes user_id et ip ne portent aucun policy tag',f:true},{t:'Les data access logs BigQuery sont désactivés « pour le coût »',f:true},{t:'Les workers Dataflow n’ont pas d’IP publique',f:false}],sol:['Editor par défaut, clé exportée même chiffrée (elle finit sur un poste), colonnes personnelles sans contrôle, pas de logs d’accès : quatre écarts classiques.','Groupes IAM par rôle métier et Workload Identity sont les bonnes pratiques.']},
 {id:'17b',type:'choose',title:'Le bon mécanisme',q:'Associe chaque besoin au mécanisme GCP.',items:[{l:'Un pod GKE doit lire Pub/Sub sans clé',o:['Clé JSON en secret Kubernetes','Workload Identity','Compte utilisateur'],a:1},{l:'Empêcher la copie d’un dataset vers un projet hors de l’entreprise',o:['CMEK','VPC Service Controls','Policy tags'],a:1},{l:'Masquer user_id aux analystes mais pas au pipeline',o:['Vue par analyste','Policy tag sur la colonne + rôle Fine-Grained Reader pour le pipeline','Table dupliquée'],a:1},{l:'Savoir qui a lu une table sensible le mois dernier',o:['Logs applicatifs','Data access audit logs exportés','Demander aux équipes'],a:1}],sol:['Chaque mécanisme a un périmètre précis : identité (Workload Identity), périmètre réseau/données (VPC-SC), colonne (policy tags), traçabilité (audit logs). Les confondre est fréquent.']},
 {id:'17c',type:'build',title:'Audit de sécurité du périmètre',q:'Réalise l’audit IAM/sécurité de l’indexation et note-le.',crit:['Inventaire des service accounts avec rôles effectifs (pas seulement déclarés)','IAM Recommender appliqué ou justifié pour chaque recommandation','Aucune clé JSON exportée, ou plan de suppression daté','Classification des colonnes personnelles de 2 tables centrales, policy tags posés sur au moins une','Audit logs activés et exportés','Cinq actions priorisées par risque, trois réalisées cette semaine'],sol:['Un audit sans action réalisée est un rapport ; trois actions, c’est une amélioration.']},
],
18:[
 {id:'18a',entry:true,type:'build',title:'Ta charte de lead',q:'Écris en 10 lignes ce que l’équipe peut attendre de toi, ce que tu attends d’elle, comment on décide, comment on se désaccorde. Note-la.',crit:['Un engagement mesurable sur les revues (délai)','Comment une décision technique est prise et où elle est écrite','Ce qui se passe en cas de désaccord persistant (qui tranche, quand)','Ce que tu délègues par défaut (le réversible)','Ce que tu refuses de faire (ex. : être le seul à connaître un composant)','Partagée à ton manager, et à l’équipe si le rôle est officiel'],sol:['La charte n’a de valeur que si tu es pris en défaut dessus et que tu corriges.']},
