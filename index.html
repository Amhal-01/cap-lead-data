<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cap Lead">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Cap Lead Data</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: control-room shell. Fixed header, left rail (phases → weeks), scrolling work area. Dark-first, amber as the single accent. */
:root{
  --bg:#0d1117; --surface:#141a22; --surface-2:#1b232e; --line:#26313f; --line-strong:#36455a;
  --fg:#e9eef4; --muted:#90a0b4; --faint:#5f6f84;
  --accent:#f2b544; --accent-fg:#1a1200; --accent-soft:rgba(242,181,68,.14);
  --ok:#4fcf92; --ok-soft:rgba(79,207,146,.14);
  --late:#f0705e; --late-soft:rgba(240,112,94,.16);
  --info:#73b4ff; --info-soft:rgba(115,180,255,.14);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f4f6f9; --line:#d7dee7; --line-strong:#b9c4d2;
  --fg:#131a23; --muted:#56657a; --faint:#8593a6;
  --accent:#a86300; --accent-fg:#ffffff; --accent-soft:rgba(168,99,0,.12);
  --ok:#157f50; --ok-soft:rgba(21,127,80,.12);
  --late:#c23f2b; --late-soft:rgba(194,63,43,.12);
  --info:#1b63c4; --info-soft:rgba(27,99,196,.12);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f4f6f9; --line:#d7dee7; --line-strong:#b9c4d2;
  --fg:#131a23; --muted:#56657a; --faint:#8593a6;
  --accent:#a86300; --accent-fg:#ffffff; --accent-soft:rgba(168,99,0,.12);
  --ok:#157f50; --ok-soft:rgba(21,127,80,.12);
  --late:#c23f2b; --late-soft:rgba(194,63,43,.12);
  --info:#1b63c4; --info-soft:rgba(27,99,196,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
code{font-family:var(--mono);font-size:.9em;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 .3em}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Shell */
#app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:280px 1fr;grid-template-areas:"head head" "rail main"}
header{grid-area:head;display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:18px;font-weight:900;letter-spacing:-.01em;white-space:nowrap}
.brand small{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.hprog{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.bar{height:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:1;min-width:40px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.bar.ok i{background:var(--ok)}
.hprog b{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.btn{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:8px;padding:7px 12px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--late);border-color:var(--late)}
.btn.small{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
#menuBtn{display:none}

nav.rail{grid-area:rail;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:12px;min-width:0}
.rail .views{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
.rail .views button{display:flex;align-items:center;justify-content:space-between;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;color:var(--muted);font-weight:500}
.rail .views button.active,.rail .views button:hover{background:var(--surface-2);color:var(--fg)}
.rail .views button .k{font-family:var(--mono);font-size:11px;color:var(--faint)}
.phase{margin-bottom:14px}
.phase .ph{display:flex;align-items:baseline;gap:8px;padding:4px 10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.phase .ph span{color:var(--accent)}
.wk{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:6px 10px;color:var(--muted);font-size:14px}
.wk:hover,.wk.active{background:var(--surface-2);color:var(--fg)}
.wk .d{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-strong);flex:none}
.wk.done .d{background:var(--ok);border-color:var(--ok)}
.wk.late .d{background:var(--late);border-color:var(--late)}
.wk.cur .d{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.wk .n{font-family:var(--mono);font-size:11px;color:var(--faint);width:26px;flex:none}
.wk .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{grid-area:main;overflow-y:auto;overflow-x:hidden;padding-block:26px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:860px;margin:0 auto;min-width:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.title{font-size:34px;font-weight:900;letter-spacing:-.02em;margin-bottom:6px}
.lead{color:var(--muted);max-width:62ch;font-size:16px}
section.block{margin-top:34px}
section.block>h2{font-size:14px;font-family:var(--mono);font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:16px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
section.block>h2 .st{font-size:11px;letter-spacing:.06em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{padding:16px 18px}
.stat .l{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:30px;font-weight:900;margin-top:4px;letter-spacing:-.02em}
.stat .s{color:var(--muted);font-size:13px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid var(--line-strong);color:var(--muted)}
.pill.cur{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.late{background:var(--late-soft);color:var(--late);border-color:transparent}
.pill.next{background:var(--info-soft);color:var(--info);border-color:transparent}

/* Lesson */
.lesson{display:flex;flex-direction:column;gap:14px}
.lesson h3{font-size:17px;font-weight:700;margin-bottom:6px}
.lesson p,.lesson li{max-width:70ch}
.lesson ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.lesson .pt{padding:16px 18px;border-left:3px solid var(--line-strong);background:var(--surface);border-radius:0 10px 10px 0}
.lesson .pt.key{border-left-color:var(--accent)}
.why{margin-top:8px;font-size:13.5px;color:var(--muted);font-style:italic}

/* Checklist */
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.task input{margin-top:3px;accent-color:var(--ok);width:16px;height:16px;flex:none}
.task.on{border-color:var(--ok);background:var(--ok-soft)}
.task.on span{color:var(--muted);text-decoration:line-through}

/* Quiz */
.q{margin-bottom:18px}
.q .qt{font-weight:600;margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:block;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.opt:hover{border-color:var(--line-strong)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--late);background:var(--late-soft)}
.opt:disabled{cursor:default}
.expl{font-size:13.5px;color:var(--muted);margin-top:8px;padding-left:12px;border-left:2px solid var(--line-strong)}
.score{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:4px}

/* Critique */
textarea{width:100%;min-height:150px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;resize:vertical;line-height:1.5}
textarea:focus{border-color:var(--accent);outline:none}
.scenario{padding:16px 18px;border:1px dashed var(--line-strong);border-radius:10px;background:var(--surface-2);margin-bottom:12px}
.scenario .who{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.model{margin-top:12px;padding:16px 18px;border-radius:10px;background:var(--surface);border:1px solid var(--accent)}
.model h4{font-size:14px;color:var(--accent);margin-bottom:8px}
.model ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.hint{font-size:13px;color:var(--muted)}

/* Challenges */
.ch{margin-bottom:14px}
.chh{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ch h3{font-size:17px;margin-bottom:6px}
.chq{color:var(--muted);margin-bottom:12px;max-width:70ch}
.fields{display:flex;flex-direction:column;gap:8px}
.fld{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px}
.fld>span:first-child{min-width:0}
.fld .in{display:flex;align-items:center;gap:6px}
.fld input[type=number]{width:130px;background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px;font-family:var(--mono)}
.fld select{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px;max-width:280px}
.fld em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted)}
.fres{font-family:var(--mono);font-size:12px;min-width:20px;font-weight:500}
.fres.ok{color:var(--ok)} .fres.bad{color:var(--late)}
.code{font-family:var(--mono);font-size:12.5px;line-height:1.5;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;margin:0 0 10px;white-space:pre}
.found{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.task.good{border-color:var(--ok);background:var(--ok-soft)} .task.bad{border-color:var(--late);background:var(--late-soft)}
.simgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.simp h4{font-size:12px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:500}
.simp{display:flex;flex-direction:column;gap:8px;min-width:0}
.simout{margin-top:14px}
.simout table{width:100%;border-collapse:collapse;font-size:13px;font-family:var(--mono)}
.simout th,.simout td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
.simout th{color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.simout .EARLY{color:var(--info)} .simout .ON_TIME{color:var(--accent)} .simout .LATE{color:var(--late)}
.simout svg{width:100%;height:auto;display:block;margin-top:10px}
@media (max-width:700px){.simgrid{grid-template-columns:1fr}.fld{grid-template-columns:1fr;gap:6px}}

/* Timeline */
.gantt{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin-top:8px}
.gantt i{display:block;height:14px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.gantt i.done{background:var(--ok);border-color:var(--ok)}
.gantt i.late{background:var(--late);border-color:var(--late)}
.gantt i.cur{background:var(--accent);border-color:var(--accent)}
.glabels{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:6px;font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.04em}
.tl{display:flex;flex-direction:column}
.tl .ph{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:22px 0 8px}
.tl .ph:first-child{margin-top:0}
.tr{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.tr:hover{background:var(--surface)}
.tr .n{font-family:var(--mono);font-size:12px;color:var(--faint)}
.tr .t{font-weight:500;min-width:0}
.tr .t small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}

/* Focus */
#focusBar{display:none}
body.focus #app{grid-template-columns:1fr;grid-template-areas:"head" "main"}
body.focus nav.rail,body.focus .hprog,body.focus #menuBtn,body.focus .brand small{display:none}
body.focus #focusBar{display:flex;align-items:center;gap:14px;flex:1;justify-content:flex-end;min-width:0}
body.focus .hide-in-focus{display:none !important}
#focusBar .clock{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--accent);letter-spacing:.04em}
#focusBar .fw{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fstart{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fstart select{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px}
.banner{padding:14px 18px;border-radius:10px;background:var(--accent-soft);border:1px solid transparent;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}
.banner.late{background:var(--late-soft)}
.banner p{flex:1;min-width:200px}

/* Journal */
.jweek{margin-bottom:14px}
.jweek h3{font-size:15px;margin-bottom:8px;display:flex;gap:10px;align-items:baseline}
.jweek h3 small{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:400}
input[type=date],input[type=text]{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
.rubric{width:100%;border-collapse:collapse;font-size:14px}
.rubric th,.rubric td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.rubric th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tbl{overflow-x:auto}
.sev{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-areas:"head" "main"}
  nav.rail{display:none;position:fixed;top:calc(57px + env(safe-area-inset-top,0px));left:0;right:0;bottom:0;z-index:6;border-right:0}
  body.menu nav.rail{display:block}
  #menuBtn{display:inline-flex}
  .title{font-size:28px}
  .brand small{display:none}
  .hprog b{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>


<div id="app">
  <header>
    <button class="btn small" id="menuBtn" aria-label="Menu">☰</button>
    <div class="brand"><h1>Cap Lead Data</h1><small>Parcours 24 sem.</small></div>
    <div class="hprog"><div class="bar" id="hbar"><i></i></div><b id="hpct" class="num">0 %</b></div>
    <div id="focusBar"><span class="fw" id="focusWeek"></span><span class="clock num" id="clock">25:00</span><button class="btn small" id="focusStop">Interrompre</button></div>
    <button class="btn hide-in-focus" id="focusOpen">◉ Mode focus</button>
  </header>
  <nav class="rail" id="rail"></nav>
  <main id="main"><div class="wrap" id="view"></div></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Content ---------- */
const PHASES = [
  {id:'P1', name:'Pub/Sub maîtrisé', color:'accent', weeks:[1,4]},
  {id:'P2', name:'Beam et Dataflow', weeks:[5,10]},
  {id:'P3', name:'Architecture et sens critique', weeks:[11,14]},
  {id:'P4', name:'Fiabilité, qualité, sécurité', weeks:[15,17]},
  {id:'P5', name:'Leadership technique', weeks:[18,22]},
  {id:'P6', name:'Capstone et bilan', weeks:[23,24]},
];

const WEEKS = [
/* ===== P1 PUB/SUB ===== */
{n:1, title:'Le modèle Pub/Sub, sans zone floue', goal:'Pouvoir dessiner de tête le cycle de vie d’un message et expliquer chaque réglage d’une subscription.',
lesson:[
 {h:'Topic, subscription, message : qui garantit quoi', key:true, p:'Un topic reçoit des messages ; chaque subscription en reçoit une copie indépendante. La livraison est <b>au moins une fois</b> par défaut : un message non acquitté avant la fin de l’ack deadline est relivré. L’ordre n’est garanti que si tu utilises des <b>ordering keys</b> (et uniquement par clé, à 1 Mo/s max par clé).', why:'Tout bug « doublons » ou « ordre bizarre » vient de ces trois phrases.'},
 {h:'Pull vs push vs subscriptions managées', p:'<ul><li><b>Pull</b> (StreamingPull) : le client contrôle le débit, le flow control et les batches. C’est le mode de Dataflow.</li><li><b>Push</b> : Pub/Sub appelle un endpoint HTTPS. Simple, mais le débit est piloté par les réponses de l’endpoint, pas par toi.</li><li><b>BigQuery / Cloud Storage subscriptions</b> : écriture directe sans code, idéal pour archiver ou pour un audit brut.</li></ul>'},
 {h:'Les réglages qui comptent', p:'<ul><li><b>Ack deadline</b> : 10 s par défaut, 600 s max. Les clients modernes l’étendent automatiquement (lease management).</li><li><b>Rétention</b> : 7 jours par défaut sur la subscription, jusqu’à 31 jours. Active la rétention des acquittés si tu veux pouvoir <b>rejouer</b> (seek sur timestamp ou snapshot).</li><li><b>Expiration</b> : une subscription inactive 31 jours est supprimée. Classique en préprod.</li><li><b>Filtres</b> : sur les attributs du message, côté serveur, non facturés comme livrés.</li><li><b>Taille max</b> d’un message : 10 Mo. Au-delà, pointeur vers GCS.</li></ul>'},
 {h:'Le backlog est ta métrique vitale', key:true, p:'Deux métriques à connaître par cœur : <code>subscription/num_undelivered_messages</code> (combien attendent) et <code>subscription/oldest_unacked_message_age</code> (depuis combien de temps le plus vieux attend). La seconde mesure directement ton retard de fraîcheur. Un backlog qui monte avec un consommateur « up » = le consommateur ne suit pas ou n’acquitte pas.'},
],
tasks:['Cartographier sur papier tous les topics et subscriptions du pipeline d’indexation : producteur, consommateur, mode (pull/push), ack deadline, rétention, DLQ oui/non.','Ouvrir Datadog (ou Cloud Monitoring) et tracer oldest_unacked_message_age et num_undelivered_messages sur 7 jours pour la subscription principale. Noter le pic max et à quelle heure.','Faire un seek de test sur une subscription de préprod (timestamp −1h) et observer le rejeu. Noter ce qui se passe côté consommateur (doublons ?).'],
quiz:[
 {q:'Un consommateur traite un message en 45 s, ack deadline 10 s, sans extension de lease. Que se passe-t-il ?', o:['Le message est perdu','Le message est relivré, probablement à un autre consommateur, pendant que le premier le traite encore','Pub/Sub attend la fin du traitement'], a:1, e:'At-least-once : passé le deadline, Pub/Sub relivre. Le traitement doit être idempotent ou le lease étendu.'},
 {q:'Tu veux garantir l’ordre des événements d’une même vidéo. Quelle contrainte acceptes-tu ?', o:['Aucune, l’ordre est garanti par défaut','Le débit par ordering key est limité (≈1 Mo/s) et une erreur de publication bloque la clé jusqu’à reprise','Il faut passer en push'], a:1, e:'Les ordering keys sérialisent par clé : moins de parallélisme et gestion explicite des échecs de publication.'},
 {q:'Quelle métrique mesure le mieux la fraîcheur de ton index ?', o:['num_undelivered_messages','oldest_unacked_message_age','ack_message_count'], a:1, e:'L’âge du plus vieux message non acquitté est le retard réel en secondes, quel que soit le volume.'},
],
critique:{who:'Proposition d’un collègue en design review', text:'« Pour la refonte de l’indexation, on va publier un message par vidéo modifiée sur un topic, et une subscription <b>push</b> appellera un service Cloud Run qui indexe la vidéo. Un message = une requête HTTP = une écriture dans l’index. C’est simple et ça scale tout seul. »',
model:['Push : le débit est dicté par la latence de l’endpoint. Un ralentissement de l’index crée des retries en cascade (retry storm), pas un ralentissement propre.','Pas de batching : 120 M de vidéos → 120 M de requêtes unitaires vers l’index. Le coût et la pression sur le moteur de recherche sont dix à cent fois supérieurs à des bulks.','At-least-once + indexation unitaire : sans idempotence (version de document, upsert conditionnel), chaque relivraison réécrit l’index, parfois avec une version plus ancienne.','Aucun mode de dégradation : si l’index est indisponible 20 min, Cloud Run scale au max, échoue, et la DLQ (si elle existe) se remplit. Qui rejoue ? Comment ?','Question à poser avant de discuter la solution : quelle fraîcheur veut-on réellement (10 s ? 5 min ?) et combien d’événements par seconde au pic ? Sans ces deux chiffres, « ça scale » n’est pas un argument.']},
deliverable:'Une page « Carte Pub/Sub de l’indexation » (schéma + tableau des réglages) partagée à l’équipe.'},

{n:2, title:'Garanties, erreurs et rejeu', goal:'Savoir concevoir un consommateur qui ne perd rien, ne duplique rien de visible, et ne bloque jamais sur un message toxique.',
lesson:[
 {h:'Exactly-once : ce que ça couvre, et ce que ça ne couvre pas', key:true, p:'L’option <b>exactly-once delivery</b> (subscriptions pull uniquement) garantit qu’un message acquitté avec succès n’est pas relivré, et que l’ack retourne un statut vérifiable. Elle ne protège pas contre : un producteur qui publie deux fois (retry réseau), un consommateur qui écrit dans l’index puis crash avant l’ack. <b>L’idempotence côté écriture reste obligatoire</b> : clé naturelle + version, ou upsert conditionnel.'},
 {h:'Dead-letter topic et retry policy', p:'<ul><li><b>Retry policy</b> : « immediate » (défaut) ou backoff exponentiel entre 10 s et 600 s. Le backoff évite de marteler une dépendance malade.</li><li><b>DLQ</b> : après N tentatives (5 à 100), le message part sur un topic mort. Il faut une subscription sur ce topic, une alerte, et un <b>runbook de rejeu</b>, sinon la DLQ est un trou noir.</li><li>Un message est « toxique » quand il échouera toujours (schéma invalide, référence absente). Le distinguer d’un échec transitoire est le vrai travail du consommateur.</li></ul>'},
 {h:'Schémas et évolution', p:'Pub/Sub peut attacher un schéma Avro ou Protobuf à un topic et rejeter les messages invalides. Les révisions de schéma permettent d’ajouter des champs optionnels. Règle de lead : un champ ajouté est toujours optionnel ; un champ retiré est d’abord ignoré par tous les consommateurs pendant une release, puis supprimé.'},
 {h:'Le rejeu comme fonctionnalité, pas comme accident', key:true, p:'Un pipeline mature sait rejouer N heures : seek sur timestamp, ou snapshot pris avant un déploiement risqué. Cela impose que les consommateurs tolèrent les doublons et que les écritures soient ordonnées par <b>version de la donnée</b>, pas par heure d’arrivée.'},
],
tasks:['Ajouter (ou vérifier) une DLQ et une retry policy exponentielle sur la subscription principale, en Terraform.','Créer un monitor Datadog : messages dans la DLQ > 0 pendant 5 min → alerte, avec un lien vers le runbook de rejeu que tu écris cette semaine (10 lignes suffisent).','Relire le code du consommateur : identifier la clé d’idempotence et ce qui se passe si le même message arrive deux fois à 1 s d’intervalle. Écrire le résultat en 5 lignes.'],
quiz:[
 {q:'Exactly-once delivery activé. Le consommateur écrit dans l’index puis crash avant l’ack. Résultat ?', o:['Aucune relivraison, l’écriture est perdue','Le message est relivré et l’écriture refaite : l’idempotence décide si c’est visible','Pub/Sub annule l’écriture'], a:1, e:'Exactly-once concerne la livraison et l’ack, pas les effets de bord du consommateur.'},
 {q:'Une dépendance (index) tombe 15 min. Quel réglage limite les dégâts ?', o:['Ack deadline à 600 s','Retry policy à backoff exponentiel + DLQ avec seuil élevé','Passer en push'], a:1, e:'Le backoff espace les tentatives ; un seuil DLQ trop bas enverrait des messages sains en DLQ pendant l’incident.'},
 {q:'Comment ajouter un champ à un schéma Avro sans casser les consommateurs ?', o:['Champ obligatoire avec valeur par défaut côté producteur','Champ optionnel (avec default) dans une nouvelle révision','Nouveau topic'], a:1, e:'Compatibilité ascendante : les anciens lecteurs ignorent le champ, les nouveaux le lisent.'},
],
critique:{who:'Décision proposée en stand-up', text:'« On active exactly-once delivery sur la subscription et on retire la déduplication par <code>video_id + version</code> dans le job Dataflow. Ça simplifie le code et on gagne du CPU. »',
model:['Exactly-once ne couvre ni les doubles publications du producteur ni les retries internes de Dataflow : la dédup côté pipeline protège contre des cas que la subscription ne voit pas.','Le rejeu (seek) redevient dangereux : sans dédup par version, un rejeu réécrit des versions anciennes par-dessus des récentes.','Gain CPU non chiffré : demander la mesure. Une dédup par état est en général négligeable face à l’I/O d’indexation.','Bonne question de lead : quelle est la source de vérité de la version ? Si c’est le producteur, la dédup appartient au consommateur final, pas au transport.']},
deliverable:'Runbook « Rejeu et DLQ de l’indexation » (procédure, commandes, qui prévenir).'},

{n:3, title:'Débit, quotas et coûts', goal:'Estimer à l’ordre de grandeur près le coût et les limites d’un flux avant de le construire.',
lesson:[
 {h:'Le modèle de prix', key:true, p:'Pub/Sub facture le <b>débit</b> (publication + livraison, ≈40 $/TiB au-delà des 10 Gio gratuits/mois), la <b>rétention</b> des messages non acquittés ou conservés (≈0,27 $/Gio-mois), et le trafic sortant inter-région. Chaque subscription supplémentaire est une livraison supplémentaire : 3 subscriptions = 3× le coût de livraison.'},
 {h:'Ordre de grandeur, exercice de lead', p:'120 M de vidéos, 2 % modifiées par jour = 2,4 M messages/jour ≈ 28/s en moyenne, souvent 10× au pic (280/s). À 2 Ko par message : 4,8 Go/jour, 144 Go/mois ≈ 6 $/mois de publication. Le coût n’est pas dans Pub/Sub ; il est dans ce que tu fais <b>après</b> (Dataflow, index, BigQuery). Savoir dire « ce n’est pas là que ça coûte » est une compétence de lead.'},
 {h:'Quotas et flow control', p:'<ul><li>Quotas par projet et par région (débit de publication, nombre de topics). À regarder avant un go-live, pas pendant.</li><li><b>Flow control</b> côté client pull : nombre max de messages en vol et octets en vol. C’est ta contre-pression.</li><li><b>Batching</b> côté publication : latence contre coût ; 100 ms de délai de batch divisent souvent le nombre de requêtes par 50.</li><li>Pub/Sub Lite est en fin de vie : ne pas l’évaluer pour un nouveau projet.</li></ul>'},
 {h:'Topologie : peu de topics, bien nommés', key:true, p:'Un topic par <b>type d’événement métier</b> (video.updated, video.deleted), pas par catégorie, par pays ou par client. Les filtres de subscription servent à router. Multiplier les topics multiplie les coûts de livraison, la surface IAM et les trous de monitoring.'},
],
tasks:['Calculer le coût mensuel réel du topic principal de l’indexation à partir des métriques de volume (byte_cost ou message_sizes). Comparer avec la facture GCP du mois dernier.','Lister les quotas Pub/Sub du projet de prod et le pourcentage utilisé au pic. Noter le premier quota que l’on atteindrait à ×10.','Mesurer la latence de publication avec et sans batching depuis un script Python (100 ms de délai de batch). Noter le nombre de requêtes.'],
quiz:[
 {q:'Tu ajoutes une 4e subscription d’archivage BigQuery sur un topic à 1 TiB/mois. Surcoût Pub/Sub approximatif ?', o:['Zéro, le topic est déjà payé','≈40 $/mois de livraison en plus, hors BigQuery','≈400 $/mois'], a:1, e:'Chaque subscription est une livraison facturée au débit.'},
 {q:'Le producteur publie 300 msg/s sans batching. Premier levier ?', o:['Augmenter les quotas','Activer le batching de publication (délai ou taille)','Créer 3 topics'], a:1, e:'Le batching réduit le nombre de requêtes et le coût CPU, au prix de quelques dizaines de ms.'},
 {q:'Quelle découpe de topics un lead recommande-t-il ?', o:['Un topic par pays pour isoler','Un topic par type d’événement métier, filtres pour router','Un topic par consommateur'], a:1, e:'Le type d’événement est stable ; les consommateurs et les pays changent.'},
],
critique:{who:'Schéma présenté par un développeur backend', text:'« Pour isoler les charges, on crée un topic par catégorie de vidéo (sport, musique, news… 40 catégories) et un job Dataflow par topic. Comme ça, si la catégorie sport explose, les autres ne sont pas impactées. »',
model:['40 jobs Dataflow = 40× le coût minimal de workers, 40 déploiements, 40 dashboards. L’isolation s’obtient dans Dataflow par le keying et l’autoscaling, pas par la topologie.','La catégorie d’une vidéo peut changer : le même objet vit sur deux topics, l’ordre entre eux n’existe plus.','« Si sport explose » : chiffrer. Un pic ×10 sur une catégorie représente quoi en msg/s ? Un seul job autoscalé l’absorbe presque toujours.','Alternative simple : un topic, attribut <code>category</code>, et si un jour une catégorie doit être isolée, une subscription filtrée. Réversible en une heure.']},
deliverable:'Note d’estimation « Volumes, quotas et coûts de l’indexation à ×1, ×3, ×10 » (une page, chiffres sourcés).'},

{n:4, title:'Patterns événementiels et contrats', goal:'Concevoir un événement qu’un autre système pourra consommer dans deux ans sans te demander ce qu’il veut dire.',
lesson:[
 {h:'L’enveloppe d’un bon événement', key:true, p:'<code>event_id</code> (UUID, pour la dédup), <code>event_type</code> et <code>schema_version</code>, <code>event_time</code> (quand c’est arrivé dans le métier) distinct de <code>publish_time</code>, <code>entity_id</code> + <code>entity_version</code> (pour l’ordre et l’idempotence), <code>producer</code>, et le payload. Sans <code>event_time</code>, aucun fenêtrage correct n’est possible plus tard.'},
 {h:'État ou delta ? Snapshot ou CDC ?', p:'<ul><li><b>Événement d’état</b> (« voici la vidéo complète v12 ») : consommateur simple, idempotent, rejouable. Plus lourd.</li><li><b>Delta</b> (« titre modifié ») : léger, mais le consommateur doit reconstruire l’état et l’ordre devient critique.</li><li><b>CDC</b> (Datastream, Debezium) : capture fidèle de la base, mais expose le schéma interne de la base à tout le monde. Un lead met une couche de traduction entre CDC et événements métier.</li></ul>Pour une indexation de recherche, l’événement d’état gagne presque toujours.'},
 {h:'Outbox : publier sans perdre ni mentir', p:'Si le service écrit en base puis publie, un crash entre les deux crée un événement fantôme ou manquant. Le pattern <b>outbox</b> écrit l’événement dans la même transaction, et un relais le publie. C’est la réponse à « comment on est sûr que tout ce qui change est indexé ? ».'},
 {h:'Réconciliation : le filet', key:true, p:'Aucun flux n’est parfait. Un job de <b>réconciliation</b> périodique (par exemple un contrôle d’intégrité du catalogue parallélisé sur Kubernetes) compare source et cible et republie les écarts. Le streaming donne la fraîcheur, la réconciliation donne la complétude. Les deux ensemble donnent la confiance.'},
],
tasks:['Rédiger le contrat d’événement video.updated v1 : enveloppe, champs, types, obligatoires/optionnels, règles d’évolution, exemple JSON.','Identifier dans le pipeline actuel ce qui est delta et ce qui est état ; noter un cas réel où l’ordre a posé (ou pourrait poser) problème.','Vérifier comment le producteur garantit la publication (outbox ? double écriture ?). Si double écriture, estimer la fenêtre de perte possible.'],
quiz:[
 {q:'Quel champ est indispensable pour un fenêtrage correct dans Beam ?', o:['publish_time','event_time (heure métier)','ingest_time'], a:1, e:'Le watermark raisonne sur l’heure de l’événement, pas sur son arrivée.'},
 {q:'Le service écrit en base puis publie sur Pub/Sub. Risque principal ?', o:['Doublons','Événement manquant si crash entre les deux écritures','Ordre inversé'], a:1, e:'C’est le problème de la double écriture, résolu par l’outbox.'},
 {q:'Pour alimenter un index de recherche, quel type d’événement privilégier ?', o:['Delta minimal','État complet avec version','Pointeur vers la base pour relire'], a:1, e:'Idempotent, rejouable, indépendant de l’ordre grâce à la version.'},
],
critique:{who:'RFC d’une équipe produit', text:'« On branche Datastream en CDC sur la base vidéos et on envoie directement les lignes modifiées sur Pub/Sub. Tous les consommateurs (search, reco, analytics) lisent le même topic. Zéro code côté producteur. »',
model:['Couplage au schéma interne : chaque migration de table casse potentiellement trois équipes. Qui est responsable du contrat ?','CDC envoie des lignes, pas des événements métier : « vidéo publiée » devient « colonne status passée de 2 à 3 ». Chaque consommateur réinvente la sémantique.','Transactions multi-tables : une vidéo et ses tags arrivent en deux lignes, dans un ordre non garanti. L’index peut voir un état intermédiaire.','Bon compromis : CDC → petit service de traduction → événements métier versionnés. Le zéro code côté producteur est un gain réel ; la traduction est le prix pour le garder.','Question à poser : quel consommateur a besoin du niveau « ligne » ? Probablement seulement analytics, qui peut avoir sa propre subscription brute.']},
deliverable:'Contrat « video.updated v1 » validé par un consommateur de l’équipe reco ou analytics.'},

/* ===== P2 BEAM / DATAFLOW ===== */
{n:5, title:'Le modèle Beam : penser en PCollections', goal:'Écrire, tester localement et lire un pipeline Beam Python sans surprise sur ce qui s’exécute où.',
lesson:[
 {h:'Les quatre briques', key:true, p:'<b>Pipeline</b> → <b>PCollection</b> (immuable, potentiellement infinie, chaque élément a un timestamp et une fenêtre) → <b>PTransform</b> (ParDo, GroupByKey, Combine, Flatten, Partition) → <b>I/O</b>. Le runner (DirectRunner local, DataflowRunner) décide du parallélisme ; ton code ne doit jamais supposer l’ordre ni le nombre de workers.'},
 {h:'Cycle de vie d’un DoFn', p:'<code>setup()</code> (une fois par instance : ouvrir un client), <code>start_bundle()</code>, <code>process()</code> par élément, <code>finish_bundle()</code>, <code>teardown()</code> (non garanti). Un client HTTP ouvert dans <code>process()</code> est l’erreur numéro un de performance. Les bundles sont petits en streaming (souvent quelques éléments) et gros en batch.'},
 {h:'GroupByKey, Combine et side inputs', p:'<ul><li><b>GroupByKey</b> coûte un shuffle : tout élément d’une clé va sur le même worker. En streaming, il a besoin d’une fenêtre pour savoir quand émettre.</li><li><b>Combine</b> (sum, count, custom CombineFn) est plus efficace : le combiner s’exécute partiellement avant le shuffle (combiner lifting).</li><li><b>Side input</b> : une PCollection matérialisée (AsDict, AsSingleton) lisible dans un DoFn ; pratique pour une petite table de référence.</li></ul>'},
 {h:'Tester avant de déployer', key:true, p:'<code>TestPipeline</code> + <code>assert_that(pcoll, equal_to([...]))</code> pour la logique ; <code>TestStream</code> pour simuler l’avancée du watermark et les retards en streaming. Un pipeline sans test unitaire est un pipeline qu’on ne modifiera plus.'},
],
tasks:['Écrire localement un pipeline Python : lire un fichier JSON de 1 000 événements vidéo, parser, filtrer les supprimés, compter par catégorie, écrire un fichier. DirectRunner.','Ajouter deux tests avec TestPipeline et assert_that : un cas nominal, un cas de message malformé routé vers une sortie « erreurs » (tagged outputs).','Lire le code du job d’indexation et annoter chaque DoFn : où sont ouverts les clients, y a-t-il un GroupByKey, quelles fenêtres.'],
quiz:[
 {q:'Où ouvrir un client Elasticsearch/BigQuery dans un DoFn ?', o:['process()','setup()','Au niveau module, hors du DoFn'], a:1, e:'setup() s’exécute une fois par instance de DoFn ; le module peut ne pas être sérialisable proprement.'},
 {q:'Pourquoi préférer Combine.perKey(sum) à GroupByKey + sum ?', o:['Plus lisible','Le combiner s’exécute avant le shuffle, moins de données transférées','GroupByKey n’existe pas en streaming'], a:1, e:'Combiner lifting : agrégation partielle locale.'},
 {q:'Quel outil simule l’avancée du temps en test ?', o:['DirectRunner','TestStream','time.sleep'], a:1, e:'TestStream contrôle éléments, watermark et processing time.'},
],
critique:{who:'Pull request d’un data engineer junior', text:'Un DoFn <code>EnrichVideo</code> ouvre un client Redis dans <code>process()</code>, fait un GET par élément, puis <code>beam.GroupByKey()</code> sur <code>video_id</code> « pour dédupliquer » sans fenêtre explicite, sur un pipeline streaming.',
model:['Client dans process() : une connexion par élément. À 300 msg/s, Redis voit 300 connexions/s. Déplacer dans setup().','GroupByKey sans fenêtre en streaming = fenêtre globale sans trigger : rien ne sortira jamais. Le pipeline semblera « tourner » avec un backlog qui monte.','Dédupliquer par GroupByKey est le mauvais outil : état par clé (dedup avec TTL) ou <code>Distinct</code> fenêtré.','Avant de commenter le code, demander : quel est le besoin de dédup ? Fenêtre de doublons attendue ? Sans ça, aucune implémentation n’est juste.']},
deliverable:'Pipeline de test local avec 2 tests unitaires, commité dans un repo perso ou d’équipe.'},

{n:6, title:'Temps, fenêtres, watermarks, triggers', goal:'Expliquer à un analyste pourquoi un compte « temps réel » peut être faux, et comment le rendre juste.',
lesson:[
 {h:'Deux horloges', key:true, p:'<b>Event time</b> : quand ça s’est passé. <b>Processing time</b> : quand le pipeline le voit. Le <b>watermark</b> est l’estimation du runner : « tous les événements avant T sont probablement arrivés ». Il avance selon les timestamps lus dans Pub/Sub ; un producteur en retard tire le watermark vers l’arrière et retarde toutes les sorties.'},
 {h:'Fenêtres', p:'<ul><li><b>Fixed</b> (toutes les 5 min), <b>Sliding</b> (5 min toutes les 1 min), <b>Sessions</b> (gap d’inactivité), <b>Global</b> (jamais fermée, nécessite un trigger).</li><li>La fenêtre est attachée aux éléments, pas au pipeline : deux branches peuvent fenêtrer différemment.</li></ul>'},
 {h:'Triggers, lateness, accumulation', key:true, p:'<code>AfterWatermark(early=AfterProcessingTime(60), late=AfterCount(1))</code> émet un résultat provisoire chaque minute, le résultat « final » au passage du watermark, puis une correction par élément en retard, jusqu’à <code>allowed_lateness</code>. <b>ACCUMULATING</b> renvoie le total mis à jour (le sink doit écraser) ; <b>DISCARDING</b> renvoie seulement le delta (le sink doit additionner). Mélanger les deux produit des chiffres faux en silence.'},
 {h:'Ce que ça change pour un index de recherche', p:'Pour une indexation « état complet avec version », pas besoin de fenêtre : chaque élément est traité seul. Les fenêtres servent aux agrégats (vues par vidéo sur 5 min, tendances). Savoir quand <b>ne pas</b> fenêtrer est une marque de maturité.'},
],
tasks:['Reprendre le pipeline local : compter les vues par vidéo en fenêtres fixes de 1 min avec early firings toutes les 10 s et allowed_lateness de 2 min. Vérifier avec TestStream qu’un événement en retard corrige bien le compte.','Dessiner (papier) la timeline : 6 événements, 2 en retard, watermark, 3 émissions de la fenêtre. Expliquer à voix haute, 2 min.','Dans le job de prod : relever les fenêtres, triggers, allowed_lateness et mode d’accumulation. Y a-t-il un sink qui additionne un résultat ACCUMULATING ?'],
quiz:[
 {q:'Le watermark recule brusquement de 30 min. Cause probable ?', o:['Un worker a crashé','Des messages avec un event_time ancien sont arrivés (producteur en retard ou rejeu)','La fenêtre est trop petite'], a:1, e:'Le watermark suit les timestamps lus. Un rejeu ou un producteur en retard le fait reculer, et retarde toutes les sorties.'},
 {q:'Mode ACCUMULATING, sink BigQuery en append. Conséquence ?', o:['Aucune','Les totaux sont comptés plusieurs fois à chaque re-émission','Les événements en retard sont perdus'], a:1, e:'ACCUMULATING renvoie le total mis à jour : il faut un upsert/écrasement, pas un append.'},
 {q:'Quand une fenêtre est-elle inutile ?', o:['Toujours en streaming','Quand chaque élément est traité indépendamment (upsert d’état)','Quand le débit est faible'], a:1, e:'Le fenêtrage sert aux agrégations, pas aux transformations élément par élément.'},
],
critique:{who:'Spécification d’un dashboard « vues en temps réel »', text:'« Fenêtre fixe de 1 minute sur l’event_time, trigger par défaut, allowed_lateness 0, écriture en append dans BigQuery. Le dashboard somme les lignes par vidéo et par minute. On veut une fraîcheur < 30 s. »',
model:['Trigger par défaut = émission au watermark seulement : la fraîcheur dépend du watermark, qui est en pratique de plusieurs dizaines de secondes à minutes. L’objectif < 30 s exige des early firings.','allowed_lateness 0 : tout événement en retard (appli mobile hors ligne, rejeu) est jeté. Les chiffres seront systématiquement sous-estimés, sans alerte.','Si on ajoute des early firings en ACCUMULATING avec append, le dashboard double-compte. Il faut DISCARDING + somme côté requête, ou ACCUMULATING + MERGE par (video_id, minute).','Poser la question de valeur : quel usage a besoin de 30 s ? Souvent 2 min suffisent et simplifient tout. La fraîcheur est un coût, pas une vertu.']},
deliverable:'Fiche d’une page « Fenêtres et triggers : nos conventions », avec les trois combinaisons autorisées dans l’équipe.'},

{n:7, title:'État, timers et enrichissement', goal:'Implémenter dédup, jointures et enrichissement en streaming sans faire exploser le coût ni la latence.',
lesson:[
 {h:'État par clé', key:true, p:'Un DoFn peut déclarer un état persistant par clé et par fenêtre : <code>ReadModifyWriteStateSpec</code> (une valeur), <code>BagStateSpec</code> (une liste), <code>CombiningValueStateSpec</code> (un agrégat). Dataflow le stocke dans Streaming Engine. Cas type : dédup par <code>event_id</code> avec un timer qui purge après 24 h ; « dernière version vue » par <code>video_id</code> pour ignorer les versions anciennes.'},
 {h:'Timers', p:'<code>TimerSpec</code> en event time (« quand le watermark passe T ») ou processing time (« dans 10 min »). Permet des timeouts, des flushs périodiques, des sessions maison. Un timer sans purge d’état = fuite mémoire garantie et facture Streaming Engine qui monte.'},
 {h:'Enrichir : trois options', p:'<ul><li><b>Side input</b> rafraîchi périodiquement (pattern « slowly updating side input » avec PeriodicImpulse) : table de référence de quelques Mo.</li><li><b>Lookup externe</b> (Redis/Dragonfly, Bigtable, BigQuery) depuis le DoFn : latence par élément ; batcher avec <code>GroupIntoBatches</code> et utiliser un cache local dans setup().</li><li><b>CoGroupByKey</b> de deux flux : jointure streaming vraie, exige un fenêtrage commun et de l’état pour les arrivées désynchronisées.</li></ul>'},
 {h:'Clés chaudes et fusion', key:true, p:'Une clé (une vidéo virale, un <code>None</code> de parsing) qui reçoit 30 % du trafic sature un worker : c’est la <b>hot key</b>. Remèdes : <code>with_hot_key_fanout</code> sur les Combine, saler la clé, vérifier les clés nulles. Dataflow fusionne les étapes consécutives (fusion) ; après une étape qui change massivement le volume (fan-out), un <code>Reshuffle</code> redistribue le travail.'},
],
tasks:['Implémenter une dédup stateful par event_id avec purge par timer à 24 h dans le pipeline local ; tester avec TestStream qu’un doublon à +1 h est ignoré et qu’à +25 h il passe.','Mesurer sur le job de prod la distribution des clés (log d’un échantillon) : y a-t-il une clé > 5 % du trafic ? Une clé vide ?','Identifier l’enrichissement actuel (Redis ? BigQuery ?) et chiffrer : appels/s, latence p95, coût mensuel. Proposer si batching ou cache réduirait ça.'],
quiz:[
 {q:'Un état par clé sans timer de purge. Conséquence à 3 mois ?', o:['Aucune, Dataflow nettoie','État qui grossit indéfiniment, coût et latence qui montent','Le job redémarre tout seul'], a:1, e:'L’état persiste tant qu’il n’est pas effacé explicitement.'},
 {q:'Table de référence de 2 Mo mise à jour chaque heure. Meilleure option ?', o:['Lookup BigQuery par élément','Side input rafraîchi périodiquement','CoGroupByKey'], a:1, e:'Petite, lente à changer : side input. Le lookup par élément coûte et le CoGroupByKey est surdimensionné.'},
 {q:'Un worker à 100 % CPU, les autres à 10 %, backlog qui monte. Diagnostic ?', o:['Pas assez de workers','Hot key','Fenêtre trop large'], a:1, e:'Le déséquilibre entre workers signe une clé chaude ; l’autoscaling n’y peut rien.'},
],
critique:{who:'Proposition pour l’enrichissement des vidéos', text:'« Pour chaque événement, le job appelle BigQuery (SELECT sur la table channels) pour récupérer les infos de la chaîne. C’est la source de vérité, pas de cache à invalider. »',
model:['Une requête BigQuery par élément : latence de secondes, coût par requête et quota de requêtes concurrentes. À 300 msg/s c’est impossible.','La table channels change rarement : c’est le cas d’école du side input rafraîchi, ou d’un cache Redis/Dragonfly avec TTL.','« Pas de cache à invalider » cache un vrai sujet : quelle fraîcheur de l’info chaîne est acceptable ? 1 h est presque toujours acceptable.','Si vraiment du temps réel : publier aussi les changements de chaîne en événements et faire un CoGroupByKey, ou un lookup Bigtable/Redis (ms), jamais BigQuery.']},
deliverable:'Proposition chiffrée d’enrichissement (avant/après : appels, latence, coût) présentée en 5 min à l’équipe.'},

{n:8, title:'Dataflow en production', goal:'Déployer, mettre à jour et arrêter un job streaming sans perdre de données ni surprendre personne.',
lesson:[
 {h:'Update, drain, cancel', key:true, p:'<ul><li><b>Update</b> (<code>--update</code>) : remplace le job en conservant l’état et les données en vol, si le graphe est compatible (mêmes noms de transforms, coders compatibles). Nommer explicitement chaque transform est une règle d’équipe.</li><li><b>Drain</b> : arrête la lecture, termine les fenêtres ouvertes (émet tout), puis s’arrête. L’arrêt propre.</li><li><b>Cancel</b> : stoppe immédiatement ; ce qui est en vol est perdu côté job (Pub/Sub relivrera les non-acquittés).</li><li><b>Snapshot</b> : sauvegarde l’état d’un job streaming pour le restaurer plus tard, utile avant un changement risqué.</li></ul>'},
 {h:'Autoscaling et Streaming Engine', p:'Streaming Engine déporte l’état et le shuffle hors des workers ; l’autoscaling horizontal ajuste le nombre de workers sur backlog et CPU. Régler <code>max_num_workers</code> est un garde-fou de coût. Dataflow Prime ajoute l’autoscaling vertical (mémoire). Runner v2 est le runtime actuel ; les options héritées sont à éviter.'},
 {h:'Packaging et déploiement', p:'<b>Flex templates</b> : image Docker + spec JSON, lancés par API/Terraform/Airflow. C’est ce qui rend le déploiement GitOps-compatible (Flux déclenche, Airflow orchestre, Terraform déclare). Fixer la version du SDK Beam et des dépendances ; un job streaming vit des mois avec son image.'},
 {h:'Réseau et identité', key:true, p:'Un service account <b>par job</b> avec le minimum (Pub/Sub subscriber, BigQuery dataEditor sur le dataset cible, pas Editor projet). Workers sans IP publique (<code>--no_use_public_ips</code>), sous-réseau dédié, Private Google Access. Ce sont des choix irréversibles à chaud : à faire au premier déploiement.'},
],
tasks:['En préprod : déployer le job d’indexation, puis faire un --update avec un changement compatible (ajout d’un log), puis un changement incompatible (renommer une transform) et observer le refus. Noter les messages.','Faire un drain en préprod pendant un flux, mesurer le délai entre la commande et l’arrêt, vérifier le backlog Pub/Sub ensuite.','Auditer le service account du job de prod : lister ses rôles, proposer la version minimale.'],
quiz:[
 {q:'Tu dois corriger un bug dans un DoFn sans perdre l’état de dédup. Quelle commande ?', o:['cancel puis relance','--update avec un graphe compatible','drain puis relance'], a:1, e:'Update conserve l’état ; drain le vide, cancel le perd.'},
 {q:'Après un drain, le backlog Pub/Sub monte. Normal ?', o:['Non, c’est un bug','Oui : le job ne lit plus, les messages s’accumulent sur la subscription jusqu’au prochain job','Non, drain acquitte tout'], a:1, e:'Drain arrête la lecture ; la subscription conserve les messages (dans la limite de la rétention).'},
 {q:'Quel garde-fou de coût prioritaire sur un job streaming ?', o:['Désactiver Streaming Engine','max_num_workers et type de machine','Réduire la rétention Pub/Sub'], a:1, e:'L’autoscaling sans plafond peut multiplier la facture lors d’un backlog.'},
],
critique:{who:'Procédure de déploiement proposée', text:'« Pour chaque release du job, le CI fait un cancel du job en prod puis lance le nouveau. Ça prend 3 minutes, les messages Pub/Sub attendent, aucune perte. »',
model:['Cancel perd l’état (dédup, dernières versions vues) : après la relance, des versions anciennes rejouées peuvent écraser des récentes.','3 minutes de coupure à chaque release freinent la fréquence de déploiement : on déploiera moins souvent, donc des changements plus gros, donc plus risqués.','Alternative : --update quand compatible (la majorité des releases), drain + lancement sinon, snapshot avant les changements d’état. Le CI peut tenter update puis replier sur drain.','Les messages « attendent » : vérifier la rétention et l’alerte sur oldest_unacked_message_age pendant la fenêtre de release.']},
deliverable:'Runbook « Déployer, mettre à jour, arrêter le job d’indexation » validé en revue par un pair.'},

{n:9, title:'Observer et payer Dataflow', goal:'Lire un job Dataflow comme un tableau de bord d’avion : savoir en 30 s s’il va bien et où il part en vrille.',
lesson:[
 {h:'Les quatre métriques', key:true, p:'<ul><li><b>Data freshness</b> : âge du watermark. Ton SLO de fraîcheur, directement.</li><li><b>System lag</b> : temps max qu’un élément attend d’être traité. Monte avant la fraîcheur.</li><li><b>Backlog</b> (bytes/seconds) : ce qu’il reste à lire, et le temps estimé pour le résorber.</li><li><b>Throttling et CPU par worker</b> : saturation d’un sink ou hot key.</li></ul>Ces métriques existent dans Cloud Monitoring et dans l’intégration Datadog GCP ; l’équipe doit avoir un dashboard par job avec ces quatre courbes en haut.'},
 {h:'Lire le graphe d’exécution', p:'Chaque étape affiche le temps mur et le débit. Une étape avec un temps mur très supérieur aux autres est le goulot. Les étapes fusionnées apparaissent ensemble ; un Reshuffle les sépare. Les logs worker vont dans Cloud Logging ; les exceptions répétées remontent dans Error Reporting.'},
 {h:'Le modèle de coût', key:true, p:'vCPU-heure + Go-heure de mémoire des workers, + <b>Streaming Engine</b> (unités de calcul liées au volume d’état et de shuffle), + disque. Trois leviers : limiter les workers (max_num_workers, machine plus petite), réduire le shuffle (Combine au lieu de GroupByKey, moins de GroupByKey inutiles), réduire l’état (purges). Mesurer avant de toucher : un job à 400 €/mois ne mérite pas une semaine d’optimisation.'},
 {h:'Alerter sur le symptôme', p:'Alerte sur la fraîcheur (le symptôme que voit l’utilisateur), pas sur le CPU (la cause possible). Une alerte CPU à 80 % réveille pour rien pendant qu’un job à 30 % CPU avec un sink bloqué laisse l’index pourrir.'},
],
tasks:['Construire un dashboard Datadog « indexing » : fraîcheur, system lag, backlog, workers, erreurs. Le lier depuis le runbook.','Définir un SLO de fraîcheur (ex. : p99 < 5 min sur 30 jours) et créer le monitor associé avec un seuil d’alerte et un seuil d’avertissement.','Sortir le coût du job sur les 30 derniers jours (billing export BigQuery, labels) et le décomposer workers / Streaming Engine. Identifier le premier levier.'],
quiz:[
 {q:'System lag qui monte, fraîcheur stable, CPU à 40 %. Hypothèse la plus probable ?', o:['Pas assez de workers','Un sink lent ou throttlé bloque les bundles','Fenêtre trop grande'], a:1, e:'CPU bas + attente = le job attend quelque chose d’externe.'},
 {q:'Quelle alerte réveille à bon escient ?', o:['CPU worker > 80 %','Data freshness > SLO pendant 10 min','Nombre de workers = max'], a:1, e:'La fraîcheur est ce que l’utilisateur subit. Les autres sont des diagnostics.'},
 {q:'Le coût Streaming Engine double sans hausse de trafic. Cause probable ?', o:['Prix GCP','État par clé qui grossit (pas de purge) ou shuffle accru','Nouveau worker'], a:1, e:'Streaming Engine facture l’état et le shuffle traités.'},
],
critique:{who:'Plan d’optimisation présenté par un DE', text:'« Le job coûte 2 400 €/mois. Je propose de passer de n1-standard-4 à n2-highmem-8 pour aller plus vite, et de désactiver Streaming Engine qui coûte 900 €/mois. »',
model:['« Aller plus vite » : plus vite que quoi ? Quel est le goulot ? Sans profil d’étapes, changer la machine est un pari.','Désactiver Streaming Engine ramène l’état et le shuffle sur les disques des workers : moins cher en apparence, mais plus de workers, autoscaling moins réactif, update plus lent. Le total peut monter.','Les 900 € de Streaming Engine signalent sans doute un état volumineux : purge des timers, dédup avec TTL trop long ? Attaquer la cause.','Méthode de lead : mesurer (étapes, état, shuffle), hypothèse, changement unique, mesure à J+7. Un seul changement à la fois.']},
deliverable:'Dashboard + SLO de fraîcheur en prod, et une note « Coût du job et premier levier ».'},

{n:10, title:'Sinks : écrire juste et pas cher', goal:'Choisir le bon mode d’écriture BigQuery et vers l’index selon les garanties et le budget.',
lesson:[
 {h:'BigQuery : trois chemins', key:true, p:'<ul><li><b>Storage Write API</b> (<code>STORAGE_WRITE_API</code>) : le chemin moderne. Exactly-once possible (streams committed/pending), moins cher que les streaming inserts, faible latence. Par défaut dans les SDK récents.</li><li><b>Streaming inserts</b> (legacy) : plus cher, dédup best-effort via insertId, buffer de streaming qui limite les DML.</li><li><b>File loads</b> : batch par fichiers GCS, gratuit en ingestion, latence de minutes. Parfait si la fraîcheur tolère 5 à 15 min.</li></ul>Dans Beam Python : <code>WriteToBigQuery(method=...)</code>, avec <code>triggering_frequency</code> pour les loads en streaming.'},
 {h:'Index de recherche', p:'Bulk, pas unitaire : <code>GroupIntoBatches</code> de 200 à 1 000 documents, timeout de quelques secondes pour ne pas sacrifier la fraîcheur. Upsert conditionnel par version (<code>if_seq_no</code> ou version externe selon le moteur) pour que les rejeux soient inoffensifs. Backpressure : si l’index répond 429/503, backoff dans le DoFn, pas de retry infini silencieux.'},
 {h:'Pub/Sub et GCS en sortie', p:'Republier des événements dérivés (vidéo indexée) permet aux autres équipes de s’abonner sans lire l’index. Écrire des fichiers fenêtrés sur GCS (<code>WriteToFiles</code>) est le moyen le plus simple d’archiver un flux pour le rejeu ou l’analyse.'},
 {h:'Table de passage et DLQ de sortie', key:true, p:'Les écritures en échec définitif (schéma BigQuery incompatible, document rejeté) vont dans une table ou un topic « failed_rows » avec la raison. <code>WriteToBigQuery</code> expose <code>failed_rows</code>. Sans ça, le job « réussit » et les données manquent.'},
],
tasks:['Vérifier le mode d’écriture BigQuery du job de prod et estimer le gain d’un passage à Storage Write API (prix streaming inserts vs Write API sur ton volume).','Vérifier la taille des bulks vers l’index et le comportement sur 429 : lire le code, faire un test en préprod avec l’index ralenti ou limité.','Brancher les failed_rows (BigQuery) et les rejets de l’index vers une table d’erreurs + monitor Datadog.'],
quiz:[
 {q:'Fraîcheur acceptable : 10 min. Mode BigQuery le moins cher ?', o:['Streaming inserts','Storage Write API','File loads avec triggering_frequency'], a:2, e:'L’ingestion par load est gratuite ; la latence de minutes est dans le budget.'},
 {q:'Un rejeu Pub/Sub de 2 h provoque des documents plus anciens écrasant des récents dans l’index. Correctif ?', o:['Désactiver le rejeu','Upsert conditionnel par version externe','Index réduit'], a:1, e:'La version de la donnée décide, pas l’ordre d’arrivée.'},
 {q:'Le job est vert, mais 3 % des lignes manquent en BigQuery. Où regarder d’abord ?', o:['Quotas Pub/Sub','La sortie failed_rows / erreurs de schéma','Le watermark'], a:1, e:'Les échecs d’écriture sont souvent avalés si personne ne lit la sortie d’erreurs.'},
],
critique:{who:'Revue d’architecture de la sortie du pipeline', text:'« Le job écrit chaque document dans l’index un par un, avec 3 retries immédiats. En cas d’échec après 3 essais, on log et on continue. Les lignes BigQuery sont écrites en streaming inserts pour avoir le temps réel. »',
model:['Écriture unitaire : charge inutile sur l’index. Batcher.','3 retries immédiats sur un 503 aggravent l’incident côté index. Backoff exponentiel avec jitter.','« On log et on continue » = perte silencieuse. Les échecs définitifs doivent être matérialisés (table/topic) et alertés, et une réconciliation doit les rattraper.','Streaming inserts « pour le temps réel » : Storage Write API est aussi en temps réel, moins cher, exactly-once. Quelle fraîcheur BigQuery est réellement requise ? Souvent file loads suffisent.']},
deliverable:'Revue d’architecture écrite du pipeline d’indexation actuel : forces, 3 risques, 3 actions chiffrées. C’est ta première revue formelle.'},

/* ===== P3 ARCHITECTURE & SENS CRITIQUE ===== */
{n:11, title:'Les sept questions du lead', goal:'Avoir un réflexe de questionnement structuré face à toute proposition technique, y compris la tienne.',
lesson:[
 {h:'Pourquoi le sens critique s’apprend', key:true, p:'Un bon ingénieur trouve une solution. Un lead trouve le problème derrière la demande, les alternatives qu’on n’a pas regardées, et la façon dont ça va casser. Ce n’est pas du talent, c’est une check-list appliquée jusqu’à devenir un réflexe. Les sept questions ci-dessous sont celles que tu dois pouvoir poser en réunion sans notes d’ici 4 semaines.'},
 {h:'Les sept questions', key:true, p:'<ol style="margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px"><li><b>Quel problème, pour qui ?</b> En une phrase, sans nom de techno.</li><li><b>Que se passe-t-il si on ne fait rien</b> pendant 6 mois ?</li><li><b>Quelles alternatives</b>, y compris la plus bête (un cron, un SQL, un message Slack) ?</li><li><b>Comment ça casse ?</b> À ×10 de volume, avec une dépendance en panne, avec un rejeu, avec un humain qui se trompe.</li><li><b>Combien ça coûte</b> à construire, à faire tourner, à maintenir (en personnes), et combien ça rapporte ?</li><li><b>Est-ce réversible ?</b> Porte à un sens ou à deux sens. Les décisions réversibles se prennent vite.</li><li><b>Comment saura-t-on que ça marche ?</b> Métrique, seuil, date de vérification.</li></ol>'},
 {h:'Les signaux d’alerte', p:'<ul><li>La solution est nommée avant le problème (« on va mettre du Kafka »).</li><li>Aucun chiffre : pas de volume, pas de latence cible, pas de coût.</li><li>« Ça scalera », « c’est temporaire », « on a toujours fait comme ça », « tout le monde fait ça ».</li><li>Aucun mode de défaillance décrit. Toute architecture sans section « ce qui va mal » est incomplète.</li><li>Une seule option présentée. Un choix sans alternative n’est pas un choix.</li></ul>'},
 {h:'Ordre de grandeur en 60 secondes', p:'Entraîne-toi à estimer avant de mesurer : 120 M vidéos × 2 Ko = 240 Go d’état ; 300 msg/s × 86 400 = 26 M/jour ; un worker Dataflow traite ~1 000 à 5 000 éléments/s simples. Avoir ces chiffres en tête permet de dire « ce n’est pas là que c’est cher » en réunion.'},
],
tasks:['Choisir un projet en cours dans l’équipe et répondre par écrit aux sept questions, en 15 lignes max. Repérer celle à laquelle personne n’a de réponse.','Faire un pré-mortem seul : « nous sommes dans 6 mois, le projet a échoué. Pourquoi ? » Lister 5 causes, choisir la plus probable, proposer une parade.','En réunion cette semaine, poser une seule fois une des sept questions à voix haute. Noter la réaction.'],
quiz:[
 {q:'Un collègue ouvre : « il nous faut Kafka pour le streaming ». Première question de lead ?', o:['Quelle version de Kafka ?','Quel problème résout-on, pour qui, et que fait Pub/Sub de mal aujourd’hui ?','Combien ça coûte ?'], a:1, e:'La solution précède le problème : revenir au problème avant tout.'},
 {q:'Décision à deux sens (réversible en une journée). Comment la traiter ?', o:['Design doc complet, comité','La prendre vite, mesurer, revenir si besoin','L’escalader'], a:1, e:'Le temps de décision doit être proportionnel à l’irréversibilité.'},
 {q:'Quelle section manque le plus souvent dans un design doc ?', o:['Le schéma','Les modes de défaillance et le plan de retour arrière','La stack'], a:1, e:'On décrit ce qui marche, rarement ce qui casse.'},
],
critique:{who:'Demande de la direction produit', text:'« On veut une recherche personnalisée en temps réel : les résultats doivent se réordonner selon ce que l’utilisateur vient de regarder, dans la seconde. L’équipe data peut livrer ça pour le prochain trimestre ? »',
model:['Question 1 : quel problème ? Hypothèse : améliorer le taux de clic sur la recherche. Quel est le taux actuel, quel gain est attendu ? Sans ça, impossible de dimensionner l’effort.','« Dans la seconde » : est-ce un besoin ou une image ? Un réordonnancement basé sur la session des 5 dernières minutes vaut 95 % de la valeur pour 10 % de la complexité.','Alternative simple : features de session calculées côté client ou dans un cache (un historique de visionnage en cache existe souvent déjà), pas un pipeline de streaming supplémentaire.','Mode de défaillance : la personnalisation en temps réel crée des boucles (on te montre ce que tu viens de voir). Qui définit les garde-fous ?','Réponse de lead : « oui, en deux étapes : session de 5 min au trimestre prochain, mesure de l’impact, puis temps réel si la mesure le justifie. » Un oui conditionnel et mesurable.']},
deliverable:'Ta fiche personnelle « 7 questions + signaux d’alerte », imprimée ou épinglée, utilisée en réunion.'},

{n:12, title:'ADR, design docs et revue de design', goal:'Écrire une décision que quelqu’un comprendra dans deux ans, et relire celles des autres avec des questions plutôt que des opinions.',
lesson:[
 {h:'L’ADR : court, daté, honnête', key:true, p:'Un Architecture Decision Record tient en une page : <b>Contexte</b> (le problème et les contraintes, chiffrées), <b>Options</b> (au moins deux, avec leurs inconvénients réels), <b>Décision</b>, <b>Conséquences</b> (ce qu’on accepte de perdre), <b>Statut</b> (proposé, accepté, remplacé par). Numéroté, versionné dans le repo. Un choix d’outil déjà fait dans l’équipe (par exemple Feast comme feature store) mérite un ADR rétroactif : c’est l’exercice de la semaine.'},
 {h:'Le design doc : pour les décisions à un sens', p:'Objectif et non-objectifs, contexte, architecture proposée, alternatives rejetées et pourquoi, modes de défaillance, sécurité et coûts, plan de déploiement et de retour arrière, métriques de succès, questions ouvertes. Rédigé avant de coder, relu par deux pairs dont un hors équipe. Le non-objectif est la section la plus utile : elle empêche le projet de grossir.'},
 {h:'Relire un design : questions, pas opinions', key:true, p:'« Je ferais autrement » n’aide personne. « Que se passe-t-il si le topic est rejoué sur 24 h ? » oblige l’auteur à penser. Hiérarchiser les commentaires : <b>bloquant</b> (perte de données, sécurité, irréversible), <b>important</b> (coût, complexité), <b>suggestion</b>. Commencer par ce qui est bien fait : c’est de l’information, pas de la politesse.'},
 {h:'Décider quand on n’est pas d’accord', p:'Exposer les options, les critères, le poids de chaque critère, puis trancher et le dire. « Disagree and commit » : une fois décidé, l’équipe exécute sans ressasser. Un lead qui ne tranche pas fait perdre plus de temps qu’un lead qui se trompe parfois sur une décision réversible.'},
],
tasks:['Écrire l’ADR rétroactif « Choix de Feast comme feature store » avec au moins deux alternatives réellement évaluées et les conséquences acceptées.','Relire un design doc ou une PR d’architecture de l’équipe avec la grille bloquant/important/suggestion. Formuler chaque commentaire comme une question.','Proposer à l’équipe un gabarit d’ADR et un dossier docs/adr dans un repo. Si ça existe déjà, l’améliorer.'],
quiz:[
 {q:'Quelle section d’un design doc empêche le projet de grossir ?', o:['Architecture','Non-objectifs','Métriques'], a:1, e:'Dire ce qu’on ne fait pas protège la portée.'},
 {q:'Comment formuler un retour sur une faille de rejeu ?', o:['« Il faut une dédup »','« Que se passe-t-il si on rejoue 24 h de messages ? »','« Ce design est incomplet »'], a:1, e:'La question fait réfléchir l’auteur et laisse la solution ouverte.'},
 {q:'Après un désaccord et une décision prise, le bon comportement ?', o:['Rouvrir le sujet chaque semaine','Exécuter pleinement, mesurer, revenir avec des données si besoin','Faire sa propre version'], a:1, e:'Disagree and commit.'},
],
critique:{who:'Design doc de 12 pages reçu pour revue', text:'Le document décrit une nouvelle architecture de recommandation en détail (schémas, code, infra Terraform) mais n’a pas de section « alternatives », pas de chiffres de volume, et la section « risques » dit : « risque faible, technologies maîtrisées ».',
model:['Pas d’alternatives : impossible de juger la décision. Demander l’option la plus simple envisagée et pourquoi elle a été rejetée.','Pas de chiffres : demander volume, latence cible, coût estimé. Un document de 12 pages sans un seul chiffre a été écrit pour convaincre, pas pour décider.','« Risque faible » n’est pas une analyse. Demander : quel est le mode de défaillance le plus probable et que fait-on ce jour-là ?','12 pages de détail d’implémentation avant d’avoir validé l’approche : proposer de scinder, 2 pages de décision d’abord.','Commentaire bloquant unique : « je ne peux pas évaluer sans alternatives et chiffres ». Le reste en suggestions.']},
deliverable:'ADR Feast mergé, et un gabarit d’ADR adopté (ou proposé) par l’équipe.'},

{n:13, title:'BigQuery à l’échelle', goal:'Transposer ton réflexe FinOps sur BigQuery : modèle de coût, partitions, slots, garde-fous.',
lesson:[
 {h:'Deux modèles de prix', key:true, p:'<b>On-demand</b> : ≈6,25 $/TiB scanné (région US), 1 TiB gratuit/mois. <b>Éditions</b> (Standard, Enterprise, Enterprise Plus) : slots réservés ou autoscalés, facturés à la slot-heure. Passer en éditions a du sens quand la facture on-demand mensuelle dépasse ce que coûterait une réservation modeste, ou pour isoler des charges (dashboards vs pipelines). Stockage : logique vs <b>physique</b> (compressé, souvent 3 à 5× moins cher pour des données compressibles), long-term à 50 % après 90 jours sans modification.'},
 {h:'Partitionner et clusteriser', key:true, p:'Partition par date (colonne ou ingestion) ou par plage d’entiers ; jusqu’à 10 000 partitions. Clustering jusqu’à 4 colonnes, dans l’ordre des filtres les plus fréquents. <code>require_partition_filter</code> empêche les scans complets accidentels. Expiration de partition pour les tables d’événements. Une table de 50 To non partitionnée interrogée par 20 dashboards est une facture, pas une table.'},
 {h:'Ce qui coûte sans qu’on le voie', p:'<ul><li><code>SELECT *</code> sur des tables larges (facturé par colonne lue).</li><li>Dashboards sans cache ni vue matérialisée, rafraîchis toutes les 5 min.</li><li>Streaming inserts (voir semaine 10).</li><li>Jointures sans filtre de partition sur les deux côtés.</li></ul>Garde-fous : <code>maximum_bytes_billed</code> par requête, quotas personnalisés par utilisateur/projet, alertes de budget, labels sur tous les jobs.'},
 {h:'Vues matérialisées, BI Engine, résultats en cache', p:'Les vues matérialisées accélèrent et réduisent le coût des agrégats fréquents (rafraîchissement incrémental). BI Engine met en mémoire pour les dashboards. Le cache de résultats est gratuit mais invalidé par toute écriture : des tables de faits en append continu n’en profitent jamais.'},
],
tasks:['Sortir le top 20 des requêtes les plus chères des 30 derniers jours (INFORMATION_SCHEMA.JOBS) : utilisateur, octets, coût. Identifier le premier motif de gaspillage.','Lister les tables > 1 To sans partition ou sans clustering, et proposer un plan de migration pour les 3 plus interrogées.','Estimer si une réservation de slots (édition Standard) serait moins chère que l’on-demand actuel, avec les chiffres réels.'],
quiz:[
 {q:'Table d’événements de 50 To, requêtes toujours filtrées sur 7 jours. Premier levier ?', o:['Réservation de slots','Partition par jour + require_partition_filter','Vue matérialisée'], a:1, e:'La partition réduit les octets scannés de 50 To à quelques centaines de Go.'},
 {q:'Quel réglage empêche un analyste de scanner 40 To par erreur ?', o:['Clustering','maximum_bytes_billed / quota personnalisé','BI Engine'], a:1, e:'Garde-fou par requête ou par utilisateur.'},
 {q:'Facturation stockage physique : quand est-elle avantageuse ?', o:['Toujours','Quand les données sont très compressibles et peu de time travel','Jamais'], a:1, e:'Le physique facture les octets compressés plus le time travel ; à évaluer par dataset.'},
],
critique:{who:'Proposition d’un analyste senior', text:'« BigQuery coûte 18 k€/mois. Passons tout en réservation de 500 slots Enterprise, comme ça la facture sera fixe et les analystes ne seront plus bridés. »',
model:['Fixe n’est pas moins cher : chiffrer. 500 slots Enterprise sur un mois peut dépasser 18 k€. Et l’on-demand a souvent un pic très concentré que l’autoscaling de slots absorbe mieux.','« Ne seront plus bridés » : avec des slots fixes, les gros scans ralentissent tout le monde au lieu de coûter. Le problème change de nature, il ne disparaît pas.','Attaquer d’abord les causes : top 20 des requêtes, partitions, SELECT *. L’expérience FinOps sur les autres entrepôts dit que le levier est dans les patterns de requêtes.','Si réservation : commencer petit (100 slots baseline + autoscale), isoler dashboards et pipelines, mesurer 1 mois.']},
deliverable:'Note FinOps BigQuery : constat chiffré, 3 actions, économie estimée, et la décision on-demand/éditions argumentée.'},

{n:14, title:'Choisir une architecture streaming', goal:'Défendre, avec des critères explicites, le choix Pub/Sub + Dataflow face à Kafka + Flink, ou l’inverse, selon le contexte.',
lesson:[
 {h:'Comparer sur des critères, pas des préférences', key:true, p:'Critères : garanties (ordre, exactly-once, rétention/rejeu), opérations (qui est d’astreinte, patching, upgrades), coût total à 1× et 10×, écosystème (connecteurs, équipe qui sait), portabilité, latence réelle. Donner un poids à chaque critère <b>avant</b> de noter les options, sinon on note pour justifier son choix.'},
 {h:'Pub/Sub + Dataflow contre Kafka + Flink', p:'<ul><li><b>Pub/Sub</b> : zéro opération, scaling automatique, rétention ≤ 31 jours, ordre par clé limité. <b>Kafka</b> : rétention illimitée, partitions explicites, ordre fort par partition, log compaction, mais un cluster à opérer (ou Confluent/Managed Kafka à payer).</li><li><b>Dataflow</b> : managé, Beam portable, autoscaling, update d’état. <b>Flink</b> : état plus riche, latence plus basse, communauté SQL forte, mais une plateforme à opérer (ou BigQuery Engine for Flink / Confluent Flink).</li></ul>Pour une équipe de 10 déjà sur GCP, à ton volume, Pub/Sub + Dataflow gagne sur l’opérationnel. Kafka se justifie par une rétention longue, une sémantique de log compacté, ou des consommateurs hors GCP.'},
 {h:'Streaming, micro-batch, ou simplement batch', key:true, p:'Un batch Airflow toutes les 5 minutes sur BigQuery (ou dbt incrémental) couvre énormément de besoins « temps réel » à une fraction de la complexité. Lambda (batch + stream en parallèle) double le code ; Kappa (tout en stream, rejeu pour l’historique) demande une rétention longue. Règle : commencer par la fraîcheur la plus lente que le métier accepte, et ne descendre que sur mesure.'},
 {h:'Build vs buy', p:'Une solution managée coûte plus en licence et moins en personnes. Une personne à temps plein coûte 80 à 120 k€/an chargé : c’est l’unité de comparaison. « On peut le faire nous-mêmes » doit être traduit en mois-personnes et en astreinte.'},
],
tasks:['Rédiger une matrice de décision (critères pondérés, 3 options) pour le pipeline d’indexation : Pub/Sub+Dataflow actuel, Kafka+Flink managé, micro-batch Airflow 5 min. Conclure.','Pour chaque flux « temps réel » de l’équipe, noter la fraîcheur réellement nécessaire et celle fournie. Repérer un flux sur-dimensionné.','Préparer une réponse de 2 minutes à « pourquoi pas Kafka ? » que tu pourrais donner à un CTO.'],
quiz:[
 {q:'Besoin : rejouer 6 mois d’événements à la demande, consommateurs sur AWS et GCP. Option favorisée ?', o:['Pub/Sub seul','Kafka (rétention longue, multi-cloud) ou Pub/Sub + archive GCS','Dataflow batch'], a:1, e:'Pub/Sub plafonne à 31 jours ; l’archive GCS ou Kafka répond au rejeu long.'},
 {q:'Quand noter les options d’une matrice de décision ?', o:['Avant de choisir les critères','Après avoir fixé critères et poids','Après la décision'], a:1, e:'Sinon les critères sont choisis pour justifier l’option préférée.'},
 {q:'Un flux « temps réel » dont le dashboard est consulté le lundi matin. Recommandation ?', o:['Garder le streaming','Batch quotidien ou horaire, économiser le streaming','Ajouter Flink'], a:1, e:'La fraîcheur fournie doit suivre l’usage réel.'},
],
critique:{who:'Argumentaire d’un architecte externe', text:'« Vous devriez migrer vers Kafka + Flink : c’est le standard de l’industrie, Netflix et Uber l’utilisent, et vous ne serez plus dépendants de Google. Dataflow est une boîte noire. »',
model:['« Standard de l’industrie » et « Netflix l’utilise » ne sont pas des critères : Netflix a 200 ingénieurs plateforme. Quelle contrainte de ton contexte Pub/Sub ne satisfait-il pas ?','« Dépendants de Google » : vous êtes déjà sur BigQuery, GKE, IAM. Le lock-in streaming est marginal ; Beam est d’ailleurs portable vers Flink.','« Boîte noire » : métriques, graphe d’exécution, logs, update… c’est plus observable que la plupart des clusters Flink maison.','Coût réel : qui opère Kafka ? Astreinte, upgrades, rééquilibrages. En mois-personnes.','Réponse de lead : « montrez-moi un besoin concret non couvert (rétention > 31 j ? latence < 100 ms ? consommateurs hors GCP ?). Si oui, on évalue sur une matrice. Sinon, non. »']},
deliverable:'Note de décision « Architecture streaming de l’indexation » avec matrice pondérée, partagée au lead/manager.'},

/* ===== P4 FIABILITÉ ===== */
{n:15, title:'SLO et alertes qui comptent', goal:'Définir des objectifs de service pour la donnée et une alerte dont chaque réveil est justifié.',
lesson:[
 {h:'Trois SLO pour la donnée', key:true, p:'<b>Fraîcheur</b> (âge de la donnée la plus récente disponible), <b>complétude</b> (part des entités attendues présentes, ex. : 99,9 % des vidéos modifiées indexées sous 10 min), <b>exactitude</b> (écart par rapport à la source, mesuré par réconciliation). Chaque SLO a un SLI mesurable, une cible, une fenêtre (30 jours) et un budget d’erreur. Dépasser le budget gèle les nouveautés et déclenche du travail de fiabilité : c’est la règle qui donne du poids au SLO.'},
 {h:'Symptôme contre cause', p:'Alerter sur ce que subit l’utilisateur (fraîcheur, erreurs visibles), pas sur les causes possibles (CPU, pods, backlog). Les causes vont dans le dashboard, pas dans le pager. Chaque alerte doit avoir : un seuil justifié par le SLO, un runbook lié, un propriétaire, et une revue mensuelle de son ratio bruit/action.'},
 {h:'Astreinte data : règles saines', key:true, p:'Une alerte qui n’exige pas d’action humaine immédiate n’est pas une page. Un ticket du matin suffit pour 80 % des problèmes data. Rotation claire, horaires définis, et un temps réservé après chaque astreinte pour corriger ce qui a réveillé. Ton rôle de lead : défendre ce temps.'},
 {h:'Revue d’alerting', p:'Chaque mois : lister les alertes déclenchées, classer en « action prise / bruit / inutile ». Supprimer ou re-seuiller tout ce qui est bruit deux mois de suite. Le nombre d’alertes n’est pas une mesure de sérieux ; le ratio action/déclenchement l’est.'},
],
tasks:['Rédiger les trois SLO de l’indexation (fraîcheur, complétude, exactitude) avec SLI, cible, fenêtre, et ce qui se passe quand le budget est épuisé.','Exporter les alertes Datadog déclenchées sur 30 jours pour l’équipe. Classer action/bruit. Proposer la suppression ou le re-seuillage de 3 alertes.','Pour chaque monitor critique, vérifier qu’un runbook est lié. En écrire un manquant.'],
quiz:[
 {q:'Quelle alerte doit réveiller la nuit ?', o:['Backlog Pub/Sub > 10 000','Fraîcheur de l’index > SLO depuis 15 min','Pod Kubernetes redémarré'], a:1, e:'Symptôme utilisateur, lié au SLO.'},
 {q:'Le budget d’erreur du mois est consommé le 12. Conséquence prévue ?', o:['Aucune','Priorité à la fiabilité jusqu’à retour sous la cible, nouveautés en pause','Changer la cible'], a:1, e:'Sans conséquence, le SLO est une décoration.'},
